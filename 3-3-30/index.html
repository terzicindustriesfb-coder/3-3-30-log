<title>3-3-30 Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
/* Layout: phone-first single column (max 560px). Three screens: the home screen with a card for each exercise,
   "My results" and "Settings"; bottom sheets for what is done seldom. An open card fits one screen.
   Direction "Platform": chalk (light) and rubber floor (dark); the only saturated colours are the
   bumper plates (red = push, blue = pull, yellow = legs, green = success) and the red LED clock.
   Archivo condensed for titles and numbers, Archivo expanded for stamped labels, Instrument Sans for text. */
:root {
  --bg: #F3F1EC;
  --surface: #FFFFFF;
  --surface-2: #E9E6DF;
  --surface-3: #DCD8CF;
  --ink: #16181B;
  --ink-2: #4A4E55;
  --muted: #5E626A;
  --line: #DAD6CD;
  --push: #CC2D27;
  --pull: #1E58C8;
  --legs: #F2B807;
  --legs-mark: #8F6600;
  --on-push: #FFFFFF;
  --on-pull: #FFFFFF;
  --on-legs: #1F1700;
  --ring: #C9C4B8;
  --good: #177A41;
  --good-wash: #E1F2E7;
  --on-good: #FFFFFF;
  --good-ink: #125F33;
  --dot: #8F8A7E;
  --warn: #8F5400;
  --warn-wash: #F6E8CF;
  --bad: #B3261E;
  --primary: #16181B;
  --on-primary: #F3F1EC;
  --seg-on: #FFFFFF;
  --shadow: inset 0 1px 0 rgb(255 255 255 / .8), 0 1px 2px rgb(40 30 10 / .06), 0 10px 24px -14px rgb(40 30 10 / .22);
  --clock-bg: #0D0E10;
  --clock-edge: #2A2E33;
  --led-on: #FF3D2E;
  --led-off: #24100E;
  --led-lead: #FFB020;
  --c-push: #CC2D27; --c-pull: #1E58C8; --c-legs: #8F6600;   /* chart lines, validated vs the card surface */
  --display: "Archivo", "Archivo Narrow", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 18px;
  --r: 14px;
  --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #1B1E22; --surface-2: #25292E; --surface-3: #30353C; --ink: #ECEAE4; --ink-2: #B9B6AE;
    --muted: #97948D; --line: #30353C; --push: #FF5A47; --pull: #5B8DF0; --legs: #F5C531; --legs-mark: #C99A12;
    --on-push: #1A0705; --on-pull: #0A1020; --on-legs: #1F1700; --ring: #4B515A; --good: #45C07A; --good-wash: #16301F; --on-good: #08140D; --dot: #7C828C; --good-ink: #8FE0B0;
    --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C; --primary: #ECEAE4; --on-primary: #121417; --seg-on: #3A3F47;
    --c-push: #F2483A; --c-pull: #5B8DF0; --c-legs: #B88A0A;
    --shadow: inset 0 1px 0 rgb(255 255 255 / .05); --clock-bg: #08090A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1B1E22; --surface-2: #25292E; --surface-3: #30353C; --ink: #ECEAE4; --ink-2: #B9B6AE;
  --muted: #97948D; --line: #30353C; --push: #FF5A47; --pull: #5B8DF0; --legs: #F5C531; --legs-mark: #C99A12;
  --on-push: #1A0705; --on-pull: #0A1020; --on-legs: #1F1700; --ring: #4B515A; --good: #45C07A; --good-wash: #16301F; --on-good: #08140D; --dot: #7C828C; --good-ink: #8FE0B0;
  --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C; --primary: #ECEAE4; --on-primary: #121417; --seg-on: #3A3F47;
    --c-push: #F2483A; --c-pull: #5B8DF0; --c-legs: #B88A0A;
  --shadow: inset 0 1px 0 rgb(255 255 255 / .05); --clock-bg: #08090A; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--pull); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::placeholder { color: var(--muted); opacity: 1; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(28px + env(safe-area-inset-bottom, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-block: 12px 8px; background: var(--bg); }
.brand { font-family: var(--display); font-stretch: 112%; font-weight: 900; font-size: 21px; letter-spacing: -.01em; line-height: 1; }
.brand i { font-style: normal; color: var(--push); }

.date { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }

/* Type */
.title { font-family: var(--display); font-stretch: 68%; font-weight: 800; font-size: clamp(36px, 10.5vw, 46px); line-height: .95; letter-spacing: -.01em; }
.h2 { font-family: var(--display); font-stretch: 72%; font-weight: 800; font-size: 24px; line-height: 1.05; }
.eyebrow { font-family: var(--display); font-stretch: 125%; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--ink-2); font-size: 17px; }
.small { font-size: 14px; color: var(--ink-2); }
.tiny { font-size: 12.5px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.title, .h2, .ex-n, .note-text { overflow-wrap: anywhere; hyphens: auto; }

/* Building blocks */
.stack { display: grid; gap: 14px; }
.head { display: grid; gap: 6px; padding-block: 6px 4px; }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card > * { min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }
.notice { border-radius: var(--r); padding: 12px 14px; background: var(--warn-wash); color: var(--ink); font-size: 14px; display: grid; gap: 6px; margin-bottom: 12px; }

.btn { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 750; font-size: 16px; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; min-height: 48px; background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.xl { min-height: 56px; font-size: 18px; width: 100%; font-family: var(--display); font-stretch: 100%; font-weight: 800; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: transparent; box-shadow: inset 0 0 0 1.5px var(--bad); color: var(--bad); }
.btn.good { background: var(--good); color: var(--on-good); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 14px; }
.btn.link { background: none; padding: 8px 4px; min-height: 40px; color: var(--ink-2); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.iconbtn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 22px; height: 22px; }

.chip { display: inline-flex; align-items: center; border-radius: 6px; padding: 3px 8px; font-family: var(--display); font-stretch: 125%; font-size: 10.5px; font-weight: 800;
  letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; line-height: 1.35; }
.chip.push { background: var(--push); color: var(--on-push); }
.chip.pull { background: var(--pull); color: var(--on-pull); }
.chip.legs { background: var(--legs); color: var(--on-legs); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 650;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-wash); color: var(--good); }
.pill.warn { background: var(--warn-wash); color: var(--warn); }
.pill.live { background: var(--push); color: var(--on-push); }

/* Weight plate glyph: a disc with a hub, in the slot's colour */
.plate { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; position: relative; }
.plate::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 3px rgb(0 0 0 / .12); }
.plate.push { background: var(--push); } .plate.pull { background: var(--pull); } .plate.legs { background: var(--legs); }
.plate.sm { width: 28px; height: 28px; } .plate.sm::after { width: 8px; height: 8px; box-shadow: 0 0 0 2px rgb(0 0 0 / .12); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; max-width: 100%; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; min-height: 36px; font-weight: 750; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.seg.scroll { flex-wrap: nowrap; overflow-x: auto; justify-self: start; }
.seg.full { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.seg.scroll button { flex: none; white-space: nowrap; }

/* Exercise rows */
.ex-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ex-row { width: 100%; border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 12px; padding: 10px 6px; border-radius: var(--r); }
.ex-row:hover { background: var(--surface-2); }
.ex-main { display: grid; gap: 1px; min-width: 0; }
.ex-n { font-family: var(--display); font-stretch: 75%; font-weight: 750; font-size: 19px; line-height: 1.1; }
.ex-sub { font-size: 13.5px; color: var(--muted); }
.ex-sub b { color: var(--ink-2); }
.ex-kg { font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chev { color: var(--muted); }
.up { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; background: var(--good-wash); color: var(--good); border-radius: var(--r);
  padding: 10px 12px; font-size: 14px; font-weight: 650; }

.delta { font-weight: 800; font-size: 14px; white-space: nowrap; }
.delta.pos { color: var(--good); }
.delta.neg { color: var(--bad); }

/* Forms */
.f { display: grid; gap: 6px; font-size: 14px; font-weight: 650; color: var(--ink-2); min-width: 0; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; border: 0; box-shadow: inset 0 0 0 1.5px var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 11px 13px; min-height: 48px; font-size: 16px; }
input:focus, select:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pull); }
input, select, textarea { font-weight: 500; }
textarea { min-height: 76px; resize: vertical; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices button { border: 0; border-radius: 999px; padding: 8px 13px; min-height: 40px; font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--ink-2); }
.choices button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.choices button:disabled { opacity: .5; }

.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); font-size: 22px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.stepper .val { min-width: 104px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; padding-inline: 6px; font-size: 16px; }

/* The LED digits of the clock, the number pad and the list of sets */
.led .seg { fill: var(--led-off); }
.led .seg.on { fill: var(--led-on); }
.led .on, .led .colon { filter: drop-shadow(0 0 5px rgb(255 61 46 / .5)); }
.led.amber .seg.on, .led.amber .colon { fill: var(--led-lead); filter: drop-shadow(0 0 5px rgb(255 176 32 / .5)); }
.led.run .colon { animation: tick 1s step-end infinite; }
@keyframes tick { 50% { opacity: .25; } }
.led.lead .seg.on, .led.lead .colon { fill: var(--led-lead); filter: drop-shadow(0 0 5px rgb(255 176 32 / .5)); }
.led .colon { fill: var(--led-on); }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.pad button { min-height: 50px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: var(--shadow); font-family: var(--display); font-stretch: 80%;
  font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.pad button.last { box-shadow: inset 0 0 0 2.5px var(--ink); }
.pad button:active { transform: scale(.95); background: var(--surface-2); }
.pad.off { opacity: .35; pointer-events: none; }
.setlist { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-height: 26px; font-size: 13px; color: var(--muted); }
.setlist span { background: var(--surface-2); color: var(--ink-2); border-radius: 7px; padding: 1px 8px; font-weight: 750; font-variant-numeric: tabular-nums; }
.flash { animation: flash .45s ease-out; }
@keyframes flash { from { color: var(--good); transform: scale(1.06); } to { color: inherit; transform: none; } }

.sum-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 8px; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 70; background: rgb(6 8 10 / .5); display: grid; align-items: end; justify-items: center; }
.sheet-panel { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0;
  padding-inline: 16px; padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px;
  box-shadow: 0 -10px 40px rgb(0 0 0 / .3); border-top: 1px solid var(--line); animation: rise .22s cubic-bezier(.2,.8,.2,1); }
.sheet-panel::before { content: ""; justify-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--surface-3); }
@keyframes rise { from { transform: translateY(28px); } to { transform: none; } }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 650; font-size: 14px;
  width: max-content; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgb(0 0 0 / .25); text-align: center; pointer-events: none; }

.skeleton { color: var(--muted); padding-block: 48px; text-align: center; }
#sheet:not([hidden]) ~ #toast { bottom: auto; top: calc(10px + env(safe-area-inset-top, 0px)); }

.kg-in { width: 96px !important; min-height: 44px !important; padding: 6px 8px !important; text-align: center; font-weight: 800 !important; font-size: 16px; background: transparent !important; box-shadow: none !important; font-variant-numeric: tabular-nums; }
.kg-in:focus { box-shadow: inset 0 0 0 2px var(--pull) !important; background: var(--surface) !important; }

  

/* A line chart, drawn at the width of its box */
.pg-svg { position: relative; min-height: 96px; min-width: 0; }
.pg-svg svg { max-width: 100%; }
.pg-svg svg { display: block; overflow: visible; touch-action: pan-y; }
.pg-svg svg:focus:not(:focus-visible) { outline: none; }
.pg-svg text { font-family: var(--body); fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.pg-svg .grid { stroke: var(--line); stroke-width: 1; }
.pg-svg .xh { stroke: var(--ink-2); stroke-width: 1; }
.pg-svg .tip { position: absolute; top: -8px; transform: translate(-50%, -100%); pointer-events: none; background: var(--ink); color: var(--bg);
  border-radius: 10px; padding: 5px 9px; font-size: 11.5px; line-height: 1.3; white-space: normal; width: max-content; max-width: 100%; box-shadow: 0 6px 18px rgb(0 0 0 / .2); z-index: 3; }
.pg-svg .tip strong { display: block; font-size: 14px; }
.pg-wait { min-height: 60px; display: grid; align-items: center; }
.seg.scroll { min-width: 0; max-width: 100%; }
.seg.scroll button { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; }
.stack { grid-template-columns: minmax(0, 1fr); }
.ex-row.static { cursor: default; } .ex-row.static:hover { background: transparent; }
.empty { text-align: center; padding: 18px 8px; }
.lf { gap: 0; padding-block: 4px; }
.lf-block { display: grid; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.lf-block:first-child { border-top: 0; }
.lf-nums { align-items: end; }
.lf-block select { flex: 1; min-width: 0; }
/* A big number with a small label: the score to beat on a card, the reps of a finished exercise */
.goal { display: grid; justify-items: end; gap: 3px; }
.goal-n { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-size: 42px; line-height: .86; font-variant-numeric: tabular-nums; }
.goal-l { font-family: var(--display); font-stretch: 125%; font-size: 9.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.goal-l.pos { color: var(--good); }
.ex-sub .ex-kg { font-size: 15px; color: var(--ink-2); }
/* A workout as a list of its exercises: the sheet that shows a buddy’s workout */
.wo { padding: 12px 14px 8px; gap: 4px; }
.wo .ex-list { gap: 0; }
.wo .ex-list li + li { border-top: 1px solid var(--surface-2); }
.wo .ex-row { padding: 8px 4px; min-height: 64px; }
/* Sheets */
.swap-opt { width: 100%; border: 0; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); padding: 14px 16px; min-height: 64px;
  text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.swap-opt[aria-pressed="true"] { box-shadow: var(--shadow), inset 0 0 0 2px var(--ink); }
.swap-t { font-family: var(--display); font-stretch: 72%; font-weight: 800; font-size: 22px; line-height: 1.05; }
.swap-opt .small { grid-column: 1 / -1; }
.swap-next { border-radius: 999px; padding: 3px 10px; background: var(--primary); color: var(--on-primary); font-size: 13px; font-weight: 650; white-space: nowrap; }
.legend { display: grid; gap: 8px; padding: 4px 4px 0; }
.legend p { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); }
.legend i { margin-top: 4px; width: 14px; height: 14px; border-radius: 50%; }
.legend i.push { background: var(--push); } .legend i.pull { background: var(--pull); } .legend i.legs { background: var(--legs); }
.legend b { color: var(--ink); }
.sheet .choices button { min-height: 44px; padding: 8px 14px; }
form[data-form="ex"] .f .small, form[data-form="ex"] .f .tiny { font-weight: 400; }
.to-beat { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.to-beat .grow { display: grid; gap: 2px; }
.to-beat .goal-n { font-size: 36px; }
.ex-switch { display: grid; gap: 4px; text-align: center; }
.pick-group { padding: 4px 14px; gap: 0; }
.pick-row { width: 100%; border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto;
  align-items: center; gap: 10px; padding: 6px 4px; min-height: 54px; }
.pick-row + .pick-row { border-top: 1px solid var(--surface-2); }
.pick-row .ex-n { display: block; font-size: 17px; }
.pick-row .tiny { font-size: 13px; }
.pick-row svg { width: 20px; height: 20px; stroke-width: 2.8; color: var(--good); }
#exPickList { display: grid; gap: 10px; }
#exPickList .eyebrow { padding: 2px 4px 0; }
input[type="search"] { width: 100%; border: 0; box-shadow: inset 0 0 0 1.5px var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 11px 13px; min-height: 48px; font-size: 16px;
  -webkit-appearance: none; appearance: none; }
/* Back on top of "My results" and "Settings", and the two buttons under the home screen that lead there */
.scr-top { display: flex; padding-top: 2px; }
.btn.back { min-height: 44px; padding: 0 18px 0 12px; font-size: 15px; gap: 6px; }
.home-nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.home-nav .btn { box-shadow: inset 0 0 0 1.5px var(--ring); font-size: 15.5px; padding-inline: 8px; }
/* My results: the workout buttons and the table */
.lead-s { font-size: 15px; color: var(--ink-2); }
.res-tpl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.res-tpl button { min-height: 44px; border: 0; border-radius: 999px; padding: 0 6px; background: var(--surface-2); color: var(--ink-2); font-weight: 700; font-size: 14.5px; }

async function initStore() {

      if (user) uid = await user.id();

  } catch { db = null; }

    try { S.meInfo = await user.me(); } catch { /* ignore */ }

    let canWrite = null;

  scheduleRender();

function subscribeMembers() {
  const unsub = S.db.collection('members').onSnapshot(snap => {
    const seen = new Set();

      if (!ID_RE.test(d.id)) continue;
      seen.add(d.id);

      if (d.id === S.uid) {
        if (S.ownLocal) { if (!me().profile && prof) { me().profile = prof; saveOwnLocal(); } continue; }

        const n = normSession(d.data(), d.id);

async function resolvePeople() {

    const ids = [...S.members.keys()];

    let changed = false;
    for (const id of ids) {
      const p = ps[id]; if (!p) continue;
      const prev = S.people[id];

 * Domain logic

/* The clock on the button, per phase: the words under the digits, and its name for a screen reader. */
const CLOCK_WORDS = {

const ledClass = (phase, left) => (phase === 'lead' ? 'lead' : phase === 'paused' ? 'amber' : left <= 10 ? 'amber run' : 'run');

  const sets = c.sets.length ? `<div class="xc-setrow"><div class="xc-sets"><span class="xc-u">Your sets:</span> <span class="setlist">${c.sets.map(r => `<span>${r}</span>`).join(' ')}</span></div>

  return `<section class="card xc" data-slot="${c.slot}" data-form="open" aria-label="${SLOT[c.slot].label}: ${nm}">${top}

    ${over || lead ? '' : score}

/* The week counter: three dots and a few words. With buddies a row each: you first, then up to three of them. */

/* The go-heavier tip, as one tap (or a "not now" that this device remembers). */

/* ---------- My results ---------- */
function personPick() {

/* Workouts shown for a person: every finished one, practice workouts included. */
function shownSessions(pid) { return sessionsOf(pid).filter(finished(pid)); }
/* Small line charts, drawn at the real pixel width of their box so text never scales. */
const CH = {};
function chartBox(id, pts, slot) {
  CH[id] = { pts, slot };
  const first = pts[0], last = pts[pts.length - 1];
  return `<div class="pg-svg" data-chart="${esc(id)}" tabindex="0" role="img" aria-label="${esc(`${SLOT[slot].label}, ${last.ex}, reps: ${first.y} reps on ${dayShort(first.date)}, ${last.y} reps on ${dayShort(last.date)}. Arrow keys show each workout.`)}"></div>`;
}
function niceTicks(lo, hi, minStep) {
  if (hi - lo < minStep * 2) { lo = Math.max(0, lo - minStep); hi += minStep; }
  const raw = (hi - lo) / 2;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = Math.max(minStep, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag);
  const a = Math.max(0, Math.floor(lo / step) * step), b = Math.ceil(hi / step) * step;
  const ticks = []; for (let v = a; v <= b + step / 2; v += step) ticks.push(v);
  return ticks;
}
function drawCharts(root) { root.querySelectorAll('.pg-svg[data-chart]').forEach(drawChart); }
function drawChart(el) {
  const c = CH[el.dataset.chart];

  // Measure the column, not the box: a box holding a wide svg would never shrink.
  const W = Math.max(120, Math.floor((el.parentElement || el).clientWidth)), Hh = 96;
  if (el.dataset.w === String(W)) return;
  el.dataset.w = String(W);
  const pts = c.pts, n = pts.length;
  const ticks = niceTicks(Math.min(...pts.map(p => p.y)), Math.max(...pts.map(p => p.y)), 1);
  const fmtY = v => fmtNum(v);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  // A point where the weight changed gets a thin line with the new weight above it; that takes room at the top.
  const marked = pts.some(p => p.kgChange);
  const L = 6 + Math.max(...ticks.map(t => fmtY(t).length)) * 6.2, R = 10, T = marked ? 18 : 10, B = 18;
  const x = i => L + i * (W - L - R) / (n - 1);
  const y = v => T + (Hh - T - B) * (1 - (v - lo) / ((hi - lo) || 1));
  const color = `var(--c-${c.slot})`;
  let g = '';
  for (const t of ticks) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${L - 6}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${esc(fmtY(t))}</text>`;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const dots = n <= 16 ? pts.map((p, i) => i === n - 1 ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`).join('') : '';
  // The newest weight is always named; an older one only where its words do not run into a newer one's.
  let free = Infinity, marks = '';
  for (let i = n - 1; i > 0; i--) {
    if (!pts[i].kgChange) continue;
    const last = i === n - 1, w = pts[i].kgText.length * 6.2;
    const right = last ? x(i) : x(i) + w / 2, left = right - w;
    const named = right + 4 <= free && left >= 0;
    if (named) free = left;
    marks = `<g class="kgmark"><line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${T}" y2="${Hh - B}"/>${named ? `<text x="${x(i).toFixed(1)}" y="${T - 6}" text-anchor="${last ? 'end' : 'middle'}">${esc(pts[i].kgText)}</text>` : ''}</g>` + marks;
  }
  const xl = `<text x="${L}" y="${Hh - 4}">${esc(fmtDM(pts[0].date))}</text><text x="${W - R}" y="${Hh - 4}" text-anchor="end">${esc(fmtDM(pts[n - 1].date))}</text>`;
  el.innerHTML = `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" aria-hidden="true" focusable="false">
      ${g}${xl}${marks}
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <circle cx="${x(n - 1).toFixed(1)}" cy="${y(pts[n - 1].y).toFixed(1)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${Hh - B}" visibility="hidden"/>
      <circle class="xh-dot" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    </svg><div class="tip" hidden aria-live="polite"><strong></strong><span></span></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('.xh'), dot = svg.querySelector('.xh-dot');
  let cur = -1;
  const show = i => {
    if (i < 0 || i >= n) return;
    cur = i;
    const p = pts[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(p.y)); dot.setAttribute('visibility', 'visible');
    tip.querySelector('strong').textContent = `${p.y} reps`;
    tip.querySelector('span').textContent = `${p.kgText} · ${dayShort(p.date)}${p.cut ? ' · stopped early' : ''}`;
    tip.hidden = false;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(x(i), tw / 2), W - tw / 2) + 'px';
    // No room above (under the sticky top bar)? Show it below the chart.
    const bar = $('.top')?.getBoundingClientRect().bottom || 0;
    const below = el.getBoundingClientRect().top - tip.offsetHeight - 10 < bar;
    tip.style.top = below ? (Hh + 6) + 'px' : '';
    tip.style.transform = below ? 'translate(-50%, 0)' : '';
  };
  const hide = () => { cur = -1; tip.hidden = true; xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  el._hide = hide;
  const nearest = ev => {
    const r = svg.getBoundingClientRect();
    const vx = ev.clientX - r.left;
    let best = 0, bd = Infinity;
    for (let i = 0; i < n; i++) { const d = Math.abs(x(i) - vx); if (d < bd) { bd = d; best = i; } }
    return best;
  };
  svg.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse' || ev.buttons) show(nearest(ev)); });
  svg.addEventListener('pointerdown', ev => show(nearest(ev)));
  svg.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') hide(); });
  el.addEventListener('blur', hide);
  el.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft') { show(Math.max(0, (cur < 0 ? n : cur) - 1)); ev.preventDefault(); }
    if (ev.key === 'ArrowRight') { show(Math.min(n - 1, cur + 1)); ev.preventDefault(); }
    if (ev.key === 'Escape') hide();
  });
  el.addEventListener('focus', () => { if (el.matches(':focus-visible') && cur < 0) show(n - 1); });
}
// A tap anywhere else closes a chart's tooltip.
document.addEventListener('pointerdown', ev => { document.querySelectorAll('.pg-svg').forEach(c => { if (c._hide && !c.contains(ev.target)) c._hide(); }); }, true);
let chartResize = null;
window.addEventListener('resize', () => { clearTimeout(chartResize); chartResize = setTimeout(() => drawCharts(document), 150); });

/* ---------- From screen to screen ---------- */
const SCREENS = ['home', 'results', 'settings'];
/* Show a screen: at the top, with focus on "Back", or on the home screen on the button that led to the screen just left.
   Focus is taken off first, so that a name being typed is saved. While a card is open there is only the home screen. */
function showScreen(screen, from) {
  const a = document.activeElement;
  if (a && a !== document.body) { try { a.blur(); } catch { /* ignore */ } }
  UI.screen = SCREENS.includes(screen) && !R.session ? screen : 'home';
  UI.logAll = false;
  render();
  window.scrollTo(0, 0);
  const t = UI.screen === 'home' ? (from ? $(`#view [data-act="screen"][data-screen="${CSS.escape(from)}"]`) : null) : $('#view [data-act="back"]');
  if (t) { try { t.focus({ preventScroll: true }); } catch { /* ignore */ } }
}
/* The back button of the phone or the browser: it closes a sheet that is open (nothing in it is saved) and shows the screen of that step. */
window.addEventListener('popstate', e => {
  const from = UI.screen;
  if (!$('#sheet').hidden) { UI.sheetReturn = null; closeSheet(); }
  const want = e.state && e.state.screen ? e.state.screen : 'home';
  showScreen(want, from);
  // With a card open every step shows the home screen: then this step becomes one of the home screen.
  if (UI.screen !== want) { try { history.replaceState(null, ''); } catch { /* ignore */ } }
});

/* ------------------------------------------------------------------ *
 * The card clock: one exercise at a time, ten minutes on the button of its card
 * ------------------------------------------------------------------ */
/* While a card is open R.session is the working copy of today's workout (null otherwise) and R.idx the open
   group in it. phase: 'lead' (the countdown), 'run', 'paused' or 'over' (the bell has gone). saved tells how
   storing the score went: null, 'saving', 'saved' or 'failed'. since is when the phase last changed. */
const R = { session: null, idx: 0, phase: 'run', t0: 0, leadEnd: 0, pausedAt: 0, pausedMs: 0, timer: null, lastRem: null, wake: null, confirm: null, lastSet: null, saved: null, since: 0, storeN: 0, storing: null };
const DRAFT_KEY = () => 'd330.draft.' + (S.uid || 'local');
function loadDraft() {
  const d = LS.get(DRAFT_KEY(), null);
  if (!d || !d.session) return null;
  const s = normSession(d.session);
  if (!s || s.blocks.length !== 3) return null;
  return Object.assign({}, d, { session: s, idx: Math.min(2, Math.max(0, d.idx | 0)) });
}
function saveDraft() {
  if (!R.session) { LS.del(DRAFT_KEY()); return; }
  LS.set(DRAFT_KEY(), { session: R.session, idx: R.idx, phase: R.phase, t0: R.t0, leadEnd: R.leadEnd, pausedAt: R.pausedAt, pausedMs: R.pausedMs, saved: R.saved });
}
function clearDraftFor(id) { const d = loadDraft(); if (d && d.session.id === id) LS.del(DRAFT_KEY()); }

function newSession(tpl) {
  const p = myProfile();
  const today = todayYmd();
  const t = tpl || nextTpl(S.uid);
  const plan = planFor(p, t);
  return {
    v: 1, id: uidGen('s'), date: today, tpl: t, status: 'active', startedAt: Date.now(), updatedAt: Date.now(),
    blocks: SLOT_ORDER.map(slot => {
      const key = plan[slot];
      const info = exInfo(key, p);
      return { slot, ex: key, name: info.n, kg: Number(plannedKg(p, key).kg) || 0, bw: !!info.bw, sets: [], total: 0, dur: 0, done: false, skipped: false, cut: false };
    }),
    feel: 0, note: '',
  };
}
function setBackgroundInert(on) {
  $('#app').inert = on;
}
/* The working copy for one exercise: a workout of today with the three exercises of the workout whose turn it
   is, none of them done. When there is a workout today the copy is that workout: its id, its start, its feel
   and note, and what is done in the other two groups. So the exercise and its weight are fixed from here on. */
function openCard(slot) {
  const s = newSession(turnTpl());
  const t = todaySession();
  if (t) {
    Object.assign(s, { id: t.id, startedAt: t.startedAt, manual: !!t.manual, feel: t.feel, note: t.note });
    s.blocks = s.blocks.map(b => { const did = b.slot === slot ? null : (t.blocks || []).find(x => x.slot === b.slot && isDone(x)); return did ? clone(did) : b; });
  }
  Object.assign(R, { session: s, idx: SLOT_ORDER.indexOf(slot), phase: 'ready', t0: 0, leadEnd: 0, pausedAt: 0, pausedMs: 0, lastRem: null, confirm: null, lastSet: null, saved: null, since: 0, storing: null });
}
/* Store the open exercise in today's workout. The workout is stored as done; a group that is not done is an
   empty block that keeps its exercise and weight. A copy with nothing done is not stored: a workout with
   that id is deleted instead. Quiet, because the caller says itself when it did not work. After a score is
   stored, the weight the exercise is set to becomes the weight of that score. */
async function storeOpen() {
  const b = blk();
  b.total = b.sets.reduce((a, x) => a + x.r, 0); b.done = b.total > 0; b.skipped = !b.done;
  if (b.sets.length) b.kg = workKg(b);
  const now = Date.now();
  const copy = Object.assign(clone(R.session), { status: 'done', paused: false, updatedAt: now, endedAt: now });
  copy.blocks = copy.blocks.map(x => (isDone(x) ? x : Object.assign(x, { done: false, skipped: true, sets: [], total: 0, dur: 0, cut: false })));
  if (!copy.blocks.some(isDone)) return me().sessions.has(copy.id) ? deleteSession(copy.id) : true;
  if (!(await saveSession(copy, { quiet: true }))) return false;
  UI.tpl = null;
  const p = myProfile();
  if (b.done && p && !(p.weights && p.weights[b.ex] === b.kg)) {
    const q = clone(p); q.weights = Object.assign({}, q.weights, { [b.ex]: b.kg });
    saveProfile(q, { quiet: true });
  }
  return true;
}
/* Store the open exercise now and say on the card how that went: "Saving…", then saved or not. One store runs
   at a time, in the order of the taps, and only the newest call has the last word. Without reps and without a
   stored score of this exercise there is nothing to store. */
function storeNow() {
  const n = ++R.storeN, sid = R.session.id, slot = blk().slot;
  const reps = () => blk().sets.reduce((a, x) => a + x.r, 0);
  const stored = me().sessions.get(sid);
  const nothing = !reps() && !(stored && (stored.blocks || []).some(x => x.slot === slot && isDone(x)));
  R.saved = nothing ? null : 'saving';
  saveDraft(); render();
  if (nothing) return Promise.resolve(true);
  const mine = () => !!R.session && R.session.id === sid && blk().slot === slot;
  R.storing = (R.storing || Promise.resolve(true)).then(async () => {
    if (!mine() || n !== R.storeN) return true;          // the card is closed, or a newer call stores a newer state
    const had = reps();
    const ok = await storeOpen();
    if (mine() && n === R.storeN) { R.saved = !ok ? 'failed' : had ? 'saved' : null; saveDraft(); render(); }
    return ok;
  });
  return R.storing;
}
/* Close an attempt that will not go on: a card left open on an earlier day, a workout left open by the old
   version, a countdown. Reps that were tapped count as a score of the day it began; its time is what the
   clock had run, and under ten minutes it stopped early. What is done in the draft is added to the stored
   workout with that id; a group that is done there keeps what is stored. False only when a save failed. */
async function settleDraft(d) {
  const s = clone(d.session);
  const b = s.blocks[d.idx];
  if (b && b.sets.length && !isDone(b)) {
    const ran = d.phase === 'run' ? (Date.now() - d.t0 - (d.pausedMs || 0)) / 1000 : d.phase === 'paused' ? (d.pausedAt - d.t0 - (d.pausedMs || 0)) / 1000 : b.dur;
    b.total = b.sets.reduce((a, x) => a + x.r, 0);
    b.dur = Math.max(0, Math.min(BLOCK_SEC, Math.round(Number(ran) || 0)));
    Object.assign(b, { done: true, skipped: false, cut: b.dur < BLOCK_SEC - 1, kg: workKg(b) });
  }
  const stored = me().sessions.get(s.id);
  let out;
  if (stored) {
    out = clone(stored);
    let added = false;
    for (const x of s.blocks.filter(isDone)) {
      if (out.blocks.some(y => y.slot === x.slot && isDone(y))) continue;      // what is stored stays
      const i = out.blocks.findIndex(y => y.slot === x.slot);
      if (i >= 0) out.blocks[i] = x; else out.blocks.push(x);
      added = true;
    }
    if (!added) return true;
  } else {
    if (!s.blocks.some(isDone)) return true;
    out = s;
    out.blocks = out.blocks.map(x => (isDone(x) ? x : Object.assign(x, { done: false, skipped: true, sets: [], total: 0, dur: 0, cut: false })));
  }
  const now = Date.now();
  return saveSession(Object.assign(out, { status: 'done', paused: false, updatedAt: now, endedAt: out.endedAt || now }), { quiet: true });
}
/* What this device kept of an open card, looked at once the profile and your own workouts are there:
   - the clock still runs (also when it began yesterday), or it is today's and on pause or after the bell:
     the same card opens again in the same state. A clock whose time ran out meanwhile rings at once;
   - anything else (a countdown, an earlier day, a workout left open by the old version): it is closed with
     settleDraft and the home screen shows today. When that save fails the draft stays for the next visit. */
let draftChecked = false;
function resumeDraft() {
  if (draftChecked || R.session || S.mode === 'loading' || !myProfile() || (S.mode === 'shared' && !S.ownLocal && !S.ownSeen)) return;
  draftChecked = true;
  const d = loadDraft();
  if (!d) return;
  const running = d.phase === 'run' && (Date.now() - d.t0 - (d.pausedMs || 0)) / 1000 < BLOCK_SEC;
  if (!running && !(d.session.date === todayYmd() && ['run', 'paused', 'over'].includes(d.phase))) {
    settleDraft(d).then(ok => {
      const cur = LS.get(DRAFT_KEY(), null);
      if (ok && !R.session && cur && cur.session && cur.session.id === d.session.id) LS.del(DRAFT_KEY());
      scheduleRender();
    });
    return;
  }
  // The other groups are read again from the stored workout: an old copy never overwrites what was stored since.
  const s = d.session, stored = me().sessions.get(s.id);
  if (stored) s.blocks = s.blocks.map((x, i) => { const did = i === d.idx ? null : (stored.blocks || []).find(y => y.slot === x.slot && isDone(y)); return did ? clone(did) : x; });
  Object.assign(R, { session: s, idx: d.idx, phase: d.phase, t0: d.t0, leadEnd: 0, pausedAt: d.pausedAt, pausedMs: d.pausedMs,
    lastRem: null, confirm: null, lastSet: null, saved: d.phase === 'over' && d.saved === 'saved' ? 'saved' : null, since: 0, storing: null });
  if (R.phase === 'over' && R.saved !== 'saved' && blk().sets.length) storeNow(); else render();
  if (R.phase === 'run') { wakeOn(); startTick(); }
  keepPadInView();
}
/* A new day: the home screen starts clean, without a reload. When the app comes back into view (`visible`)
   with a card that began on an earlier day and is on pause or after the bell, that card is closed: its reps
   count for the day it began. A clock that still runs is left alone. */
let settling = false;
async function dayCheck(visible) {
  const today = todayYmd();
  if (!R.session) { if (UI.day && UI.day !== today) render(); return; }
  if (!visible || settling || R.session.date >= today || !(R.phase === 'paused' || R.phase === 'over')) return;
  settling = true;
  try {
    const sid = R.session.id, slot = blk().slot;
    if (R.storing) await R.storing;                       // a score on its way goes first
    if (!R.session || R.session.id !== sid) return;
    const ok = await settleDraft({ session: R.session, idx: R.idx, phase: R.phase, t0: R.t0, pausedAt: R.pausedAt, pausedMs: R.pausedMs });
    if (ok && R.session && R.session.id === sid) closeCard(slot);
  } finally { settling = false; }
}
/* Close the open card: the clock and the working copy go, and the home screen is whole again. Focus goes to
   Start of that card when it is to do again, else to the first Start, else to the title. */
function closeCard(slot) {
  stopTick(); wakeOff();
  Object.assign(R, { session: null, saved: null, confirm: null, lastSet: null, storing: null });
  LS.del(DRAFT_KEY());
  render();
  window.scrollTo(0, 0);
  const t = $(`#view [data-act="start"][data-slot="${slot}"]`) || $('#view [data-act="start"]') || $('#view .title');
  if (t) { try { t.focus({ preventScroll: true }); } catch { /* ignore */ } }
}
/* Keep the keyboard on the open card: when the control that had focus is gone, the clock gets it, or Done
   after the bell. */
function focusCard() {
  const a = document.activeElement;

    if (eqOf(own) !== st.eq) Object.assign(own, { eq: st.eq, step: q.step, bw: !!q.bw, dbl: !!q.dbl });
  }
  if (st.kgTouched) p.weights = Object.assign({}, p.weights, { [st.key]: q.bw ? st.kg : Math.max(0, st.kg) });
  if (!(await saveProfile(p))) return;
  toast('Saved.');
  if (UI.sheet === st) dismissSheet();
}

const kgFieldLabel = info => (info.bw ? 'Extra kg (− = assist)' : info.dbl ? 'Each dumbbell (kg)' : 'Weight (kg)');

function sessionForm(s, isNew) {

/* Quick picks for the date of a workout added by hand: today and yesterday. */
function dateChips(cur) {

  return [[today, 'Today'], [addDays(today, -1), 'Yesterday']].map(([d, word]) => `<button type="button" data-act="pickDate" data-d="${d}" aria-pressed="${d === cur}">${word}</button>`).join('');

/* After another exercise is chosen in the form, show the weight the way that exercise counts it.
   A new log takes the exercise's planned weight unless a weight was typed; an edit keeps the kilos. */
function syncFormExercise(sel) {
  const kgEl = sel.form.querySelector('#kg' + sel.name.slice(2));
  if (!kgEl) return;
  const p = myProfile();
  const info = exInfo(sel.value, p);
  const wasDbl = kgEl.dataset.dbl === '1', wasBw = kgEl.dataset.bw === '1';
  const typed = kgEl.dataset.touched === '1';
  const n = parseKg(kgEl.value);
  const total = (Number.isFinite(n) ? n : 0) * (wasDbl ? 2 : 1);
  const planned = (sel.form.dataset.new === '1' && !typed) || !!info.bw !== wasBw;
  const kg = planned ? Number(plannedKg(p, sel.value).kg) || 0 : total;
  // A weight the user typed stays as typed (only its unit label changes).
  if (!(typed && !!info.bw === wasBw)) kgEl.value = kgInText(info.dbl ? kg / 2 : kg);

  kgEl.dataset.bw = info.bw ? '1' : '0';

}

async function submitSessionForm(form) {
  const id = form.dataset.id;
  const isNew = form.dataset.new === '1';
  const p = myProfile();
  const base = isNew ? clone(UI.sheet?.session) : clone(me().sessions.get(id));
  if (!base) { closeSheet(); return; }
  const hasReps = i => parseInt(form.querySelector(`[name="tot${i}"]`)?.value, 10) > 0;
  const kgBad = [...form.querySelectorAll('[name^="kg"]')].find(el => !Number.isFinite(parseKg(el.value)));
  if (kgBad) { toast('Enter the weight as a number, e.g. 14 or 12.5.'); try { kgBad.focus(); } catch { /* ignore */ } return; }
  const kgEmpty = [...form.querySelectorAll('[name^="kg"]')].find(el => el.dataset.bw !== '1' && el.value.trim() === '' && hasReps(el.name.slice(2)));
  if (kgEmpty) { toast('Enter the weight as a number, e.g. 14 or 12.5.'); try { kgEmpty.focus(); } catch { /* ignore */ } return; }
  const kgNeg = [...form.querySelectorAll('[name^="kg"]')].find(el => el.dataset.bw !== '1' && parseKg(el.value) < 0);
  if (kgNeg) { toast('Minus kilos only work for bodyweight exercises (assistance).'); try { kgNeg.focus(); } catch { /* ignore */ } return; }
  const orig = isNew ? null : me().sessions.get(id);
  const fd = new FormData(form);
  const date = String(fd.get('date') || '');
  if (!validYmd(date)) { toast('Pick a valid date.'); return; }
  if (date > todayYmd()) { toast('Pick a date up to today.'); return; }
  base.date = date;
  base.blocks.forEach((b, i) => {
    const ex = form.querySelector(`[name="ex${i}"]`)?.value || b.ex;
    const info = exInfo(ex, p);
    const oldKg = Number(b.kg) || 0;
    const kgEl = form.querySelector('#kg' + i);
    const kgIn = parseKg(kgEl ? kgEl.value : fd.get('kg' + i));
    const fieldDbl = kgEl ? kgEl.dataset.dbl === '1' : !!info.dbl;
    if (ex !== b.ex) b.bw = !!info.bw;
    b.name = exName(ex, p, ex === b.ex ? b.name : undefined);   // an exercise that no longer exists keeps its stored name
    b.ex = ex;
    b.kg = Number.isFinite(kgIn) ? Math.round(clampN(fieldDbl ? kgIn * 2 : kgIn, -300, 1000) * 10) / 10 : oldKg;
    if (!info.bw) b.kg = Math.max(0, b.kg);
    if (b.kg !== oldKg) b.sets = (b.sets || []).map(x => (x.kg == null || Number(x.kg) === oldKg ? Object.assign({}, x, { kg: b.kg }) : x));
    const t = parseInt(fd.get('tot' + i), 10);
    const sum = (b.sets || []).reduce((a, s) => a + s.r, 0);
    if (t > 0 && sum > 0 && t !== sum) {
      // Reps changed: keep the logged sets (and their weights) and apply the difference to the last ones.
      const sets = b.sets.map(x => Object.assign({}, x));
      if (t > sum) sets.push({ r: t - sum, kg: b.kg, t: null });
      else { let d = sum - t; for (let k = sets.length - 1; k >= 0 && d > 0; k--) { const take = Math.min(d, sets[k].r); sets[k].r -= take; d -= take; } }
      b.sets = sets.filter(x => x.r > 0);
    }
    b.total = t > 0 ? t : 0;
    b.skipped = !(t > 0);
    b.done = b.total > 0;
  });
  if (!base.blocks.some(b => b.done)) { toast('Enter the reps for at least one exercise.'); return; }
  base.status = 'done'; base.paused = false; base.updatedAt = Date.now();
  // A workout added for today is today's newest one, so the cards follow it; on another day it stands at noon.
  if (isNew) { base.startedAt = base.date === todayYmd() ? Date.now() : parseYmd(base.date).getTime() + 12 * 3600e3; base.manual = true; }
  clearDraftFor(base.id);
  const ok = await saveSession(base);
  if (!ok) return;
  // Only the newest workout of an exercise sets its planned weight.
  const pp = clone(myProfile()); pp.weights = pp.weights || {};
  let changed = false;
  for (const b of base.blocks) {
    if (!b.done) continue;
    const later = scoresOf(S.uid, b.ex).some(h => h.sid !== base.id && h.date > base.date);
    const o = orig && orig.blocks.find(x => x.slot === b.slot);
    const touched = !o || !o.done || o.ex !== b.ex || o.kg !== b.kg;
    if (!later && touched && pp.weights[b.ex] !== b.kg) { pp.weights[b.ex] = b.kg; changed = true; }
  }
  if (changed) saveProfile(pp, { quiet: true }).then(ok2 => { if (!ok2) toast('Workout saved. The next weights weren’t updated — try again later.'); });
  // Logged other exercises than the plan? Offer to make them the plan.
  if (isNew) {
    const pr = myProfile();
    const t = rotates(pr) ? (base.tpl || 'A') : 'A';
    const plan = planFor(pr, t);
    const diff = base.blocks.filter(b => b.done && plan[b.slot] !== b.ex);
    if (diff.length) {
      UI.sheet = { kind: 'planAsk', tpl: t, set: Object.fromEntries(diff.map(b => [b.slot, b.ex])) };
      openSheet(planAskHtml(pr, t, plan, diff), 'Update your plan?');
      return;
    }
  }
  closeSheet(); toast('Saved.');
}
function planAskHtml(p, t, plan, diff) {

    <p class="small">This workout used different exercises from ${which}.</p>

const ACT = {

  /* "Start 10 minutes": the card opens and its button becomes the clock; first the countdown, when that is on.

    if (!R.session || !['run', 'paused', 'over'].includes(R.phase)) return;
    const b = blk(); if (!b.sets.length) return;
    b.sets.pop();
    b.total = b.sets.reduce((a, s) => a + s.r, 0);
    R.lastSet = b.sets.length ? b.sets[b.sets.length - 1].r : null;
    if (R.phase === 'over') storeNow(); else { saveDraft(); render(); }
    focusCard();
  },
  /* Done, after the bell: the card closes once the score is stored. A save that failed is tried again first,
     one on its way is waited for; when that does not work the card stays open. */
  async cardDone() {
    if (!R.session || R.phase !== 'over') return;
    const sid = R.session.id, slot = blk().slot;
    if (R.saved === 'failed') storeNow();
    const ok = R.storing ? await R.storing : true;
    if (!R.session || R.session.id !== sid) return;      // closed meanwhile by a second tap
    if (ok && R.saved !== 'failed') closeCard(slot);
  },
};
function syncDateChips() {
  const v = $('#sDate')?.value;
  document.querySelectorAll('#dateChips [data-act="pickDate"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === v)));
  const st = UI.sheet;
  if (st && st.kind === 'session' && st.session && !st.tplPicked && validYmd(v) && !document.querySelector('#sheet form [data-touched="1"]')) {
    const t = nextTpl(S.uid, v);
    const btn = document.querySelector(`#sheet [data-act="formTpl"][data-tpl="${t}"]`);
    if (btn && btn.getAttribute('aria-pressed') !== 'true') ACT.formTpl(btn);
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') dismissSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'exSearch') { e.target.blur(); return; }   // puts the phone's keyboard away
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('kg-in')) {
    e.preventDefault();
    e.target.blur();
    setTimeout(() => { const pl = $('[data-act="exKg"][data-dir="1"]'); if (pl) { try { pl.focus({ preventScroll: true }); } catch { /* ignore */ } } }, 0);
    return;
  }
  if (e.key === 'Escape' && !$('#sheet').hidden) dismissSheet();   // Escape closes a sheet; an open card stays open
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'exName' && UI.sheet && UI.sheet.kind === 'ex') UI.sheet.name = el.value;
  if (el.id === 'joinNick') UI.joinNick = el.value;
  if (el.id === 'exKgIn') typedExKg(el);
  if (el.id === 'exSearch') typedExSearch(el);
  if (el.id === 'newName') typedNewName(el);
  if (el.form && el.form.dataset.form === 'session' && /^(kg|ex|tot)\d$/.test(el.name || '')) el.dataset.touched = '1';
  if (el.id === 'sDate') syncDateChips();
});
document.addEventListener('submit', async e => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.form === 'join') {
    const inp = $('#joinNick');
    const nick = (inp?.value || '').trim().slice(0, 30);
    if (inp) inp.blur();
    const btn = f.querySelector('button[type="submit"]');
    if (btn) { if (btn.disabled) return; btn.disabled = true; }
    // Never overwrite a profile that exists but has not arrived yet.
    if (S.mode === 'shared' && !S.ownLocal) {
      let ex;
      try { ex = await S.db.doc('members/' + S.uid).get(); }
      catch { if (btn) btn.disabled = false; toast('Couldn’t check your profile. Try again in a moment.'); return; }
      if (ex.exists) { me().profile = normProfile(ex.data()); if (btn) btn.disabled = false; render(); return; }
    }
    const dev = S.mode === 'shared' ? readOwnLocal() : null;
    const ok = await saveProfile(dev && dev.profile ? Object.assign(dev.profile, nick ? { nick } : {}) : defaultProfile(nick));
    if (btn) btn.disabled = false;
    render();
    { const t = $('#view [data-act="start"]'); if (t) t.focus({ preventScroll: true }); }
    if (ok) toast(nick ? `Welcome, ${nick}!` : 'Welcome!');
  }
  if (f.dataset.form === 'session') submitSessionForm(f);
  if (f.dataset.form === 'ex') submitExSheet();
  if (f.dataset.form === 'exNew') submitExNew();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') { importData(el.files && el.files[0]); el.value = ''; return; }
  if (el.id === 'exKgIn') {
    const v = parseKg(el.value);
    if (!Number.isFinite(v)) toast('Type the weight as a number, e.g. 14 or 12.5.');
    else if (v < 0 && !EQUIP[UI.sheet?.eq]?.bw) toast('Minus kilos only work for bodyweight exercises (assistance).');
    showExKg(); return;
  }
  if (el.form && el.form.dataset.form === 'session' && /^ex\d$/.test(el.name || '')) { syncFormExercise(el); return; }
  const field = el.dataset.field;
  if (!field) return;
  const p = clone(myProfile());
  if (!p) return;
  if (field === 'nick') { p.nick = el.value.trim().slice(0, 30); saveProfile(p); }
});

/* ------------------------------------------------------------------ *
 * Export / import
 * ------------------------------------------------------------------ */
// Dutch Excel reads ';' columns and decimal commas.
const dec = v => String(v).replace('.', ',');
function csvCell(v) { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function exportData(fmt) {
  const p = myProfile();
  const sessions = sessionsOf(S.uid);
  let filename, data;
  if (fmt === 'csv') {
    const rows = [['date', 'week', 'workout', 'slot', 'exercise', 'kg', 'reps', 'volume_kg', 'sets', 'stopped_early', 'felt', 'note']];
    for (const s of sessions) for (const b of s.blocks || []) {
      if (!b.done || b.skipped) continue;
      const info = exInfo(b.ex, p);
      rows.push([s.date, isTrial(s, S.uid) ? 'practice' : weekNo(s.date, startOf(S.uid)), s.tpl || 'A', SLOT[b.slot]?.label, blockName(b, p),
        dec(b.kg), b.total, dec(Math.round(blockVolume(b) * 10) / 10), setsText(b, info).replace(/ · /g, ' '), b.cut ? 'yes' : '', FEEL[(s.feel || 0) - 1] || '', s.note || '']);
    }
    data = '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
    filename = '3-3-30-workouts.csv';
  } else {
    data = JSON.stringify({ app: '3-3-30-logboek', v: 1, exported: new Date().toISOString(), profile: p, sessions }, null, 1);
    filename = '3-3-30-backup-' + todayYmd() + '.json';
  }
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('File ready.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try { await navigator.clipboard.writeText(data); toast('Saving a file isn’t possible here — the data is on your clipboard.'); }
  catch {
    openSheet(`<div class="sheet-head"><b class="h2 grow">Copy your data</b><button class="iconbtn" data-act="closeSheet" aria-label="Close">${CLOSE_ICON}</button></div><textarea id="copyOut" readonly style="min-height:260px;font-size:12px">${esc(data)}</textarea>`, 'Copy data');
    const ta = $('#copyOut'); if (ta) ta.select();
  }
}
async function importData(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('This file is too big to be a backup from this app.'); return; }
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { toast('Can’t read this file. Pick a .json backup from this app.'); return; }
  if (!obj || obj.app !== '3-3-30-logboek' || !Array.isArray(obj.sessions)) { toast('This isn’t a backup from the 3-3-30 Log.'); return; }
  const incoming = normProfile(obj.profile);
  const cur0 = myProfile();
  // A fresh log takes over the backup's plan, start date and weights.
  if (incoming && (!cur0 || !trainings(S.uid).length)) await saveProfile(Object.assign(incoming, cur0 && cur0.nick ? { nick: cur0.nick } : {}));
  else if (incoming) {
    const cur = clone(myProfile());
    const add = incoming.custom.filter(c => !allExercises(cur).some(e => e.k === c.k));
    const back = incoming.start < cur.start;
    if (add.length || back) await saveProfile(Object.assign(cur, { custom: (cur.custom || []).concat(add) }, back ? { start: incoming.start } : {}));
  }
  let n = 0, bad = 0, failed = 0;
  for (const raw of obj.sessions) {
    const s = normSession(raw);
    if (!s || !s.blocks.length || JSON.stringify(s).length > 200 * 1024) { bad++; continue; }
    if (me().sessions.has(s.id)) continue;
    if (await saveSession(s, { quiet: true })) n++;
    else { failed++; me().sessions.delete(s.id); }
  }
  scheduleRender();
  if (failed) { toast(`${failed === 1 ? '1 workout' : failed + ' workouts'} couldn’t be saved. Try restoring again in a moment.`); return; }
  toast((n ? `${plural(n, 'workout', 'workouts')} restored.` : 'Everything in this backup was already here.') + (bad ? ` ${bad} unreadable skipped.` : ''));
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
/* A reload starts on the home screen: a step of "My results" or "Settings" becomes a step of the home screen. */
try { if (history.state && history.state.screen) history.replaceState(null, ''); } catch { /* ignore */ }
initStore().then(resumeDraft);
render();
</script>
