  const t = tpl || templateFor(p, today);
  const plan = planFor(p, t);
  return {
    v: 1, id: uidGen('s'), date: today, tpl: t, status: 'active', startedAt: Date.now(), updatedAt: Date.now(),
    blocks: SLOT_ORDER.map(slot => {
      const key = plan[slot];
      const info = exInfo(key, p);
      return { slot, ex: key, name: info.n, kg: Number(plannedKg(p, key).kg) || 0, bw: !!info.bw, sets: [], total: 0, dur: 0, done: false, skipped: false, cut: false };

}
function setBackgroundInert(on) {

}

    if (R.phase === 'lead') R.phase = 'ready';

  }

const blk = () => R.session.blocks[R.idx];
function elapsed() {

}
function startTick() { stopTick(); R.timer = setInterval(tick, 200); tick(); }

function tick() {

    if (rem !== R.lastRem) { if (rem <= 3 && rem >= 1) beep(660, 0.12); R.lastRem = rem; }
    if (rem <= 0) { beginBlock(); return; }

function beginBlock() {

/* 7-segment LED clock, like the interval clock on a gym wall. */
const SEGS = (() => {
  const W = 40, H = 72, m = 5, t = 7, g = 1.6, hh = t / 2;
  const hz = (x1, x2, y) => `${x1},${y} ${x1 + hh},${y - hh} ${x2 - hh},${y - hh} ${x2},${y} ${x2 - hh},${y + hh} ${x1 + hh},${y + hh}`;
  const vt = (x, y1, y2) => `${x},${y1} ${x + hh},${y1 + hh} ${x + hh},${y2 - hh} ${x},${y2} ${x - hh},${y2 - hh} ${x - hh},${y1 + hh}`;
  return {
    a: hz(m + g, W - m - g, m), g: hz(m + g, W - m - g, H / 2), d: hz(m + g, W - m - g, H - m),
    f: vt(m, m + g, H / 2 - g), b: vt(W - m, m + g, H / 2 - g), e: vt(m, H / 2 + g, H - m - g), c: vt(W - m, H / 2 + g, H - m - g),

})();
const DIGITS = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', ' ': '' };

    const on = DIGITS[ch] ?? '';
    out += `<g transform="translate(${x} 0) skewX(-6)">${Object.entries(SEGS).map(([k, pts]) => `<polygon class="seg${on.includes(k) ? ' on' : ''}" points="${pts}"/>`).join('')}</g>`;
    x += 46;

}
const mmss = s => `${Math.floor(Math.max(0, s) / 60)}:${pad2(Math.max(0, s) % 60)}`;
function clockText(rem) { const t = mmss(rem); return t.length === 4 ? ' ' + t : t; }
function statusText(rem, lead) { return lead ? 'Get set' : rem > 60 ? `${Math.ceil(rem / 60)} minutes left` : rem > 0 ? 'Last minute' : 'Time!'; }
function updateClock(rem, lead) {

  $('.prog b', c).style.width = lead ? '0%' : (Math.min(1, (BLOCK_SEC - rem) / BLOCK_SEC) * 100).toFixed(2) + '%';
  $('.status', c).textContent = statusText(rem, lead);

function prevBlock() {

function ghostAt(prev, e) {

  s.status = 'done'; s.paused = false; s.endedAt = Date.now(); s.updatedAt = Date.now();

  const ok = await saveSession(s);

  UI.tpl = null;
  saveProfile(p);

      const parsed = parseSets(setsIn.value), align = parsed.length < old.length;
      let j0 = 0;
      b.sets = parsed.map((r, j) => {
        if (align) { const k = old.findIndex((o, x) => x >= j0 && o.r === r); if (k >= 0) { j0 = k + 1; return Object.assign({}, old[k]); } }
        const o = align ? old[j0++] : old[j];
        return o ? Object.assign({}, o, { r }) : { r, kg: b.kg, t: null };
      });
    }
    const t = parseInt(fd.get('tot' + i), 10);
    let sum = (b.sets || []).reduce((a, s) => a + s.r, 0);
    if (!setsChanged && t > 0 && t !== sum && sum > 0) { b.sets = []; sum = 0; }   // total edited: old sets no longer add up
    b.total = setsChanged && sum > 0 ? sum : (t > 0 ? t : sum);
    b.done = !b.skipped && b.total > 0;
  });
  if (!base.blocks.some(b => b.done)) { toast('Enter the reps for at least one exercise.'); return; }
  base.status = 'done'; base.paused = false; base.updatedAt = Date.now();
  if (isNew) { base.startedAt = parseYmd(base.date).getTime() + 12 * 3600e3; base.manual = true; }
  clearDraftFor(base.id);
  if (profChanged) await saveProfile(p);
  const ok = await saveSession(base);
  if (!ok) return;
  // Only the newest workout of an exercise sets its planned weight.
  const pp = clone(myProfile()); pp.weights = pp.weights || {};
  let changed = false;
  for (const b of base.blocks) {
    if (!b.done) continue;
    const later = history(S.uid, b.ex).some(h => h.sid !== base.id && h.date > base.date);
    const o = orig && orig.blocks.find(x => x.slot === b.slot);
    const touched = !o || !o.done || o.ex !== b.ex || o.kg !== b.kg;
    if (!later && touched && pp.weights[b.ex] !== b.kg) { pp.weights[b.ex] = b.kg; changed = true; }
  }
  if (changed) saveProfile(pp);
  // Logged other exercises than the plan? Offer to make them the plan.
  if (isNew) {
    const pr = myProfile();
    const t = pr.mode === 'abc' ? (base.tpl || 'A') : 'A';
    const plan = planFor(pr, t);
    const diff = base.blocks.filter(b => b.done && plan[b.slot] !== b.ex);
    if (diff.length) {
      UI.sheet = { kind: 'planAsk', tpl: t, set: Object.fromEntries(diff.map(b => [b.slot, b.ex])) };
      openSheet(planAskHtml(pr, t, plan, diff), 'Update your plan?');
      return;
    }
  }
  closeSheet(); toast('Saved.');
}
function planAskHtml(p, t, plan, diff) {
  const which = p.mode === 'abc' ? `Workout ${t}` : 'your plan';
  return `<div class="sheet-head"><div class="grow"><div class="eyebrow" style="color:var(--good)">✓ Workout saved</div><b class="h2">Use these from now on?</b></div><button type="button" class="iconbtn" data-act="closeSheet" aria-label="Close">${CLOSE_ICON}</button></div>
    <p class="small">This workout had other exercises than ${which}.</p>
    <div>${diff.map(b => `<div class="sum-row">${plateHtml(b.slot, true)}<span class="grow"><span class="tiny">${esc(exName(plan[b.slot], p))} →</span><br><b class="ex-n" style="font-size:17px">${esc(exName(b.ex, p, b.name))}</b></span></div>`).join('')}</div>
    <button class="btn primary xl" data-act="applyPlan">Yes, update ${which}</button>
    <button class="btn ghost" data-act="closeSheet">No, just this once</button>`;
}

/* ------------------------------------------------------------------ *
 * Actions
 * ------------------------------------------------------------------ */
let confirmTimer = null;
function armConfirm(key, holder = UI) {
  holder.confirm = key;
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => {
    if (holder.confirm !== key) return;
    holder.confirm = null;
    if (holder === R) renderRunner(); else scheduleRender();
  }, 3500);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 4000);
}
function stepKg(kg, info, dir) {
  let next = Math.round(((Number(kg) || 0) + dir * (info.step || 2.5)) * 10) / 10;
  if (!info.bw) next = Math.max(0, next);
  return next;
}

const ACT = {
  tab(el) { UI.tab = el.dataset.tab; prefs.tab = UI.tab; savePrefs(); UI.confirm = null; render(); window.scrollTo(0, 0); },
  dismissNotice() { S.notice = ''; render(); },
  pickTpl(el) { UI.tpl = el.dataset.tpl; render(); },
  editEx(el) { openSheet(exerciseSheet(el.dataset.tpl, el.dataset.slot), 'Edit exercise'); },
  exKg(el) {
    const st = UI.sheet; if (!st) return;
    const q = EQUIP[st.eq];
    const name = $('#exName')?.value;
    const hit = exByName(name, myProfile());
    const step = hit ? (hit.step || q.step) : q.step;
    st.kg = stepKg(st.kg, { step, bw: q.bw }, Number(el.dataset.dir));
    st.kgTouched = true;
    updateExKg();
  },
  pickEq(el) {
    const st = UI.sheet; if (!st) return;
    const prevDbl = !!EQUIP[st.eq].dbl;
    st.eq = el.dataset.eq; st.eqTouched = true;
    const q = EQUIP[st.eq];
    if (q.bw) st.kg = 0; else if (st.kg <= 0) st.kg = q.start;
    if (prevDbl !== !!q.dbl) st.kg = q.start;
    $('#eqChoices').innerHTML = equipChoices(st.eq, false);
    updateExKg();
    const b = $(`#eqChoices [data-eq="${st.eq}"]`); if (b) b.focus();
  },
  applyUp(el) { const p = clone(myProfile()); p.weights = p.weights || {}; p.weights[el.dataset.ex] = Number(el.dataset.kg); saveProfile(p); toast('New weight is set.'); },
  startSession(el) { audio(); openRunner(false, el.dataset.tpl); },
  resume() { audio(); openRunner(true); },
  discardDraft() { if (UI.confirm !== 'discardDraft') { armConfirm('discardDraft'); render(); return; } UI.confirm = null; discardActive(); },
  manual() {
    const s = newSession(UI.tpl || templateFor(myProfile(), todayYmd())); s.status = 'done';
    UI.sheet = { kind: 'session', session: s };
    openSheet(sessionForm(s, true), 'Log a past workout');
  },
  edit(el) { const s = me().sessions.get(el.dataset.id); if (!s) return; UI.sheet = { kind: 'session', id: s.id }; openSheet(sessionForm(clone(s), false), 'Edit workout'); },
  async finishOld(el) {
    const s = clone(me().sessions.get(el.dataset.id)); if (!s) return;
    clearDraftFor(s.id);
    s.status = 'done'; s.paused = false; s.updatedAt = Date.now();
    if (await saveSession(s)) toast('Marked as done.');
  },
  async del(el) {
    const id = el.dataset.id;
    if (UI.confirm !== 'del:' + id) { armConfirm('del:' + id); render(); return; }
    UI.confirm = null; UI.histOpen.delete(id);
    clearDraftFor(id);
    if (await deleteSession(id)) toast('Workout deleted.');
  },
  closeSheet() { closeSheet(); },
  applyPlan() {
    const st = UI.sheet; if (!st || st.kind !== 'planAsk') return;
    const p = clone(myProfile());
    p.plans = p.plans || {};
    p.plans[st.tpl] = Object.assign({}, planFor(p, st.tpl), st.set);
    saveProfile(p);
    closeSheet();
    toast(p.mode === 'abc' ? `Workout ${st.tpl} updated.` : 'Plan updated.');
  },
  pickDate(el) {
    const inp = $('#sDate'); if (!inp) return;
    inp.value = el.dataset.d;
    syncDateChips();
  },
  formTpl(el) {
    const f = el.closest('form'); const st = UI.sheet;
    if (!f || !st || !st.session) return;
    const t = el.dataset.tpl; st.session.tpl = t;
    const p = myProfile(); const plan = planFor(p, t);
    st.session.blocks.forEach((b, i) => {
      const inp = f.querySelector(`[name="ex${i}"]`);
      if (inp) { inp.value = exInfo(plan[b.slot], p).n; syncFormExercise(inp); }
    });
    f.querySelectorAll('[data-act="formTpl"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tpl === t)));
  },
  person(el) { UI.person = el.dataset.id; render(); },
  viewPerson(el) { UI.person = el.dataset.id; UI.tab = 'progress'; render(); window.scrollTo(0, 0); },
  metric(el) { prefs.metric = el.dataset.m; savePrefs(); render(); },
  joinDay(el) {
    const d = Number(el.dataset.d);
    if (UI.joinDays.includes(d)) UI.joinDays = UI.joinDays.filter(x => x !== d);
    else if (UI.joinDays.length < 3) UI.joinDays.push(d);
    else { toast('You already picked 3 days. Turn one off first.'); return; }
    el.closest('.daypick').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(UI.joinDays.includes(Number(b.dataset.d)))));
  },
  day(el) {
    const p = clone(myProfile()); const d = Number(el.dataset.d);
    if (p.days.includes(d)) p.days = p.days.filter(x => x !== d);
    else if (p.days.length < 3) p.days.push(d);
    else { toast('You already picked 3 days. Turn one off first.'); return; }
    saveProfile(p);
  },
  mode(el) { const p = clone(myProfile()); p.mode = el.dataset.mode; p.plans = Object.assign(clone(DEFAULT_PLANS), p.plans || {}); saveProfile(p); UI.tpl = null; },
  export(el) { exportData(el.dataset.fmt); },
  importPick() { const f = $('#importFile'); if (f) f.click(); },

  // workout mode
  go() {
    audio(); wakeOn();
    if (prefs.lead) { R.phase = 'lead'; R.leadEnd = Date.now() + LEAD_SEC * 1000; R.lastRem = null; saveDraft(); renderRunner(); startTick(); }
    else beginBlock();
  },
  goNow() { beginBlock(); },
  pause() { if (R.phase !== 'run') return; R.phase = 'paused'; R.pausedAt = Date.now(); stopTick(); saveDraft(); renderRunner(); },
  resumeClock() { if (R.phase !== 'paused') return; R.pausedMs += Date.now() - R.pausedAt; R.pausedAt = 0; R.phase = 'run'; wakeOn(); saveDraft(); renderRunner(); startTick(); markLive(); keepPadInView(); },
  endEarly() {
    if (R.confirm !== 'end') { armConfirm('end', R); renderRunner(); return; }
    R.confirm = null; endBlock(false);
  },
  set(el) {
    if (!(R.phase === 'run' || R.phase === 'paused' || R.phase === 'over')) return;
    const n = Number(el.dataset.n);
    const b = blk();
    const before = b.sets.reduce((a, s) => a + s.r, 0);
    b.sets.push({ r: n, t: Math.round(Math.min(BLOCK_SEC, elapsed())), kg: Number(b.kg) || 0 });
    b.total = b.sets.reduce((a, s) => a + s.r, 0);
    R.lastSet = n;
    buzz(25);
    const prev = R.phase !== 'over' ? prevBlock() : null;
    if (prev && before <= prev.total && b.total > prev.total && (Number(b.kg) || 0) >= (Number(prev.kg) || 0)) {
      toast(`${b.total} reps — past last time’s ${prev.total}! Keep going.`); buzz([40, 60, 40]);
    }
    saveDraft(); renderRunner(); keepPadInView();
    const t = $('#runner .total') || $('#runner .result .num'); if (t) { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
  },
  undo() { const b = blk(); if (!b.sets.length) return; b.sets.pop(); b.total = b.sets.reduce((a, s) => a + s.r, 0); R.lastSet = b.sets.length ? b.sets[b.sets.length - 1].r : null; saveDraft(); renderRunner(); },
  runKg(el) {
    const b = blk();
    b.kg = stepKg(b.kg, exInfo(b.ex, myProfile()), Number(el.dataset.dir));
    saveDraft(); renderRunner();
  },
  skipBlock() { const b = blk(); b.skipped = true; b.done = false; advance(); },
  nextBlock() {
    const b = blk(); b.total = b.sets.reduce((a, s) => a + s.r, 0); b.done = b.total > 0; b.skipped = b.total === 0;
    if (b.sets.length) b.kg = workKg(b);
    R.session.updatedAt = Date.now();
    if (doneBlocks(R.session).length && !isTrial(R.session, S.uid)) saveSession(R.session, { quiet: true });
    advance();
  },
  toggleSound() { prefs.sound = !prefs.sound; savePrefs(); if (prefs.sound) { audio(); beep(880, 0.08); } renderRunner(); },
  runMenu() {
    if (R.phase === 'lead') { stopTick(); R.phase = 'ready'; R.lastRem = null; saveDraft(); }
    R.menuPaused = R.phase === 'run'; if (R.menuPaused) ACT.pause();
    R.confirm = 'menu'; R.confirm2 = null; renderRunner();
    const k = $('#runner [data-act="menuBack"]'); if (k) k.focus({ preventScroll: true });
  },
  menuBack() {
    R.confirm = null;
    if (R.menuPaused && R.phase === 'paused') { R.menuPaused = false; ACT.resumeClock(); return; }
    R.menuPaused = false; renderRunner();
  },
  runClose() {
    if (R.phase === 'run') { R.phase = 'paused'; R.pausedAt = Date.now(); }
    if (R.phase === 'lead') R.phase = 'ready';
    saveDraft();
    if (me().sessions.has(R.session.id)) saveSession(Object.assign(clone(R.session), { paused: true, updatedAt: Date.now() }), { quiet: true });
    closeRunner();
    toast('Workout paused. Tap “Resume” to continue.');
  },
  stopSave() {
    const b = blk();
    if (b.sets.length && !b.done) { b.total = b.sets.reduce((a, s) => a + s.r, 0); b.done = true; b.kg = workKg(b); b.dur = Math.round(Math.min(BLOCK_SEC, elapsed())); b.cut = b.dur < BLOCK_SEC - 1; }
    if (!doneBlocks(R.session).length) { toast('Nothing to save yet.'); return; }
    R.session.blocks.forEach(x => { if (!x.done) x.skipped = true; });
    R.phase = 'finish'; R.confirm = null; R.menuPaused = false; stopTick(); wakeOff(); saveDraft(); renderRunner();
    const h = $('#runner h2'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  },
  discardRun() {
    if (R.confirm2 !== 'discard') { R.confirm2 = 'discard'; renderRunner(); return; }
    discardActive();
  },
  discardEmpty() { discardActive(); },
  feel(el) { R.session.feel = Number(el.dataset.v); const n = $('#runNote'); if (n) R.session.note = n.value; saveDraft(); renderRunner(); },
  saveSession() { finishAndSave(); },
};
function syncDateChips() {
  const v = $('#sDate')?.value;
  document.querySelectorAll('#dateChips [data-act="pickDate"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === v)));
}
function advance() {
  if (R.idx < R.session.blocks.length - 1) {
    R.idx++; R.phase = 'ready'; R.t0 = 0; R.pausedMs = 0; R.pausedAt = 0; R.lastSet = null; R.confirm = null;
  } else {
    R.phase = 'finish'; wakeOff();
  }
  stopTick(); saveDraft(); renderRunner();
  $('#runner').scrollTo(0, 0);
  const h = $('#runner .run-name') || $('#runner h2');
  if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({ preventScroll: true }); } catch { /* ignore */ } }
}
async function discardActive() {
  const d = loadDraft();
  const id = R.session?.id || d?.session?.id;
  const stored = id ? me().sessions.get(id) : null;
  // Only an unfinished copy is ours to delete; a finished one stays.
  if (stored && stored.status !== 'done' && !(await deleteSession(id))) return;
  LS.del(DRAFT_KEY());
  if (R.session) closeRunner();
  toast('Workout discarded.');
  scheduleRender();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
$('#runner').addEventListener('click', e => { if (e.target.classList.contains('run-menu')) ACT.menuBack(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('kg-in')) { e.preventDefault(); e.target.blur(); return; }
  if (e.key !== 'Escape') return;
  if (!$('#sheet').hidden) closeSheet();
  else if (R.session && R.confirm === 'menu') ACT.menuBack();
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.hist) { if (d.open) UI.histOpen.add(d.dataset.hist); else UI.histOpen.delete(d.dataset.hist); }
}, true);
let noteTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'runNote' && R.session) { R.session.note = el.value.slice(0, 400); clearTimeout(noteTimer); noteTimer = setTimeout(saveDraft, 400); }
  if (el.id === 'exName') syncExSheet();
  if (el.id === 'exKgIn') typedExKg(el);
  if (el.form && el.form.dataset.form === 'session' && /^kg\d$/.test(el.name || '')) el.dataset.touched = '1';
  if (el.id === 'sDate') syncDateChips();
});
document.addEventListener('submit', async e => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.form === 'join') {
    const inp = $('#joinNick');
    const nick = (inp?.value || '').trim().slice(0, 30);
    if (inp) inp.blur();
    const btn = f.querySelector('button[type="submit"]');
    if (btn) { if (btn.disabled) return; btn.disabled = true; }
    // Never overwrite a profile that exists but has not arrived yet.
    if (S.mode === 'shared' && !S.ownLocal) {
      let ex;
      try { ex = await S.db.doc('members/' + S.uid).get(); }
      catch { if (btn) btn.disabled = false; toast('Couldn’t check your profile. Try again in a moment.'); return; }
      if (ex.exists) { me().profile = normProfile(ex.data()); if (btn) btn.disabled = false; render(); return; }
    }
    const dev = S.mode === 'shared' ? readOwnLocal() : null;
    const days = UI.joinDays.length ? UI.joinDays.slice() : [1, 3, 5];
    const ok = await saveProfile(dev && dev.profile ? Object.assign(dev.profile, nick ? { nick } : {}) : defaultProfile(nick, days));
    if (btn) btn.disabled = false;
    render();
    { const t = $('.tab[aria-selected="true"]'); if (t) t.focus({ preventScroll: true }); }
    if (ok) toast(nick ? `Welcome, ${nick}!` : 'Welcome!');
  }
  if (f.dataset.form === 'session') submitSessionForm(f);
  if (f.dataset.form === 'ex') submitExSheet(f);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') { importData(el.files && el.files[0]); el.value = ''; return; }
  if (el.id === 'runKgIn') { commitRunKg(el); return; }
  if (el.id === 'exKgIn') { if (!Number.isFinite(parseKg(el.value))) toast('Type the weight as a number, e.g. 14 or 12.5.'); updateExKg(true); return; }
  if (el.form && el.form.dataset.form === 'session' && /^ex\d$/.test(el.name || '')) { syncFormExercise(el); return; }
  const field = el.dataset.field;
  if (!field) return;
  if (field === 'sound' || field === 'lead') { prefs[field] = el.checked; savePrefs(); return; }
  const p = clone(myProfile());
  if (!p) return;
  if (field === 'nick') { p.nick = el.value.trim().slice(0, 30); saveProfile(p); }
  if (field === 'start') {
    if (DATE_RE.test(el.value) && el.value >= '2020-01-01' && el.value <= '2099-12-31') { p.start = el.value; saveProfileSoon(p); }
  }
});

/* ------------------------------------------------------------------ *
 * Export / import
 * ------------------------------------------------------------------ */
function csvCell(v) { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function exportData(fmt) {
  const p = myProfile();
  const sessions = sessionsOf(S.uid);
  let filename, data;
  if (fmt === 'csv') {
    const rows = [['date', 'week', 'workout', 'slot', 'exercise', 'kg', 'reps', 'volume_kg', 'sets', 'stopped_early', 'felt', 'note']];
    for (const s of sessions) for (const b of s.blocks || []) {
      if (!b.done || b.skipped) continue;
      const info = exInfo(b.ex, p);
      rows.push([s.date, isTrial(s, S.uid) ? 'practice' : weekNo(s.date, p?.start || START), s.tpl || 'A', SLOT[b.slot]?.label, blockName(b, p),
        b.kg, b.total, Math.round(blockVolume(b) * 10) / 10, setsText(b, info).replace(/ · /g, ' '), b.cut ? 'yes' : '', FEEL[(s.feel || 0) - 1] || '', s.note || '']);
    }
    data = '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
    filename = '3-3-30-workouts.csv';
  } else {
    data = JSON.stringify({ app: '3-3-30-logboek', v: 1, exported: new Date().toISOString(), profile: p, sessions }, null, 1);
    filename = '3-3-30-backup-' + todayYmd() + '.json';
  }
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('File ready.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try { await navigator.clipboard.writeText(data); toast('Saving a file isn’t possible here — the data is on your clipboard.'); }
  catch {
    openSheet(`<div class="sheet-head"><b class="h2 grow">Copy your data</b><button class="iconbtn" data-act="closeSheet" aria-label="Close">${CLOSE_ICON}</button></div><textarea id="copyOut" readonly style="min-height:260px;font-size:12px">${esc(data)}</textarea>`, 'Copy data');
    const ta = $('#copyOut'); if (ta) ta.select();
  }
}
async function importData(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('This file is too big to be a backup from this app.'); return; }
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { toast('Can’t read this file. Pick a .json backup from this app.'); return; }
  if (!obj || obj.app !== '3-3-30-logboek' || !Array.isArray(obj.sessions)) { toast('This isn’t a backup from the 3-3-30 Log.'); return; }
  const incoming = normProfile(obj.profile);
  const cur0 = myProfile();
  // A fresh log takes over the backup's plan, start date and weights.
  if (incoming && (!cur0 || !trainings(S.uid).length)) await saveProfile(Object.assign(incoming, cur0 && cur0.nick ? { nick: cur0.nick } : {}));
  else if (incoming) {
    const cur = clone(myProfile());
    const add = incoming.custom.filter(c => !allExercises(cur).some(e => e.k === c.k));
    const back = incoming.start < cur.start;
    if (add.length || back) await saveProfile(Object.assign(cur, { custom: (cur.custom || []).concat(add) }, back ? { start: incoming.start } : {}));
  }
  let n = 0, bad = 0, failed = 0;
  for (const raw of obj.sessions) {
    const s = normSession(raw);
    if (!s || !s.blocks.length || JSON.stringify(s).length > 200 * 1024) { bad++; continue; }
    if (me().sessions.has(s.id)) continue;
    if (await saveSession(s, { quiet: true })) n++;
    else { failed++; me().sessions.delete(s.id); }
  }
  scheduleRender();
  if (failed) { toast(`${failed === 1 ? '1 workout' : failed + ' workouts'} couldn’t be saved. Try restoring again in a moment.`); return; }
  toast((n ? `${plural(n, 'workout', 'workouts')} restored.` : 'Everything in this backup was already here.') + (bad ? ` ${bad} unreadable skipped.` : ''));
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
initStore().then(maybeReopen);
render();
