    else { toast('Je hebt al 3 dagen gekozen. Zet er eerst één uit.'); return; }
    saveProfile(p);
  },
  mode(el) { const p = clone(myProfile()); p.mode = el.dataset.mode; if (!p.plans.B) p.plans = Object.assign(clone(DEFAULT_PLANS), p.plans); saveProfile(p); UI.tpl = null; },
  export(el) { exportData(el.dataset.fmt); },
  importPick() { const f = $('#importFile'); if (f) f.click(); },

  // runner
  go() {
    audio(); wakeOn();
    if (prefs.lead) { R.phase = 'lead'; R.leadEnd = Date.now() + LEAD_SEC * 1000; R.lastRem = null; saveDraft(); renderRunner(); startTick(); }
    else beginBlock();
  },
  goNow() { beginBlock(); },
  pause() { R.phase = 'paused'; R.pausedAt = Date.now(); stopTick(); saveDraft(); renderRunner(); },
  resumeClock() { R.pausedMs += Date.now() - R.pausedAt; R.pausedAt = 0; R.phase = 'run'; wakeOn(); saveDraft(); renderRunner(); startTick(); },
  endEarly() { if (R.confirm !== 'end') { armConfirm('end', R); renderRunner(); return; } R.confirm = null; endBlock(false); },
  set(el) {
    if (!(R.phase === 'run' || R.phase === 'paused' || R.phase === 'over')) return;
    const n = Number(el.dataset.n);
    const b = blk();
    b.sets.push({ r: n, t: Math.round(Math.min(BLOCK_SEC, elapsed())), kg: Number(b.kg) || 0 });
    b.total = b.sets.reduce((a, s) => a + s.r, 0);
    R.lastSet = n;
    buzz(25);
    saveDraft(); renderRunner();
    const t = $('#runner .total'); if (t) { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
  },
  undo() { const b = blk(); b.sets.pop(); b.total = b.sets.reduce((a, s) => a + s.r, 0); R.lastSet = b.sets.length ? b.sets[b.sets.length - 1].r : null; saveDraft(); renderRunner(); },
  runKg(el) {
    const b = blk(); const info = exInfo(b.ex, myProfile());
    let next = Math.round((b.kg + Number(el.dataset.dir) * (info.step || 2.5)) * 10) / 10;
    if (!info.bw) next = Math.max(0, next);
    b.kg = next; saveDraft(); renderRunner();
  },
  skipBlock() { const b = blk(); b.skipped = true; b.done = false; advance(); },
  async nextBlock() {
    const b = blk(); b.total = b.sets.reduce((a, s) => a + s.r, 0); b.done = b.total > 0; b.skipped = b.total === 0;
    if (b.sets.length) b.kg = workKg(b);
    R.session.updatedAt = Date.now();
    if (doneBlocks(R.session).length) saveSession(R.session);
    advance();
  },
  toggleSound() { prefs.sound = !prefs.sound; savePrefs(); if (prefs.sound) { audio(); beep(880, 0.08); } renderRunner(); },
  runMenu() { if (R.phase === 'run') ACT.pause(); R.confirm = 'menu'; R.confirm2 = null; renderRunner(); },
  menuBack() { R.confirm = null; renderRunner(); },
  runClose() { if (R.phase === 'run') { R.phase = 'paused'; R.pausedAt = Date.now(); } if (R.phase === 'lead') R.phase = 'ready'; saveDraft(); closeRunner(); toast('Training gepauzeerd. Tik op "Ga verder" om door te gaan.'); },
  stopSave() {
    const b = blk();
    if (b.sets.length) { b.total = b.sets.reduce((a, s) => a + s.r, 0); b.done = true; b.kg = workKg(b); b.dur = Math.round(Math.min(BLOCK_SEC, elapsed())); }
    if (!doneBlocks(R.session).length) { toast('Er is nog niets om op te slaan.'); return; }
    R.session.blocks.forEach((x, i) => { if (i > R.idx || (!x.done && i >= R.idx)) x.skipped = !x.done; });
    R.phase = 'finish'; R.confirm = null; stopTick(); wakeOff(); saveDraft(); renderRunner();
  },
  discardRun() {
    if (R.confirm2 !== 'discard') { R.confirm2 = 'discard'; renderRunner(); return; }
    discardActive();
  },
  feel(el) { R.session.feel = Number(el.dataset.v); const n = $('#runNote'); if (n) R.session.note = n.value; saveDraft(); renderRunner(); },
  saveSession() { finishAndSave(); },
};
function advance() {
  if (R.idx < R.session.blocks.length - 1) {
    R.idx++; R.phase = 'ready'; R.t0 = 0; R.pausedMs = 0; R.pausedAt = 0; R.lastSet = null; R.confirm = null;
  } else {
    R.phase = 'finish'; wakeOff();
  }
  stopTick(); saveDraft(); renderRunner();
  $('#runner').scrollTo(0, 0);
}
async function discardActive() {
  const d = loadDraft();
  const id = R.session?.id || d?.session?.id;
  LS.del(DRAFT_KEY());
  if (R.session) closeRunner();
  if (id && me().sessions.has(id)) await deleteSession(id);
  toast('Training weggegooid.');
  scheduleRender();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.hist) { if (d.open) UI.histOpen.add(d.dataset.hist); else UI.histOpen.delete(d.dataset.hist); }
}, true);
document.addEventListener('submit', async e => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.form === 'join') {
    const nick = ($('#joinNick')?.value || '').trim().slice(0, 30);
    const btn = f.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
    const ok = await saveProfile(defaultProfile(nick));
    if (btn) btn.disabled = false;
    if (ok) toast(nick ? `Welkom, ${nick}!` : 'Welkom!');
  }
  if (f.dataset.form === 'session') submitSessionForm(f);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') { importData(el.files && el.files[0]); el.value = ''; return; }
  const field = el.dataset.field;
  if (!field) return;
  if (field === 'sound' || field === 'lead') { prefs[field] = el.checked; savePrefs(); return; }
  const p = clone(myProfile());
  if (!p) return;
  if (field === 'nick') { p.nick = el.value.trim().slice(0, 30); saveProfile(p); }
  if (field === 'start' && el.value) { p.start = el.value; saveProfile(p); }
  if (field === 'plan') {
    const { tpl, slot } = el.dataset;
    if (el.value === '__new') { addCustomExercise(tpl, slot); return; }
    p.plans[tpl] = Object.assign({}, planFor(p, tpl), { [slot]: el.value });
    saveProfile(p);
  }
});

function addCustomExercise(tpl, slot) {
  openSheet(`<form data-form="custom" style="display:grid;gap:14px">
    <div class="sheet-head"><b class="h2 grow">Eigen oefening</b><button type="button" class="iconbtn" data-act="closeSheet" aria-label="Sluiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="row"><span class="chip ${slot}">${SLOT[slot].label}</span><span class="small">voor training ${esc(tpl)}</span></div>
    <label class="f" for="cName">Naam<input type="text" id="cName" name="name" maxlength="40" required placeholder="bijv. Smith machine squat"></label>
    <label class="f" for="cStep">Stapgrootte gewicht (kg)<input type="number" id="cStep" name="step" value="${slot === 'legs' ? 5 : 2.5}" step="0.5" min="0.5" inputmode="decimal"></label>
    <label class="row"><input type="checkbox" name="bw"> <span>Met lichaamsgewicht (gewicht = extra kg)</span></label>
    <input type="hidden" name="tpl" value="${esc(tpl)}"><input type="hidden" name="slot" value="${esc(slot)}">
    <button class="btn big primary" type="submit">Toevoegen</button>
  </form>`);
  scheduleRender();
}
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.form !== 'custom') return;
  const fd = new FormData(f);
  const name = String(fd.get('name') || '').trim().slice(0, 40);
  if (!name) return;
  const p = clone(myProfile());
  const slot = String(fd.get('slot')), tpl = String(fd.get('tpl'));
  let k = 'c-' + slug(name);
  while (allExercises(p).some(x => x.k === k)) k += '-2';
  const bw = !!fd.get('bw');
  p.custom = (p.custom || []).concat([{ k, n: name, s: slot, step: Number(String(fd.get('step')).replace(',', '.')) || 2.5, start: 0, bw }]);
  p.plans[tpl] = Object.assign({}, planFor(p, tpl), { [slot]: k });
  saveProfile(p); closeSheet(); toast('Oefening toegevoegd.');
});

/* ------------------------------------------------------------------ *
 * Export / import
 * ------------------------------------------------------------------ */
function csvCell(v) { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function exportData(fmt) {
  const p = myProfile();
  const sessions = sessionsOf(S.uid);
  let filename, data;
  if (fmt === 'csv') {
    const rows = [['datum', 'week', 'training', 'blok', 'oefening', 'kg', 'herhalingen', 'score_kg', 'sets', 'gevoel', 'notitie']];
    for (const s of sessions) for (const b of s.blocks || []) {
      if (!b.done || b.skipped) continue;
      rows.push([s.date, weekNo(s.date, p?.start || START), s.tpl || 'A', SLOT[b.slot]?.label, b.name, String(b.kg).replace('.', ','), b.total, String(Math.round(blockVolume(b) * 10) / 10).replace('.', ','), setsText(b).replace(/ · /g, ' '), FEEL[(s.feel || 0) - 1] || '', s.note || '']);
    }
    data = '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
    filename = '3-3-30-trainingen.csv';
  } else {
    data = JSON.stringify({ app: '3-3-30-logboek', v: 1, exported: new Date().toISOString(), profile: p, sessions }, null, 1);
    filename = '3-3-30-backup-' + todayYmd() + '.json';
  }
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('Bestand klaar.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try { await navigator.clipboard.writeText(data); toast('Opslaan als bestand lukt hier niet. De gegevens staan op je klembord.'); }
  catch { openSheet(`<div class="sheet-head"><b class="h2 grow">Kopieer je gegevens</b><button class="iconbtn" data-act="closeSheet" aria-label="Sluiten">×</button></div><textarea readonly style="min-height:260px;font-size:12px" onfocus="this.select()">${esc(data)}</textarea>`); }
}
async function importData(file) {
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { toast('Dit bestand kan ik niet lezen. Kies een .json-backup van deze app.'); return; }
  if (!obj || obj.app !== '3-3-30-logboek' || !Array.isArray(obj.sessions)) { toast('Dit is geen backup van het 3-3-30 Logboek.'); return; }
  if (!myProfile() && obj.profile) await saveProfile(obj.profile);
  let n = 0;
  for (const s of obj.sessions) {
    if (!s || !s.id || !Array.isArray(s.blocks) || me().sessions.has(s.id)) continue;
    if (!/^[A-Za-z0-9_.~:@+-]+$/.test(s.id)) continue;
    if (await saveSession(s)) n++;
  }
  toast(n ? `${n} training${n === 1 ? '' : 'en'} teruggezet.` : 'Alle trainingen uit deze backup stonden er al.');
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
function boot() {
  initStore().then(() => {
    // Reopen an interrupted training straight away after a reload mid-block.
    const d = loadDraft();
    if (d && (d.phase === 'run' || d.phase === 'over') && myProfile()) openRunner(true);
  });
  render();
}
boot();
</script>
