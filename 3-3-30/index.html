<title>3-3-30 Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
/* Layout: phone-first single column (max 560px). Two screens, Today and Progress, behind a switch at the
   bottom; bottom sheets for everything else; a full-screen workout mode that fits one screen.
   Direction "Platform": chalk (light) and rubber floor (dark); the only saturated colours are the
   bumper plates (red = push, blue = pull, yellow = legs, green = success) and the red LED clock.
   Archivo condensed for titles and numbers, Archivo expanded for stamped labels, Instrument Sans for text. */
:root {
  --bg: #F3F1EC;
  --surface: #FFFFFF;
  --surface-2: #E9E6DF;
  --surface-3: #DCD8CF;
  --ink: #16181B;
  --ink-2: #4A4E55;
  --muted: #5E626A;
  --line: #DAD6CD;
  --push: #CC2D27;
  --pull: #1E58C8;
  --legs: #F2B807;
  --legs-mark: #8F6600;
  --on-push: #FFFFFF;
  --on-pull: #FFFFFF;
  --on-legs: #1F1700;
  --ring: #C9C4B8;
  --good: #177A41;
  --good-wash: #E1F2E7;
  --on-good: #FFFFFF;
  --warn: #8F5400;
  --warn-wash: #F6E8CF;
  --bad: #B3261E;
  --primary: #16181B;
  --on-primary: #F3F1EC;
  --seg-on: #FFFFFF;
  --shadow: inset 0 1px 0 rgb(255 255 255 / .8), 0 1px 2px rgb(40 30 10 / .06), 0 10px 24px -14px rgb(40 30 10 / .22);
  --clock-bg: #0D0E10;
  --clock-edge: #2A2E33;
  --led-on: #FF3D2E;
  --led-off: #24100E;
  --led-lead: #FFB020;
  --c-push: #CC2D27; --c-pull: #1E58C8; --c-legs: #8F6600;   /* chart lines, validated vs the card surface */
  --display: "Archivo", "Archivo Narrow", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 18px;
  --r: 14px;
  --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #1B1E22; --surface-2: #25292E; --surface-3: #30353C; --ink: #ECEAE4; --ink-2: #B9B6AE;
    --muted: #97948D; --line: #30353C; --push: #FF5A47; --pull: #5B8DF0; --legs: #F5C531; --legs-mark: #C99A12;
    --on-push: #1A0705; --on-pull: #0A1020; --on-legs: #1F1700; --ring: #4B515A; --good: #45C07A; --good-wash: #16301F; --on-good: #08140D;
    --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C; --primary: #ECEAE4; --on-primary: #121417; --seg-on: #3A3F47;
    --c-push: #F2483A; --c-pull: #5B8DF0; --c-legs: #B88A0A;
    --shadow: inset 0 1px 0 rgb(255 255 255 / .05); --clock-bg: #08090A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1B1E22; --surface-2: #25292E; --surface-3: #30353C; --ink: #ECEAE4; --ink-2: #B9B6AE;
  --muted: #97948D; --line: #30353C; --push: #FF5A47; --pull: #5B8DF0; --legs: #F5C531; --legs-mark: #C99A12;
  --on-push: #1A0705; --on-pull: #0A1020; --on-legs: #1F1700; --ring: #4B515A; --good: #45C07A; --good-wash: #16301F; --on-good: #08140D;
  --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C; --primary: #ECEAE4; --on-primary: #121417; --seg-on: #3A3F47;
    --c-push: #F2483A; --c-pull: #5B8DF0; --c-legs: #B88A0A;
  --shadow: inset 0 1px 0 rgb(255 255 255 / .05); --clock-bg: #08090A; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--pull); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::placeholder { color: var(--muted); opacity: 1; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(28px + env(safe-area-inset-bottom, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-block: 12px 8px; background: var(--bg); }
.brand { font-family: var(--display); font-stretch: 112%; font-weight: 900; font-size: 21px; letter-spacing: -.01em; line-height: 1; }
.brand i { font-style: normal; color: var(--push); }

.date { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
@media (max-width: 359px) { .daypick { gap: 4px; } .daypick button { font-size: 14px; } }

/* Type */
.title { font-family: var(--display); font-stretch: 68%; font-weight: 800; font-size: clamp(36px, 10.5vw, 46px); line-height: .95; letter-spacing: -.01em; }
.h2 { font-family: var(--display); font-stretch: 72%; font-weight: 800; font-size: 24px; line-height: 1.05; }
.eyebrow { font-family: var(--display); font-stretch: 125%; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--ink-2); font-size: 17px; }
.small { font-size: 14px; color: var(--ink-2); }
.tiny { font-size: 12.5px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.title, .h2, .run-name, .ex-n, .note-text { overflow-wrap: anywhere; hyphens: auto; }

/* Building blocks */
.stack { display: grid; gap: 14px; }
.head { display: grid; gap: 6px; padding-block: 6px 4px; }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card > * { min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }
.notice { border-radius: var(--r); padding: 12px 14px; background: var(--warn-wash); color: var(--ink); font-size: 14px; display: grid; gap: 6px; margin-bottom: 12px; }

.btn { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 750; font-size: 16px; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; min-height: 48px; background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.xl { min-height: 56px; font-size: 18px; width: 100%; font-family: var(--display); font-stretch: 100%; font-weight: 800; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: transparent; box-shadow: inset 0 0 0 1.5px var(--bad); color: var(--bad); }
.btn.good { background: var(--good); color: var(--on-good); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 14px; }
.btn.link { background: none; padding: 8px 4px; min-height: 40px; color: var(--ink-2); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.iconbtn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 22px; height: 22px; }

.chip { display: inline-flex; align-items: center; border-radius: 6px; padding: 3px 8px; font-family: var(--display); font-stretch: 125%; font-size: 10.5px; font-weight: 800;
  letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; line-height: 1.35; }
.chip.push { background: var(--push); color: var(--on-push); }
.chip.pull { background: var(--pull); color: var(--on-pull); }
.chip.legs { background: var(--legs); color: var(--on-legs); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 650;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-wash); color: var(--good); }
.pill.warn { background: var(--warn-wash); color: var(--warn); }
.pill.live { background: var(--push); color: var(--on-push); }

/* Weight plate glyph: a disc with a hub, in the slot's colour */
.plate { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; position: relative; }
.plate::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 3px rgb(0 0 0 / .12); }
.plate.push { background: var(--push); } .plate.pull { background: var(--pull); } .plate.legs { background: var(--legs); }
.plate.sm { width: 28px; height: 28px; } .plate.sm::after { width: 8px; height: 8px; box-shadow: 0 0 0 2px rgb(0 0 0 / .12); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; max-width: 100%; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; min-height: 36px; font-weight: 750; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.seg.scroll { flex-wrap: nowrap; overflow-x: auto; justify-self: start; }
.seg.full { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.seg.scroll button { flex: none; white-space: nowrap; }

/* Exercise rows */
.ex-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ex-row { width: 100%; border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 12px; padding: 10px 6px; border-radius: var(--r); }
.ex-row:hover { background: var(--surface-2); }
.ex-main { display: grid; gap: 1px; min-width: 0; }
.ex-n { font-family: var(--display); font-stretch: 75%; font-weight: 750; font-size: 19px; line-height: 1.1; }
.ex-sub { font-size: 13.5px; color: var(--muted); }
.ex-sub b { color: var(--ink-2); }
.ex-kg { font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chev { color: var(--muted); }
.up { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; background: var(--good-wash); color: var(--good); border-radius: var(--r);
  padding: 10px 12px; font-size: 14px; font-weight: 650; }

.delta { font-weight: 800; font-size: 14px; white-space: nowrap; }
.delta.pos { color: var(--good); }
.delta.neg { color: var(--bad); }

/* Forms */
.f { display: grid; gap: 6px; font-size: 14px; font-weight: 650; color: var(--ink-2); min-width: 0; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; border: 0; box-shadow: inset 0 0 0 1.5px var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 11px 13px; min-height: 48px; font-size: 16px; }
input:focus, select:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pull); }
input, select, textarea { font-weight: 500; }
textarea { min-height: 76px; resize: vertical; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices button { border: 0; border-radius: 999px; padding: 8px 13px; min-height: 40px; font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--ink-2); }
.choices button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.choices button:disabled { opacity: .5; }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.daypick button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.daypick button { height: 44px; border-radius: var(--r-sm); border: 0; padding: 0; background: var(--surface-2); font-weight: 750; min-width: 0; }

.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); font-size: 22px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.stepper .val { min-width: 104px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; padding-inline: 6px; font-size: 16px; }
.toggle-row { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.toggle-row input { width: 22px; height: 22px; accent-color: var(--ink); }
details.how > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; font-weight: 750; }
details.how > summary::-webkit-details-marker { display: none; }
details.how[open] > summary .chev { transform: rotate(90deg); }
.how ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.how h3 { font-size: 15px; font-weight: 800; margin-top: 4px; }

/* Workout mode: one screen, rep pad in the thumb zone */
.runner { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.run { max-width: 560px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 8px 14px; display: flex; flex-direction: column; gap: 10px; }
.run-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps i { height: 6px; border-radius: 3px; background: var(--surface-3); display: block; }
.steps i.done.push, .steps i.cur.push { background: var(--push); }
.steps i.done.pull, .steps i.cur.pull { background: var(--pull); }
.steps i.done.legs, .steps i.cur.legs { background: var(--legs); }
.steps i.cur { opacity: .55; }
.run-ex { display: grid; gap: 6px; }
.run-name { font-family: var(--display); font-stretch: 68%; font-weight: 800; font-size: clamp(30px, 9.4vw, 40px); line-height: .95; }
.run-kg { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.clock { flex: 1 1 0; min-height: 100px; max-height: 210px; background: var(--clock-bg); border-radius: 22px; padding: 12px 14px 10px; box-shadow: inset 0 2px 6px rgb(0 0 0 / .6), 0 0 0 1px var(--clock-edge);
  display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; justify-items: center; color: #9AA3AD; }
.ledbox { width: 100%; height: 100%; min-height: 0; display: grid; place-items: center; }
.clock svg.led { width: auto; height: 100%; max-width: 100%; max-height: 132px; display: block; }
.led .seg { fill: var(--led-off); }
.led .seg.on { fill: var(--led-on); }
.led .on, .led .colon { filter: drop-shadow(0 0 5px rgb(255 61 46 / .5)); }
.led.amber .seg.on, .led.amber .colon { fill: var(--led-lead); filter: drop-shadow(0 0 5px rgb(255 176 32 / .5)); }
.led.run .colon { animation: tick 1s step-end infinite; }
@keyframes tick { 50% { opacity: .25; } }
.led.lead .seg.on, .led.lead .colon { fill: var(--led-lead); filter: drop-shadow(0 0 5px rgb(255 176 32 / .5)); }
.led .colon { fill: var(--led-on); }
.led.paused { animation: blink 1.2s step-end infinite; }
@keyframes blink { 50% { opacity: .35; } }
.clock .status { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: #C9D0D7; }
.clock .prog { width: 100%; height: 4px; border-radius: 2px; background: #22272E; overflow: hidden; }
.clock .prog b { display: block; height: 100%; background: var(--led-on); width: 0; }
.score { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.score .total { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-size: 64px; line-height: .82; font-variant-numeric: tabular-nums; }
.score .unit { display: grid; gap: 1px; padding-bottom: 3px; font-weight: 750; color: var(--muted); font-size: 14px; }
.score .cmp { margin-left: auto; text-align: right; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 1px; padding-bottom: 3px; }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.pad button { min-height: 50px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: var(--shadow); font-family: var(--display); font-stretch: 80%;
  font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.pad button.last { box-shadow: inset 0 0 0 2.5px var(--ink); }
.pad button:active { transform: scale(.95); background: var(--surface-2); }
.pad.off { opacity: .35; pointer-events: none; }
.run-ctrl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.run-ctrl .wide { grid-column: 1 / -1; }
.run-ctrl .btn { padding-inline: 10px; }
.run-ctrl.two { grid-template-columns: 1fr 1fr; }
.setlist { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-height: 26px; font-size: 13px; color: var(--muted); }
.setlist span { background: var(--surface-2); color: var(--ink-2); border-radius: 7px; padding: 1px 8px; font-weight: 750; font-variant-numeric: tabular-nums; }
.result { border-radius: var(--r); padding: 12px 14px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 4px; }
.result.pr { background: var(--good-wash); box-shadow: none; }
.result b.v { font-family: var(--display); font-stretch: 75%; font-size: 22px; font-weight: 800; }
.ready-info { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 8px; }
.flash { animation: flash .45s ease-out; }
@keyframes flash { from { color: var(--good); transform: scale(1.06); } to { color: inherit; transform: none; } }

.sum-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 8px; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 70; background: rgb(6 8 10 / .5); display: grid; align-items: end; justify-items: center; }
.sheet-panel { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0;
  padding-inline: 16px; padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px;
  box-shadow: 0 -10px 40px rgb(0 0 0 / .3); border-top: 1px solid var(--line); animation: rise .22s cubic-bezier(.2,.8,.2,1); }
.sheet-panel::before { content: ""; justify-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--surface-3); }
@keyframes rise { from { transform: translateY(28px); } to { transform: none; } }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 650; font-size: 14px;
  width: max-content; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgb(0 0 0 / .25); text-align: center; pointer-events: none; }

.skeleton { color: var(--muted); padding-block: 48px; text-align: center; }
#sheet:not([hidden]) ~ #toast { bottom: auto; top: calc(10px + env(safe-area-inset-top, 0px)); }
#runner:not([hidden]) ~ #toast { bottom: auto; top: calc(60px + env(safe-area-inset-top, 0px)); }

.run-label { display: grid; gap: 6px; justify-items: center; min-width: 0; }
.run-label .steps { width: 100%; max-width: 168px; }
.run-label .eyebrow { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.run-menu { position: fixed; inset: 0; z-index: 60; background: rgb(6 8 10 / .5); display: grid; align-items: end; justify-items: center; }

.kg-in { width: 96px !important; min-height: 44px !important; padding: 6px 8px !important; text-align: center; font-weight: 800 !important; font-size: 16px; background: transparent !important; box-shadow: none !important; font-variant-numeric: tabular-nums; }
.kg-in:focus { box-shadow: inset 0 0 0 2px var(--pull) !important; background: var(--surface) !important; }

  

@media (max-height: 700px) { .pad button { min-height: 43px; font-size: 24px; } .pad { gap: 6px; } .score .total { font-size: 44px; } .run { gap: 7px; } .run-name { font-size: 27px; } .run-kg .stepper button { width: 40px; height: 40px; } }
@media (max-height: 620px) {
  .run { gap: 5px; padding-block: 4px 8px; }
  .run-top { grid-template-columns: 40px 1fr 40px; } .run-top .iconbtn { width: 40px; height: 40px; }
  .run-name { font-size: 24px; }
  .pad button { min-height: 37px; font-size: 21px; } .pad { gap: 5px; }
  .clock { min-height: 78px; padding: 8px 10px; gap: 4px; } .clock .status { font-size: 11px; }
  .run-ctrl .btn { min-height: 42px; white-space: nowrap; }
  .score .total { font-size: 38px; } .setlist { min-height: 22px; }
}
@media (max-width: 340px) { .run-kg { flex-wrap: nowrap; } .run-kg .small { font-size: 12.5px; line-height: 1.2; } .run-ctrl .btn { font-size: 15px; } }
/* Two small line charts, in the history of an exercise */
.pg-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 14px; }
.pg-chart { min-width: 0; display: grid; gap: 2px; }

async function initStore() {

  scheduleRender();

function subscribeMembers() {

async function resolvePeople() {
  if (!S.user || S.mode !== 'shared') return;
  try {
    const ids = [...S.members.keys()];
    const ps = await S.user.profiles(ids);
    let changed = false;
    for (const id of ids) {
      const p = ps[id]; if (!p) continue;
      const prev = S.people[id];
      if (!prev || prev.name !== p.name || prev.avatarUrl !== p.avatarUrl) changed = true;
      S.people[id] = p;

    if (changed) scheduleRender();

async function saveProfile(p, opts = {}) {

  if (clean && clean.week && clean.week.mon !== mondayOf(todayYmd())) delete clean.week;

  me().profile = clean;

  try { await dbWrite('members/' + S.uid, clean); S.profileStored = clean; dropPending(null); return true; }
  catch (e) {
    if (handleWriteError(e, opts.quiet)) { me().profile = clean; S.profileDirty = true; saveOwnLocal(); return true; }

  try { await dbWrite('members/' + S.uid + '/sessions/' + clean.id, clean); dropPending(clean.id); return true; }
  catch (e) {

  try { await dbWrite('members/' + S.uid + '/sessions/' + id, null, true); dropPending(id); return true; }
  catch (e) {
    if (handleWriteError(e)) { S.hidden.add(id); me().sessions.delete(id); saveOwnLocal(); return true; }

    return false;

/* A late joiner starts this week, or next Monday when no training day is left this week. */
function lateStart(today, days = [1, 3, 5]) {

  if (a.tagName === 'SUMMARY') { const h = a.closest('details[data-how]'); if (h) return 'details[data-how] > summary'; }
  if (a.tagName === 'A' && a.getAttribute('href')) return `a[href="${CSS.escape(a.getAttribute('href'))}"]`;
  if (a.dataset && a.dataset.act) return `[data-act="${CSS.escape(a.dataset.act)}"]` + FOCUS_KEYS.filter(k => a.dataset[k] != null).map(k => `[data-${k}="${CSS.escape(a.dataset[k])}"]`).join('');
  const ch = a.closest('[data-chart]');
  if (ch) return `[data-chart="${CSS.escape(ch.dataset.chart)}"]`;
  return null;
}
function restoreFocus(root, sel) {
  if (!sel) return;
  const a = document.activeElement;
  if (a && a !== document.body && root.contains(a)) return;
  const el = root.querySelector(sel);
  if (el) { try { el.focus({ preventScroll: true }); } catch { /* ignore */ } }
}

function render() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox') { renderDeferred = true; return; }
  const fsel = a && a.closest && (a.closest('#main') || a.closest('#notice')) ? focusSel(a) : null;
  renderHeader();
  const v = $('#view');
  const howOpen = !!v.querySelector('details[data-how]')?.open;
  let html;
  try { html = viewHome(); } catch (e) {
    console.error(e);
    UI.person = null;
    html = `<div class="card"><b>This page couldn’t be shown.</b><p class="small">Reload the page to try again.</p></div>`;
  }
  v.innerHTML = html;
  if (howOpen) { const how = v.querySelector('details[data-how]'); if (how) how.open = true; }
  drawCharts(v);
  restoreFocus(v, fsel);
  const pc = v.querySelector('.seg.scroll [aria-pressed="true"]');
  if (pc) { const t = pc.parentElement; t.scrollLeft += pc.getBoundingClientRect().left - t.getBoundingClientRect().left - (t.clientWidth - pc.offsetWidth) / 2; }
  maybeReopen();
}

/* After a reload in the middle of a block, go straight back to the clock. */
let reopenChecked = false;
function maybeReopen() {
  if (reopenChecked || R.session || S.mode === 'loading' || !myProfile() || (S.mode === 'shared' && !S.ownLocal && !S.ownSeen)) return;
  reopenChecked = true;
  const d = loadDraft();
  if (d && (d.phase === 'run' || d.phase === 'over')) openRunner(true);
}

function renderHeader() {
  // Today's date. A few words more only when workouts are NOT going to the shared log.
  const local = S.mode === 'local' || (S.mode === 'shared' && S.ownLocal);
  $('#dateText').textContent = dayShort(todayYmd()) + (local ? ' · this device only' : '');
  const nb = $('#notice');
  if (S.notice && S.notice === LS.get('d330.noticeSeen', '')) S.notice = '';
  if (nb.dataset.txt !== S.notice) {
    nb.dataset.txt = S.notice;
    nb.innerHTML = S.notice ? `<div class="notice"><span>${esc(S.notice)}</span><button class="btn link" data-act="dismissNotice" style="justify-self:start">Got it</button></div>` : '';
  }
}

const SKELETON = `<div class="skeleton">Loading your log…</div>`;
const CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const CLOSE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const svgIcon = d => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  pencil: svgIcon('<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>'),
  check: svgIcon('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  back: svgIcon('<path d="M15 6l-6 6 6 6"/>'),
};
const plateHtml = (slot, sm) => `<span class="plate ${slot}${sm ? ' sm' : ''}" aria-hidden="true"></span>`;
const dayShort = d => `${WD[parseYmd(d).getDay()]} ${fmtDM(d)}`;
const kgTotal = n => `${fmtNum(Math.round(n))} kg`;

/* "Back" on top of "My results" and "Settings", and the two buttons under the home screen that lead there. */
const backHtml = () => `<div class="scr-top"><button type="button" class="btn back" data-act="back">${ICON.back}Back</button></div>`;
const homeNavHtml = () => `<div class="home-nav"><button type="button" class="btn ghost" data-act="screen" data-screen="results">My results</button><button type="button" class="btn ghost" data-act="screen" data-screen="settings">Settings</button></div>`;

/* ---------- The page ---------- */
function viewHome() {
  const p = myProfile();
  if (S.mode === 'loading' || (S.migrating && !p)) return SKELETON;
  // Never offer 'Join' before we know this person has no profile yet.
  if (!p && S.mode === 'shared' && !S.membersSeen) return S.membersErr ? LOAD_ERR : SKELETON;
  if (!p) return viewOnboarding();
  if (S.mode === 'shared' && !S.ownSeen) {
    if (S.sessErr) return `<div class="card"><b>Your workouts couldn’t be loaded.</b><p class="small">Check your connection and try again. Nothing is lost.</p><button class="btn primary" data-act="reload" style="justify-self:start">Try again</button></div>`;
    return S.sessSlow ? `<div class="skeleton">Still loading your workouts… check your connection.</div>` : SKELETON;
  }
  return UI.screen === 'results' ? viewResults() : UI.screen === 'settings' ? viewSettings() : viewToday(p) + homeNavHtml();
}
/* "My results": whose they are, their progress, their log. */
function viewResults() {
  const { pid, seg } = personPick();
  const m = S.members.get(pid);
  const mine = pid === S.uid;
  const nm = esc(displayName(pid));
  const head = `${backHtml()}<div class="row pr-head"><h1 class="title grow">Progress</h1>${seg}</div>`;
  if (!mine && !m?.seen) {
    return head + (m?.err
      ? `<div class="card"><b>${nm}’s workouts couldn’t be loaded.</b><button class="btn primary" data-act="reload" style="justify-self:start">Try again</button></div>`
      : `<div class="skeleton">Loading ${nm}’s workouts…</div>`);
  }
  const logHead = `<div class="log-head"><h2 class="h2 grow">Log</h2>${mine ? '<button class="btn link" data-act="manual">Log a past workout</button>' : ''}</div>`;
  return head + weekCardHtml(pid) + scoresCardHtml(pid) + logHead + logListHtml(pid);
}
const LOAD_ERR = `<div class="card"><b>Your log couldn’t be loaded.</b><p class="small">Check your connection and try again. Nothing is lost.</p><button class="btn primary" data-act="reload" style="justify-self:start">Try again</button></div>`;

/* The exercises of a finished workout: reps first, the verdict under them. `judged` false leaves the
   verdicts out (a practice workout). */
function resultRowsHtml(s, pid, judged = true) {
  const prof = S.members.get(pid)?.profile;
  const rows = (s.blocks || []).map(b => {
    const info = Object.assign({}, exInfo(b.ex, prof), { bw: !!b.bw });
    const v = verdict(b, pid, s.id);
    const ok = v.kind !== 'skipped';
    const label = judged || !ok ? `<span class="goal-l${v.tone ? ' ' + v.tone : ''}">${esc(v.text)}</span>` : '';
    return `<li><div class="ex-row static">${plateHtml(b.slot)}
      <span class="ex-main"><span class="sr-only">${esc(SLOT[b.slot].label)}: </span><span class="ex-n">${esc(blockName(b, prof))}</span>
        <span class="ex-sub"><span class="ex-kg">${esc(blockKgLabel(b, info))}</span></span></span>
      <span class="goal">${ok ? `<span class="goal-n">${b.total}</span>` : ''}${label}</span>
    </div></li>`;
  }).join('');
  return `<ul class="ex-list">${rows}</ul>`;
}
/* "Lifted in total": weight × reps over the whole workout. Nothing when that is zero. */
function totalRowHtml(s) {
  const kg = doneBlocks(s).reduce((a, b) => a + blockVolume(b), 0);
  return kg > 0 ? `<div class="sum-total"><span class="grow">Lifted in total</span> <b class="num">${esc(kgTotal(kg))}</b></div>` : '';
}
/* One day in the week strip: a filled disc (trained), a ring (planned), a dashed ring (missed, or
   today when it is a rest day) or a small dot (rest). `text` is a letter, the tick, or nothing. */
const dayDotHtml = (state, text) => `<span class="wd" data-state="${state}" aria-hidden="true">${text || ''}</span>`;
/* Buddies with a profile, in the order they joined. */
function buddyIds() {
  return [...S.members.keys()].filter(id => id !== S.uid && S.members.get(id)?.profile)
    .sort((a, c) => (S.members.get(a).profile.joined || 0) - (S.members.get(c).profile.joined || 0) || (a < c ? -1 : 1));
}
/* The week on Today: a row for you and for up to three buddies. Nothing before your start date. */
function weekStripHtml() {
  const p = myProfile();
  const today = todayYmd();
  if (!p || today < (p.start || START)) return '';
  const abc = rotates(p);
  const letters = new Map(upcoming(S.uid, 7).map(u => [u.date, u.tpl]));
  const row = (id, mine) => {
    const w = weekModel(id, today);
    const who = mine ? 'You' : displayName(id);
    const dots = w.days.map(d => {
      if (!mine) {
        // A buddy's row has no letters and does not mark today.
        const state = d.state === 'today' ? 'planned' : d.state === 'todayRest' ? 'rest' : d.state;
        return dayDotHtml(state, state === 'done' ? ICON.check : '');
      }
      if (d.state === 'done') return dayDotHtml('done', abc ? esc(d.tpl) : ICON.check);
      const coming = d.state === 'today' || d.state === 'planned';
      return dayDotHtml(d.state, coming && abc ? esc(letters.get(d.date) || '') : '');
    }).join('');
    const count = w.done || w.planned ? `${w.done}/${w.planned}` : '';
    return `<div class="wk-row${mine ? ' me' : ''}" data-id="${esc(id)}" role="img" aria-label="${esc(who)}: ${w.done} of ${w.planned} workouts this week"><span class="wk-who">${esc(who)}</span>${dots}<span class="wk-n">${count}</span></div>`;
  };
  const mon = mondayOf(today);
  const dayLetters = [0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = addDays(mon, i);
    return `<span class="wk-d" aria-hidden="true"${d === today ? ' aria-current="date"' : ''}>${WD[parseYmd(d).getDay()][0]}</span>`;
  }).join('');
  const buddies = buddyIds();
  const more = buddies.length > 3 ? `<button class="btn link wk-more" data-act="screen" data-screen="results">+${buddies.length - 3} more</button>` : '';
  return `<section class="card wk" aria-label="This week" data-act="week">
    <div class="wk-row wk-head"><span aria-hidden="true">Week</span>${dayLetters}<button type="button" class="iconbtn wk-edit" data-act="week" data-from="strip" aria-label="Move a workout this week">${ICON.pencil}</button></div>
    ${row(S.uid, true)}${buddies.slice(0, 3).map(id => row(id, false)).join('')}${more}
  </section>`;
}

/* What Today is about. The situation is the first of these that applies: a workout left open on this
   device ('progress'), today before the start date ('pre'), trained today ('done'), today planned
   ('train'), otherwise a rest day ('rest'). */
function cardState(p) {
  const today = todayYmd();
  const start = p.start || START;
  const draft = loadDraft();
  const mine = trainings(S.uid, today).filter(s => s.date === today);
  const done = mine.length ? mine[mine.length - 1] : null;
  const next = upcoming(S.uid, 1)[0] || { date: today, tpl: nextTpl(S.uid) };
  const plannedToday = weekModel(S.uid, today).days.some(d => d.date === today && d.planned);
  const situation = draft ? 'progress' : today < start ? 'pre' : done ? 'done' : plannedToday ? 'train' : 'rest';
  const tpl = draft ? (draft.session.tpl || 'A') : next.tpl;
  return { today, start, situation, draft, done, next, tpl };
}

function viewToday(p) {
  const { today, start, situation, draft, done, next, tpl } = cardState(p);
  const abc = rotates(p);
  const dateLine = situation === 'pre' ? `You start ${fmtLong(start)}` : `${dayShort(today)} · today`;
  const head = title => `<div class="head"><div class="eyebrow">${esc(dateLine)}</div><h1 class="title">${esc(title)}</h1></div>`;
  const link = (act, text, attrs = '') => `<button class="btn link" data-act="${act}"${attrs}>${text}</button>`;

  // A workout left open shows its own exercises, with what is done so far.
  if (situation === 'progress') {
    return `${head('Workout in progress')}${weekStripHtml()}
      <section class="card wo" aria-label="Workout in progress">
        <ul class="ex-list">${draft.session.blocks.map(b => draftRow(b, p)).join('')}</ul>
        <button class="btn primary xl" data-act="resume">Resume workout</button>
        <div class="wo-links" style="justify-content:center">${link('discardDraft', UI.confirm === 'discardDraft' ? 'Tap again to discard it' : 'Discard it')}</div>
      </section>`;
  }
  // Trained today: the result, and what comes next.
  if (situation === 'done') {
    const coming = `${dayShort(next.date)}${abc ? ' · Workout ' + next.tpl : ''}`;
    return `${head(abc ? `Workout ${done.tpl} done` : 'Workout done')}${weekStripHtml()}
      <section class="card wo" aria-label="Today’s result">${resultRowsHtml(done, S.uid)}${totalRowHtml(done)}</section>
      <div class="after">
        <span class="next-line">Next: <b>${esc(coming)}</b></span>
        <div class="wo-links">${link('edit', 'Edit', ` data-id="${esc(done.id)}"`)}${link('startSession', 'Train again today', ` data-tpl="${nextTpl(S.uid)}"`)}${link('plan', 'Your plan')}</div>
      </div>`;
  }
  // Otherwise the next workout: today's, a practice one before the start, or the one a rest day could take.
  const plan = planFor(p, tpl);
  const rows = SLOT_ORDER.map(slot => exRow(p, tpl, slot, plan[slot])).join('');
  const ups = SLOT_ORDER.map(slot => upHint(p, plan[slot])).filter(Boolean).join('');
  const planLink = link('plan', 'Your plan');
  let title, top = '', main, note = '', links = planLink + (abc ? link('swap', 'Swap workout') : '');
  if (situation === 'pre') {
    title = 'Get ready';
    main = `<button class="btn ghost xl" data-act="startSession" data-tpl="${tpl}">Try a practice workout</button>`;
  } else if (situation === 'train') {
    title = abc ? `Workout ${tpl}` : 'Today’s workout';
    main = `<button class="btn primary xl" data-act="startSession" data-tpl="${tpl}">Start · 30 min</button>`;
  } else {
    title = 'Rest day';
    top = `<div class="wo-next"><span class="eyebrow">Next up · ${esc(dayShort(next.date))}</span>${abc ? `<b class="h2">Workout ${tpl}</b>` : ''}</div>`;
    const from = movedDay(S.uid, today);
    main = `<button class="btn ${from ? 'primary' : 'ghost'} xl" data-act="startSession" data-tpl="${tpl}">${from ? 'Train today instead' : 'Train anyway'}</button>`;
    note = `<p class="wo-note">${from ? `Moves ${esc(fmtWeekday(from))}’s workout to today.` : 'Counts as an extra workout this week.'}</p>`;
    links = planLink + link('week', 'Change this week', ' data-from="card"');
  }
  return `${head(title)}${weekStripHtml()}
    <section class="card wo" aria-label="${situation === 'train' ? esc(title) : 'Next workout'}">
      ${top}<ul class="ex-list">${rows}</ul>
      ${ups}
      ${main}${note}
      ${links ? `<div class="wo-links">${links}</div>` : ''}
    </section>`;
}

/* One exercise of the coming workout: its weight, and the reps to beat. Tap to change it. */
function exRow(p, tpl, slot, key) {
  const info = exInfo(key, p);
  const pk = plannedKg(p, key);
  const ref = refBlock(scoresOf(S.uid, key));
  const goal = ref
    ? `<span class="goal-n">${ref.total}</span><span class="goal-l">${Number(pk.kg) > Number(ref.kg) ? 'reps to match' : 'reps to beat'}</span>`
    : '<span class="goal-l">First time</span>';
  return `<li><button class="ex-row" data-act="editEx" data-tpl="${tpl}" data-slot="${slot}">
    ${plateHtml(slot)}
    <span class="ex-main"><span class="sr-only">${esc(SLOT[slot].label)}: </span><span class="ex-n">${esc(info.n)}</span><span class="ex-sub"><span class="ex-kg">${esc(kgLabel(pk.kg, info))}</span></span></span>
    <span class="goal">${goal}</span><span class="sr-only">. Change</span>
  </button></li>`;
}
function draftRow(b, p) {
  const info = exInfo(b.ex, p);
  const sub = b.done && !b.skipped ? `✓ ${b.total} reps` : b.skipped ? 'skipped' : 'to do';
  return `<li><div class="ex-row static">${plateHtml(b.slot)}<span class="ex-main"><span class="ex-n"><span class="sr-only">${esc(SLOT[b.slot].label)}: </span>${esc(blockName(b, p))}</span><span class="ex-sub"><span class="ex-kg">${esc(kgLabel(b.kg, info))}</span> · ${esc(sub)}</span></span></div></li>`;
}
/* The go-heavier tip, as one tap (or a "not now" that this device remembers). */
function upHint(p, key, exclude) {
  const info = exInfo(key, p);
  const adv = advice(scoresOf(S.uid, key).filter(h => h.sid !== exclude), info);
  if (adv.first || adv.up == null || Number(plannedKg(p, key).kg) >= adv.up) return '';
  if ((prefs.noUp || {})[key] === adv.up) return '';
  return `<div class="up"><span class="grow">${esc(info.n)} went well. Go up to ${esc(kgLabel(adv.up, info))}?</span><button class="btn sm good" data-act="applyUp" data-ex="${esc(key)}" data-kg="${adv.up}">Yes</button><button class="btn sm link" data-act="skipUp" data-ex="${esc(key)}" data-kg="${adv.up}">Not now</button></div>`;
}

/* ---------- Progress ---------- */
function personPick() {
  const ids = [...S.members.keys()].filter(id => id === S.uid || S.members.get(id)?.profile);
  const pid = UI.person && S.members.has(UI.person) ? UI.person : S.uid;
  const seg = ids.length > 1 ? `<div class="seg scroll" role="group" aria-label="Whose progress and log">${ids.map(id => `<button data-act="person" data-id="${esc(id)}" aria-pressed="${id === pid}">${esc(id === S.uid ? 'Me' : displayName(id))}</button>`).join('')}</div>` : '';
  return { pid, seg };
}
/* Workouts shown for a person: every finished one, practice workouts included. */
function shownSessions(pid) { return sessionsOf(pid).filter(finished(pid)); }
/* This week on Progress: the counter of the week strip in words, and the kilos lifted so far.
   Nothing before the start date. */
function weekCardHtml(pid) {
  const today = todayYmd();
  if (today < startOf(pid)) return '';
  const w = weekModel(pid, today);
  const kg = Math.round(trainings(pid, today).filter(s => mondayOf(s.date) === w.mon)
    .reduce((sum, s) => sum + doneBlocks(s).reduce((a, b) => a + blockVolume(b), 0), 0));
  const count = !w.planned && !w.done ? 'Nothing planned this week.'
    : w.planned ? `${w.done} of ${w.planned} workout${w.planned === 1 ? '' : 's'}` : `${w.done} workout${w.done === 1 ? '' : 's'}`;
  return `<section class="card pw" aria-label="This week"><span class="eyebrow">This week</span><span class="pw-n">${count}</span>
    ${kg > 0 ? `<span class="pw-kg"><span class="goal-n">${esc(fmtNum(kg))}</span><span class="goal-l">kg lifted</span></span>` : ''}</section>`;
}
/* A small line through the last scores, ending in a dot. */
function sparkHtml(series, slot) {
  const n = series.length;
  if (n < 2) return '';
  const lo = Math.min(...series), hi = Math.max(...series);
  const r1 = v => String(Math.round(v * 10) / 10);
  const pts = series.map((v, i) => `${r1(3 + (50 * i) / (n - 1))},${r1(hi === lo ? 14 : 23 - (18 * (v - lo)) / (hi - lo))}`);
  const [cx, cy] = pts[n - 1].split(',');
  const c = `var(--c-${slot})`;
  return `<svg class="spark" width="56" height="28" viewBox="0 0 56 28" aria-hidden="true"><path d="M${pts.join('L')}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${cx}" cy="${cy}" r="3.2" fill="${c}"/></svg>`;
}
/* The scores of one workout's three exercises: the last score, and how it compares with the one before.
   The workout is the one that is next for that person, until a letter is picked. */
function scoresCardHtml(pid) {
  const prof = S.members.get(pid)?.profile;
  if (!prof) return '';
  const mine = pid === S.uid;
  const abc = rotates(prof);
  const tpl = !abc ? 'A' : TPLS.includes(UI.scoreTpl) ? UI.scoreTpl : (mine && UI.tpl) || nextTpl(pid);
  const plan = planFor(prof, tpl);
  const rows = SLOT_ORDER.map(slot => {
    const key = plan[slot];
    const info = exInfo(key, prof);
    const r = scoreRow(pid, key);
    const kg = v => `<b>${esc(kgLabel(v, info))}</b>`;
    let sub, right;
    if (r.state === 'none') {
      // No score, so no weight from a workout either: the weight this person set, else the start weight.
      sub = kg(prof.weights && Object.hasOwn(prof.weights, key) ? prof.weights[key] : info.start ?? 0);
      right = '<span class="sc-none">No score yet</span>';
    } else if (r.state === 'one') {
      sub = `${kg(r.kg)} · first score, ${esc(dayShort(r.date)).replace(/ /g, '\u00a0')}`;   // the date stays on one line
      right = `<span class="sc-r"><span class="sc-n">${r.n}</span><span class="sc-u">reps</span></span>`;
    } else {
      const same = r.state === 'same';
      sub = same ? `${kg(r.kg)} · best ${r.best}` : `${kg(r.kg)} · was ${r.prev.n} at ${esc(kgLabel(r.prev.kg, info))}`;
      const d = !same ? `${r.dk > 0 ? '+' : '−'}${fmtNum(Math.abs(r.dk))} kg` : r.delta > 0 ? `▲ +${r.delta}` : r.delta < 0 ? `▼ −${-r.delta}` : 'same';
      right = `${sparkHtml(r.series, slot)}<span class="sc-r"><span class="sc-n">${r.n}</span><span class="sr-only"> reps, </span><span class="sc-d${same && r.delta > 0 ? ' pos' : ''}">${d}</span></span>`;
    }
    return `<button type="button" class="sc-row" data-act="exHistory" data-ex="${esc(key)}" data-slot="${slot}">${plateHtml(slot)}
      <span class="ex-main"><span class="sr-only">${SLOT[slot].label}: </span><span class="ex-n">${esc(info.n)}</span><span class="sc-sub">${sub}</span></span>${right}</button>`;
  }).join('');
  const seg = abc ? `<div class="seg" role="group" aria-label="Workout">${TPLS.map(t => `<button type="button" data-act="scoreTpl" data-tpl="${t}" aria-pressed="${t === tpl}">${t}</button>`).join('')}</div>` : '';
  return `<section class="card sc" aria-label="Scores"><div class="row"><span class="eyebrow grow">${mine ? 'Your' : esc(displayName(pid)) + '’s'} scores</span>${seg}</div>${rows}</section>`;
}

/* Small line charts, drawn at the real pixel width of their box so text never scales. */
const CH = {};
function chartBox(id, pts, slot, metric) {
  CH[id] = { pts, slot, metric };
  const first = pts[0], last = pts[pts.length - 1];

async function submitSessionForm(form) {

  if (stored && stored.status !== 'done' && !(await deleteSession(id))) return;
  LS.del(DRAFT_KEY());
  if (R.session) closeRunner();
  toast('Workout discarded.');
  scheduleRender();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') dismissSheet(); });
$('#runner').addEventListener('click', e => { if (e.target.classList.contains('run-menu')) ACT.menuBack(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'exSearch') { e.target.blur(); return; }   // puts the phone's keyboard away
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('kg-in')) {
    e.preventDefault();
    const sel = e.target.id === 'runKgIn' ? '#runner [data-act="runKg"][data-dir="1"]' : '[data-act="exKg"][data-dir="1"]';
    e.target.blur();
    setTimeout(() => { const pl = $(sel); if (pl) { try { pl.focus({ preventScroll: true }); } catch { /* ignore */ } } }, 0);
    return;
  }
  if (e.key !== 'Escape') return;
  if (!$('#sheet').hidden) dismissSheet();
  else if (R.session && R.confirm === 'menu') ACT.menuBack();
  else if (R.session && R.phase === 'finish') ACT.finishBack();
  else if (R.session) ACT.runMenu();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'exName' && UI.sheet && UI.sheet.kind === 'ex') UI.sheet.name = el.value;
  if (el.id === 'joinNick') UI.joinNick = el.value;
  if (el.id === 'exKgIn') typedExKg(el);
  if (el.id === 'exSearch') typedExSearch(el);
  if (el.id === 'newName') typedNewName(el);
  if (el.form && el.form.dataset.form === 'session' && /^(kg|ex|tot)\d$/.test(el.name || '')) el.dataset.touched = '1';
  if (el.id === 'sDate') syncDateChips();
});
document.addEventListener('submit', async e => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.form === 'join') {
    const inp = $('#joinNick');
    const nick = (inp?.value || '').trim().slice(0, 30);
    if (inp) inp.blur();
    const btn = f.querySelector('button[type="submit"]');
    if (btn) { if (btn.disabled) return; btn.disabled = true; }
    // Never overwrite a profile that exists but has not arrived yet.
    if (S.mode === 'shared' && !S.ownLocal) {
      let ex;
      try { ex = await S.db.doc('members/' + S.uid).get(); }
      catch { if (btn) btn.disabled = false; toast('Couldn’t check your profile. Try again in a moment.'); return; }
      if (ex.exists) { me().profile = normProfile(ex.data()); if (btn) btn.disabled = false; render(); return; }
    }
    const dev = S.mode === 'shared' ? readOwnLocal() : null;
    const ok = await saveProfile(dev && dev.profile ? Object.assign(dev.profile, nick ? { nick } : {}) : defaultProfile(nick));
    if (btn) btn.disabled = false;
    render();
    { const t = $('[data-act="startSession"]'); if (t) t.focus({ preventScroll: true }); }
    if (ok) toast(nick ? `Welcome, ${nick}!` : 'Welcome!');
  }
  if (f.dataset.form === 'session') submitSessionForm(f);
  if (f.dataset.form === 'ex') submitExSheet();
  if (f.dataset.form === 'exNew') submitExNew();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') { importData(el.files && el.files[0]); el.value = ''; return; }
  if (el.id === 'runKgIn') return;   // committed on focusout
  if (el.id === 'exKgIn') {
    const v = parseKg(el.value);
    if (!Number.isFinite(v)) toast('Type the weight as a number, e.g. 14 or 12.5.');
    else if (v < 0 && !EQUIP[UI.sheet?.eq]?.bw) toast('Minus kilos only work for bodyweight exercises (assistance).');
    showExKg(); return;
  }
  if (el.form && el.form.dataset.form === 'session' && /^ex\d$/.test(el.name || '')) { syncFormExercise(el); return; }
  const field = el.dataset.field;
  if (!field) return;
  if (field === 'sound' || field === 'lead') { prefs[field] = el.checked; savePrefs(); return; }
  const p = clone(myProfile());
  if (!p) return;
  if (field === 'nick') { p.nick = el.value.trim().slice(0, 30); saveProfile(p); }
});

/* ------------------------------------------------------------------ *
 * Export / import
 * ------------------------------------------------------------------ */
// Dutch Excel reads ';' columns and decimal commas.
const dec = v => String(v).replace('.', ',');
function csvCell(v) { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function exportData(fmt) {
  const p = myProfile();
  const sessions = sessionsOf(S.uid);
  let filename, data;
  if (fmt === 'csv') {
    const rows = [['date', 'week', 'workout', 'slot', 'exercise', 'kg', 'reps', 'volume_kg', 'sets', 'stopped_early', 'felt', 'note']];
    for (const s of sessions) for (const b of s.blocks || []) {
      if (!b.done || b.skipped) continue;
      const info = exInfo(b.ex, p);
      rows.push([s.date, isTrial(s, S.uid) ? 'practice' : weekNo(s.date, startOf(S.uid)), s.tpl || 'A', SLOT[b.slot]?.label, blockName(b, p),
        dec(b.kg), b.total, dec(Math.round(blockVolume(b) * 10) / 10), setsText(b, info).replace(/ · /g, ' '), b.cut ? 'yes' : '', FEEL[(s.feel || 0) - 1] || '', s.note || '']);
    }
    data = '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
    filename = '3-3-30-workouts.csv';
  } else {
    data = JSON.stringify({ app: '3-3-30-logboek', v: 1, exported: new Date().toISOString(), profile: p, sessions }, null, 1);
    filename = '3-3-30-backup-' + todayYmd() + '.json';
  }
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('File ready.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try { await navigator.clipboard.writeText(data); toast('Saving a file isn’t possible here — the data is on your clipboard.'); }
  catch {
    openSheet(`<div class="sheet-head"><b class="h2 grow">Copy your data</b><button class="iconbtn" data-act="closeSheet" aria-label="Close">${CLOSE_ICON}</button></div><textarea id="copyOut" readonly style="min-height:260px;font-size:12px">${esc(data)}</textarea>`, 'Copy data');
    const ta = $('#copyOut'); if (ta) ta.select();
  }
}
async function importData(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('This file is too big to be a backup from this app.'); return; }
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { toast('Can’t read this file. Pick a .json backup from this app.'); return; }
  if (!obj || obj.app !== '3-3-30-logboek' || !Array.isArray(obj.sessions)) { toast('This isn’t a backup from the 3-3-30 Log.'); return; }
  const incoming = normProfile(obj.profile);
  const cur0 = myProfile();
  // A fresh log takes over the backup's plan, start date and weights.
  if (incoming && (!cur0 || !trainings(S.uid).length)) await saveProfile(Object.assign(incoming, cur0 && cur0.nick ? { nick: cur0.nick } : {}));
  else if (incoming) {
    const cur = clone(myProfile());
    const add = incoming.custom.filter(c => !allExercises(cur).some(e => e.k === c.k));
    const back = incoming.start < cur.start;
    if (add.length || back) await saveProfile(Object.assign(cur, { custom: (cur.custom || []).concat(add) }, back ? { start: incoming.start } : {}));
  }
  let n = 0, bad = 0, failed = 0;
  for (const raw of obj.sessions) {
    const s = normSession(raw);
    if (!s || !s.blocks.length || JSON.stringify(s).length > 200 * 1024) { bad++; continue; }
    if (me().sessions.has(s.id)) continue;
    if (await saveSession(s, { quiet: true })) n++;
    else { failed++; me().sessions.delete(s.id); }
  }
  scheduleRender();
  if (failed) { toast(`${failed === 1 ? '1 workout' : failed + ' workouts'} couldn’t be saved. Try restoring again in a moment.`); return; }
  toast((n ? `${plural(n, 'workout', 'workouts')} restored.` : 'Everything in this backup was already here.') + (bad ? ` ${bad} unreadable skipped.` : ''));
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
/* A reload starts on the home screen: a step of "My results" or "Settings" becomes a step of the home screen. */
try { if (history.state && history.state.screen) history.replaceState(null, ''); } catch { /* ignore */ }
initStore().then(maybeReopen);
render();
</script>
