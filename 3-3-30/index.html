<title>3-3-30 Logboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: one phone-width column (max 560px), sticky header, fixed bottom tab bar,
   full-screen "runner" overlay for the live 10-minute blocks. Slot colours follow
   the Olympic plate code: red = push, blue = pull, yellow = legs, green = done. */
:root {
  --bg: #EDEFF1;
  --surface: #FBFBFC;
  --surface-2: #E3E6EA;
  --ink: #14181D;
  --ink-2: #48505A;
  --muted: #5F6873;
  --line: #D3D8DE;
  --push: #C8372B;
  --pull: #2456C2;
  --legs: #E7B416;
  --legs-mark: #B07F00;
  --on-push: #FFFFFF;
  --on-pull: #FFFFFF;
  --on-legs: #1D1600;
  --good: #176B3B;
  --on-good: #FFFFFF;
  --good-wash: #DCEFE3;
  --warn: #8F5400;
  --warn-wash: #F6E8CF;
  --bad: #B3261E;
  --primary: #14181D;
  --on-primary: #FBFBFC;
  --clock-bg: #0B0D10;
  --led-on: #FF3B24;
  --led-off: #2A1210;
  --led-lead: #FFB020;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --r-sm: 9px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1114; --surface: #171B20; --surface-2: #222830; --ink: #E8EBEE; --ink-2: #AEB6BF;
    --muted: #8A939D; --line: #2B323A; --push: #E0503F; --pull: #4F7FE6; --legs: #F1C63A;
    --legs-mark: #B88A0C; --on-push: #0E1114; --on-pull: #0E1114; --on-legs: #1D1600;
    --good: #46B977; --on-good: #0E1114; --good-wash: #16301F; --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C;
    --primary: #E8EBEE; --on-primary: #0E1114; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1114; --surface: #171B20; --surface-2: #222830; --ink: #E8EBEE; --ink-2: #AEB6BF;
  --muted: #8A939D; --line: #2B323A; --push: #E0503F; --pull: #4F7FE6; --legs: #F1C63A;
  --legs-mark: #B88A0C; --on-push: #0E1114; --on-pull: #0E1114; --on-legs: #1D1600;
  --good: #46B977; --on-good: #0E1114; --good-wash: #16301F; --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C;
  --primary: #E8EBEE; --on-primary: #0E1114; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pull); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h-display, .ex-name, .blk-name, .h2, .ex-card-head b, .hist .line > span, .sum-row b, .member b, .hist .body p { overflow-wrap: anywhere; hyphens: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
p { margin: 0; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 12px;
  padding-block: 12px; background: var(--bg); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; overflow: hidden; }
.brand .mark { font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: .01em; line-height: 1; }
.brand .mark i { font-style: normal; color: var(--push); }
.brand .sub { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.on .dot { background: var(--good); }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-weight: 700; font-size: 14px;
  color: #fff; background: var(--ink-2); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 8px 4px 10px; display: grid; justify-items: center; gap: 2px; color: var(--muted);
  font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] svg { color: var(--push); }

/* Generic blocks */
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card > * { min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.h-display { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: .005em; }
.h2 { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; }
.lead { color: var(--ink-2); }
.small { font-size: 14px; color: var(--ink-2); }
.tiny { font-size: 12px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.right { margin-left: auto; }
.num { font-variant-numeric: tabular-nums; }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; min-height: 48px; background: var(--surface-2); color: var(--ink); text-decoration: none; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.big { min-height: 60px; font-size: 19px; width: 100%; font-family: var(--display); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.link { background: none; padding: 6px 4px; min-height: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.btn.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.good { background: var(--good); color: var(--on-good); }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; line-height: 1.3; }
.chip.push { background: var(--push); color: var(--on-push); }
.chip.pull { background: var(--pull); color: var(--on-pull); }
.chip.legs { background: var(--legs); color: var(--on-legs); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-wash); color: var(--good); }
.pill.warn { background: var(--warn-wash); color: var(--warn); }
.pill.live { background: var(--push); color: var(--on-push); }

.notice { border-radius: var(--r); padding: 12px 14px; background: var(--warn-wash); color: var(--ink); font-size: 14px; display: grid; gap: 6px; margin-bottom: 14px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wday { border-radius: 12px; border: 1.5px dashed var(--line); padding: 8px 10px; display: grid; gap: 0; min-width: 0; }
.wday b { font-family: var(--display); font-size: 20px; font-weight: 800; line-height: 1.1; }
.wday span { font-size: 12px; color: var(--muted); font-weight: 600; }
.wday.done { border: 1.5px solid var(--good); background: var(--good-wash); }
.wday.done span { color: var(--good); }
.wday.next { border-style: solid; border-color: var(--ink); }
.wday.live { border: 1.5px solid var(--push); }

/* Plan rows (today's three blocks) */
.blocks { display: grid; gap: 0; }
.blk { display: grid; grid-template-columns: 6px 1fr; gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); }
.blk:first-child { border-top: 0; padding-top: 2px; }
.blk .bar { border-radius: 3px; }
.blk.push .bar { background: var(--push); }
.blk.pull .bar { background: var(--pull); }
.blk.legs .bar { background: var(--legs); }
.blk-main { display: grid; gap: 6px; min-width: 0; }
.blk-name { font-weight: 700; font-size: 18px; line-height: 1.2; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper button { width: 44px; height: 44px; border: 0; background: var(--surface-2); font-size: 20px; font-weight: 700; display: grid; place-items: center; }
.stepper .val { min-width: 88px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; padding-inline: 6px; font-size: 15px; }
.stepper .val.tbd { color: var(--muted); font-weight: 600; }
.tipline { font-size: 14px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.tipline b { color: var(--ink); }
.up { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--good-wash); color: var(--good); border-radius: 10px;
  padding: 8px 10px; font-size: 14px; font-weight: 600; }
.up .btn { background: var(--good); color: var(--on-good); }
.tabsel { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; }
.tabsel.scroll { overflow-x: auto; justify-self: start; }
.tabsel button { border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; min-height: 36px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.tabsel:not(.scroll) { flex-wrap: wrap; }
.tabsel.scroll button { flex: none; white-space: nowrap; }
.tabsel button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

/* Stats */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile .val { font-family: var(--body); font-weight: 700; font-size: 28px; line-height: 1.1; }
.tile .val small { font-size: 15px; font-weight: 600; color: var(--muted); }

/* Charts */
.chart-wrap { position: relative; }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart:focus:not(:focus-visible) { outline: none; }
.chart text { font-family: var(--body); fill: var(--muted); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .xh { stroke: var(--ink-2); stroke-width: 1; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 9px;
  font-size: 12px; line-height: 1.35; white-space: nowrap; transform: translateX(-50%); box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
.tip strong { font-size: 15px; display: block; }
.ex-card-head { display: flex; align-items: flex-start; gap: 10px; }
.ex-card-head .grow { display: grid; gap: 2px; }
.delta { font-weight: 700; font-size: 14px; white-space: nowrap; }
.delta.pos { color: var(--good); }
.delta.neg { color: var(--bad); }
.example-tag { position: absolute; top: 4px; right: 4px; }
.faded { opacity: .45; }

/* Adherence grid */
.adh { display: grid; gap: 6px; }
.adh-row { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.adh-row .lbl { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.adh-cells { display: flex; gap: 4px; }
.adh-cells i { width: 26px; height: 18px; border-radius: 4px; background: var(--surface-2); display: block; }
.adh-cells i.on { background: var(--good); }
.adh-cells i.cur { outline: 1.5px dashed var(--line); outline-offset: -1.5px; background: transparent; }

/* History */
.hist { display: grid; gap: 0; }
.hist details { border-top: 1px solid var(--line); }
.hist details:first-child { border-top: 0; }
.hist summary { list-style: none; cursor: pointer; padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.hist summary .grow { flex: 1 1 8em; }
.hist summary::-webkit-details-marker { display: none; }
.hist summary .chev { transition: transform .15s; color: var(--muted); }
.hist details[open] summary .chev { transform: rotate(90deg); }
.hist .body { padding: 0 0 14px; display: grid; gap: 8px; }
.hist .line { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; font-size: 14px; }
.hist .sets { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; grid-column: 2 / 4; }

/* Team */
.member { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 12px; border-top: 1px solid var(--line); }
.member:first-child { border-top: 0; padding-top: 0; }
.mdots { display: inline-flex; gap: 4px; }
.mdots i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--line); display: block; }
.mdots i.on { background: var(--good); border-color: var(--good); }

/* Forms */
.f { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); min-width: 0; }
::placeholder { color: var(--muted); opacity: 1; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 44px; font-size: 16px; }
textarea { min-height: 72px; resize: vertical; }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.daypick button { min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.daypick button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.method ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.method li { padding-left: 2px; }
.method h3 { font-size: 16px; font-weight: 700; }
.bignums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.bignums div { display: grid; }
.bignums b { font-family: var(--display); font-size: 56px; font-weight: 900; line-height: .95; }
.bignums div:nth-child(1) b { color: var(--push); }
.bignums div:nth-child(2) b { color: var(--pull); }
.bignums div:nth-child(3) b { color: var(--legs-mark); }
.bignums span { font-size: 13px; color: var(--ink-2); font-weight: 600; }

/* Runner (live training) */
.runner { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.run-in { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 28px; display: grid; gap: 14px; }
.run-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps i { height: 6px; border-radius: 3px; background: var(--surface-2); display: block; }
.steps i.done.push, .steps i.cur.push { background: var(--push); }
.steps i.done.pull, .steps i.cur.pull { background: var(--pull); }
.steps i.done.legs, .steps i.cur.legs { background: var(--legs); }
.steps i.cur { opacity: .55; }
.ex-name { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 8.5vw, 40px); line-height: .98; letter-spacing: .005em; }
.clock { background: var(--clock-bg); border-radius: 18px; padding: 18px 16px 14px; display: grid; gap: 10px; justify-items: center; color: #9AA3AD; }
.clock svg.led { width: min(100%, 300px); height: auto; display: block; }
.led .seg { fill: var(--led-off); }
.led .seg.on { fill: var(--led-on); }
.led.lead .seg.on { fill: var(--led-lead); }
.led .colon { fill: var(--led-on); }
.led.lead .colon { fill: var(--led-lead); }
.led.paused { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { opacity: .35; } }
.clock .status { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: #C9D0D7; }
.clock .prog { width: 100%; height: 4px; border-radius: 2px; background: #22272E; overflow: hidden; }
.clock .prog b { display: block; height: 100%; background: var(--led-on); width: 0; }
.run-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.run-ctrl .wide { grid-column: 1 / -1; }
.score { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: end; }
.score .total { font-family: var(--display); font-weight: 900; font-size: 72px; line-height: .85; font-variant-numeric: tabular-nums; }
.score .unit { font-weight: 700; color: var(--muted); font-size: 15px; padding-bottom: 6px; display: grid; gap: 2px; }
.score .result { grid-column: 1 / -1; }
.score .cmp { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 14px; color: var(--ink-2); }
.pad-head { display: flex; align-items: baseline; gap: 10px; }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pad button { min-height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--display);
  font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }
.pad button.last { border: 2px solid var(--ink); }
.pad button:active { transform: scale(.96); background: var(--surface-2); }
.pad.off { opacity: .4; pointer-events: none; }
.setlist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 32px; }
.setlist span { background: var(--surface-2); border-radius: 7px; padding: 2px 9px; font-weight: 700; font-variant-numeric: tabular-nums; }
.flash { animation: flash .5s ease-out; }
@keyframes flash { from { background: var(--good-wash); } to { background: transparent; } }
.result { border-radius: var(--r); padding: 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; }
.result.pr { border-color: var(--good); background: var(--good-wash); }
.feel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.feel button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.feel button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.sum-row { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; padding-block: 8px; }
.sum-row .bar { align-self: stretch; border-radius: 3px; }
.sum-row.push .bar { background: var(--push); }
.sum-row.pull .bar { background: var(--pull); }
.sum-row.legs .bar { background: var(--legs); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 70; background: rgb(8 10 12 / .55); display: grid; align-items: end; justify-items: center; }
.sheet-panel { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0;
  padding-inline: 16px; padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px;
  border-top: 1px solid var(--line); box-shadow: 0 -8px 30px rgb(0 0 0 / .35); }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  width: max-content; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgb(0 0 0 / .25); }

.skeleton { color: var(--muted); padding-block: 40px; text-align: center; }
.empty { display: grid; gap: 8px; justify-items: start; }

@media (min-width: 420px) { .tiles { grid-template-columns: repeat(4, 1fr); } .tile .val { font-size: 26px; } }

<script>
'use strict';
document.documentElement.lang = 'nl';

/* ------------------------------------------------------------------ *
 * Method constants
 * ------------------------------------------------------------------ */
const START = '2026-10-05';          // first Monday
const BLOCK_SEC = 600;               // one AMRAP block = 10 minutes
const LEAD_SEC = 10;                 // countdown before a block starts
const UP_THRESHOLD = 0.20;           // +20 % reps on the same weight -> go heavier
const SLOT_ORDER = ['push', 'pull', 'legs'];
const SLOT = {
  push: { label: 'Push', nl: 'duwen' },
  pull: { label: 'Pull', nl: 'trekken' },
  legs: { label: 'Benen', nl: 'benen' },
};
const FEEL = ['Licht', 'Goed', 'Zwaar', 'Kapot'];

/* Gym exercise library. step = weight jump in kg, start = suggested first weight.
   dbl = two dumbbells: shown per dumbbell, stored as the total of both (as the article says).
   bw = bodyweight exercise: weight = extra kg, negative = machine/band assistance. */
const DB2 = 'Je stelt het gewicht per dumbbell in; de app telt ze samen.';
const BAR = 'Houd steeds 2 herhalingen over en stop als je techniek inzakt.';
const LIB = [
  { k: 'db-bankdrukken', dbl: true, n: 'Dumbbell bankdrukken', s: 'push', step: 4, start: 28, tip: DB2 },
  { k: 'db-schouderdrukken', dbl: true, n: 'Dumbbell schouderdrukken (zittend)', s: 'push', step: 4, start: 20, tip: DB2 },
  { k: 'schuin-db', dbl: true, n: 'Schuine dumbbell bankdrukken', s: 'push', step: 4, start: 24, tip: DB2 },
  { k: 'bankdrukken', n: 'Bankdrukken (barbell)', s: 'push', step: 2.5, start: 40, tip: 'Alleen met safety-pins of een spotter: vermoeid kun je vast komen te zitten. ' + BAR },
  { k: 'schouderdrukken', n: 'Schouderdrukken (barbell, staand)', s: 'push', step: 2.5, start: 25, tip: 'Houd je onderrug neutraal, ook als je moe wordt. ' + BAR },
  { k: 'dips', n: 'Dips', s: 'push', bw: true, step: 2.5, start: 0, tip: 'Niet dieper zakken dan prettig voelt voor je schouders.' },
  { k: 'push-ups', n: 'Push-ups', s: 'push', bw: true, step: 2.5, start: 0 },
  { k: 'chest-press', n: 'Chest press (machine)', s: 'push', step: 5, start: 35 },
  { k: 'borst-roeien', dbl: true, n: 'Chest-supported dumbbell row', s: 'pull', step: 4, start: 24, tip: DB2 },
  { k: 'optrekken', n: 'Optrekken (pull-ups)', s: 'pull', bw: true, step: 2.5, start: 0, tip: 'Lukt het nog niet vaak genoeg? Gebruik een elastiek of de assisted machine en vul de hulp in als minus-kilo’s.' },
  { k: 'pendlay', n: 'Pendlay row', s: 'pull', step: 2.5, start: 40, tip: 'Elke herhaling start stil vanaf de vloer. ' + BAR },
  { k: 'kabelroeien', n: 'Kabelroeien (zittend)', s: 'pull', step: 5, start: 35 },
  { k: 'lat-pulldown', n: 'Lat pulldown', s: 'pull', step: 5, start: 35 },
  { k: 'db-roeien', n: 'Dumbbell row (één arm)', s: 'pull', step: 2, start: 16, tip: 'Tel de herhalingen van beide armen bij elkaar.' },
  { k: 'chin-ups', n: 'Chin-ups', s: 'pull', bw: true, step: 2.5, start: 0 },
  { k: 'barbell-roeien', n: 'Barbell row', s: 'pull', step: 2.5, start: 35 },
  { k: 'goblet-squat', n: 'Goblet squat', s: 'legs', step: 2, start: 16 },
  { k: 'db-rdl', dbl: true, n: 'Dumbbell Roemeense deadlift', s: 'legs', step: 4, start: 32, tip: DB2 + ' Stop als je rug rond wordt.' },
  { k: 'reverse-lunge', dbl: true, n: 'Dumbbell reverse lunge', s: 'legs', step: 4, start: 16, tip: 'Wissel van been; elke lunge telt als 1 herhaling. ' + DB2 },
  { k: 'leg-press', n: 'Leg press', s: 'legs', step: 10, start: 80 },
  { k: 'squat', n: 'Squat (barbell)', s: 'legs', step: 5, start: 40, tip: 'Alleen met safety-pins. ' + BAR },
  { k: 'trapbar', n: 'Trap-bar deadlift', s: 'legs', step: 5, start: 50, tip: 'Elke herhaling vanaf de vloer. ' + BAR },
  { k: 'deadlift', n: 'Deadlift', s: 'legs', step: 5, start: 50, tip: 'Zwaarste keuze voor 10 minuten: kies ruim licht en doe kleine sets. ' + BAR },
  { k: 'rdl', n: 'Roemeense deadlift (barbell)', s: 'legs', step: 5, start: 40, tip: BAR },
  { k: 'bulgaarse', dbl: true, n: 'Bulgaarse split squat', s: 'legs', step: 4, start: 16, tip: 'Tel de herhalingen van beide benen bij elkaar. ' + DB2 },
];
const DEFAULT_MODE = 'abc';
/* The article's example week (Mon/Wed/Fri). */
const DEFAULT_PLANS = {
  A: { push: 'db-bankdrukken', pull: 'borst-roeien', legs: 'goblet-squat' },
  B: { push: 'db-schouderdrukken', pull: 'optrekken', legs: 'db-rdl' },
  C: { push: 'schuin-db', pull: 'pendlay', legs: 'reverse-lunge' },
};
const CYCLE_WEEKS = 4;

/* ------------------------------------------------------------------ *
 * Small helpers
 * ------------------------------------------------------------------ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const todayYmd = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const mondayOf = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const weekNo = (s, start) => Math.floor(daysBetween(mondayOf(start), mondayOf(s)) / 7) + 1;
const cycleWeek = (s, start) => { const n = Math.max(1, weekNo(s, start)); return { round: Math.ceil(n / CYCLE_WEEKS), w: ((n - 1) % CYCLE_WEEKS) + 1 }; };
const fmtLong = s => parseYmd(s).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => parseYmd(s).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtDM = s => parseYmd(s).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
const fmtNum = n => Number(n || 0).toLocaleString('nl-NL', { maximumFractionDigits: 1 });
const WD = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const uidGen = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'oefening';

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
};
const prefs = Object.assign({ sound: true, lead: true, metric: 'reps', tab: 'train' }, LS.get('d330.prefs', {}));
const savePrefs = () => LS.set('d330.prefs', prefs);

/* ------------------------------------------------------------------ *
 * Store: shared db (members/<uid> + members/<uid>/sessions/<id>) with a
 * localStorage fallback when the shared logbook is unavailable or read-only.
 * ------------------------------------------------------------------ */
const S = {
  mode: 'loading',          // 'shared' | 'local'
  ownLocal: false,          // own data lives in localStorage (no write access)
  uid: null, db: null, user: null,
  members: new Map(),       // uid -> { profile, sessions: Map }
  subs: new Map(),
  loaded: false,            // members list known (or gave up waiting)
  membersSeen: false,       // a members snapshot actually arrived
  migrating: false,         // moving device-only data into the shared logbook
  hidden: new Set(),        // sessions removed on this device while device-only
  dirty: new Set(),         // sessions changed on this device while device-only
  profileDirty: false,
  people: {},               // uid -> resolved Profile (name, avatarUrl, color)
  meInfo: null,
  notice: '',
};
const LKEY = () => 'd330.own.' + (S.uid || 'local');
const NOTICE_VIEWER = 'Je kunt in dit gedeelde logboek alleen meekijken. Je eigen trainingen worden daarom op dit toestel bewaard. Krijg je later bewerkrechten, dan zet de app ze vanzelf in het gedeelde logboek.';
const NOTICE_DENIED = 'Opslaan in het gedeelde logboek lukt niet met jouw rechten. Je trainingen worden op dit toestel bewaard. Krijg je bewerkrechten, dan zet de app ze vanzelf in het gedeelde logboek.';

/* Everything read from the shared store or a backup is other people's input:
   coerce it to the shapes the page expects before it is rendered. */
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const ID_RE = /^[A-Za-z0-9_.~:@+-]{1,80}$/;
const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, num(v)));
const validYmd = d => typeof d === 'string' && DATE_RE.test(d) && ymd(parseYmd(d)) === d && d >= '2020-01-01' && d <= '2099-12-31';
const str = (v, max) => (typeof v === 'string' ? v.slice(0, max) : '');
function normSession(s, id) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.blocks) || !validYmd(s.date)) return null;
  const sid = typeof id === 'string' ? id : str(s.id, 80);
  if (!ID_RE.test(sid)) return null;
  const blocks = s.blocks.filter(b => b && typeof b === 'object' && Object.hasOwn(SLOT, b.slot)).slice(0, 6).map(b => ({
    slot: b.slot, ex: ID_RE.test(b.ex) ? b.ex : 'onbekend', name: str(b.name, 60), kg: clampN(b.kg, -300, 1000), bw: !!b.bw,
    sets: (Array.isArray(b.sets) ? b.sets : []).slice(0, 300)
      .map(x => ({ r: Math.round(clampN(x && x.r, 0, 200)), kg: clampN(x && x.kg != null ? x.kg : b.kg, -300, 1000), t: x && x.t != null ? Math.round(clampN(x.t, 0, BLOCK_SEC)) : null }))
      .filter(x => x.r > 0),
    total: Math.round(clampN(b.total, 0, 3000)), dur: Math.round(clampN(b.dur, 0, BLOCK_SEC)),
    done: !!b.done, skipped: !!b.skipped, cut: !!b.cut,
  }));
  return {
    v: 1, id: sid, date: s.date, tpl: ['A', 'B', 'C'].includes(s.tpl) ? s.tpl : 'A',
    status: s.status === 'done' ? 'done' : 'active', paused: !!s.paused, manual: !!s.manual,
    startedAt: num(s.startedAt), updatedAt: num(s.updatedAt), endedAt: num(s.endedAt),
    blocks, feel: Math.min(4, Math.max(0, Math.round(num(s.feel)))), note: str(s.note, 400),
  };
}
function normProfile(p) {
  if (!p || typeof p !== 'object') return null;
  const days = [...new Set((Array.isArray(p.days) ? p.days : [1, 3, 5]).map(Number).filter(d => Number.isInteger(d) && d >= 0 && d <= 6))];
  const custom = (Array.isArray(p.custom) ? p.custom : [])
    .filter(c => c && typeof c.k === 'string' && ID_RE.test(c.k) && !(c.k in Object.prototype) && Object.hasOwn(SLOT, c.s)).slice(0, 60)
    .map(c => ({ k: c.k, n: str(c.n, 40) || c.k, s: c.s, step: Number(c.step) > 0 ? clampN(c.step, 0.5, 50) : 2.5, start: clampN(c.start, -300, 1000), bw: !!c.bw, dbl: !!c.dbl }));
  const plans = {};
  for (const t of ['A', 'B', 'C']) {
    const pl = p.plans && p.plans[t];
    if (pl && typeof pl === 'object') { plans[t] = {}; for (const sl of SLOT_ORDER) if (typeof pl[sl] === 'string' && ID_RE.test(pl[sl])) plans[t][sl] = pl[sl]; }
  }
  const weights = {};
  if (p.weights && typeof p.weights === 'object') {
    for (const [k, v] of Object.entries(p.weights).slice(0, 300)) if (ID_RE.test(k) && Number.isFinite(Number(v))) weights[k] = clampN(v, -300, 1000);
  }
  return { v: 1, nick: str(p.nick, 30), joined: num(p.joined), start: validYmd(p.start) ? p.start : START,
    days: days.length ? days : [1, 3, 5], mode: p.mode === 'same' ? 'same' : 'abc', plans, custom, weights };
}

function member(id) {
  if (!S.members.has(id)) S.members.set(id, { profile: null, sessions: new Map() });
  return S.members.get(id);
}
const me = () => member(S.uid);
const myProfile = () => me().profile;

function readOwnLocal() {
  const raw = LS.get(LKEY(), null);
  if (!raw || typeof raw !== 'object') return null;
  const sessions = new Map();
  for (const [id, s] of Object.entries(raw.sessions || {})) { const n = normSession(s, id); if (n) sessions.set(id, n); }
  const ids = v => (Array.isArray(v) ? v.filter(x => typeof x === 'string' && ID_RE.test(x)) : []);
  return { profile: normProfile(raw.profile), sessions, hidden: ids(raw.hidden), dirty: ids(raw.dirty), profileDirty: !!raw.profileDirty };
}
function loadOwnLocal() {
  const raw = readOwnLocal();
  const m = me();
  if (raw) {
    m.profile = raw.profile || m.profile;
    m.sessions = raw.sessions;
    S.hidden = new Set(raw.hidden);
    S.dirty = new Set(raw.dirty);
    S.profileDirty = raw.profileDirty;
  }
}
/* After a direct write succeeds, an older pending device copy of that item must not
   overwrite it on a later visit. */
function dropPending(id) {
  if (S.ownLocal || S.migrating) return;
  const raw = LS.get(LKEY(), null);
  if (!raw || typeof raw !== 'object') return;
  if (id === null) { raw.profile = null; raw.profileDirty = false; }
  else {
    if (raw.sessions) delete raw.sessions[id];
    raw.dirty = (raw.dirty || []).filter(x => x !== id);
    raw.hidden = (raw.hidden || []).filter(x => x !== id);
  }
  LS.set(LKEY(), raw);
}
/* Device copy of the own logbook. `dirty`/`profileDirty` mark what changed here and
   must win over the shared copy once this viewer can write again. */
function saveOwnLocal() {
  const m = me();
  LS.set(LKEY(), { profile: m.profile, sessions: Object.fromEntries(m.sessions), hidden: [...S.hidden], dirty: [...S.dirty], profileDirty: !!S.profileDirty });
}

async function initStore() {
  let db = null, user = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (user) uid = await user.id();
    }
  } catch { db = null; }
  S.user = user;
  if (user) {
    try { S.meInfo = await user.me(); } catch { /* ignore */ }
  }
  if (db && uid && ID_RE.test(uid)) {
    S.mode = 'shared'; S.db = db; S.uid = uid;
    let canWrite = null;
    try { canWrite = await user.can('data.write'); } catch { canWrite = null; }
    member(uid);
    if (canWrite === false) useOwnLocal(NOTICE_VIEWER);
    else {
      const local = readOwnLocal();
      if (local && (local.profile || local.sessions.size || local.hidden.length)) migrateLocal(local);
    }
    subscribeMembers();
    subscribeSessions(uid);
    setTimeout(() => { if (!S.loaded) { S.loaded = true; scheduleRender(); } }, 7000);
  } else {
    S.mode = 'local'; S.uid = 'local'; S.ownLocal = true;
    loadOwnLocal();
    S.loaded = true; S.membersSeen = true;
  }
  scheduleRender();
}

/* Device-only data (from an earlier read-only visit or a failed write) moves into the
   shared logbook as soon as this viewer can write there. Each item leaves the device
   copy only after it is stored, so an interrupted move resumes next visit. */
async function migrateLocal(local) {
  S.migrating = true;
  const m = me();
  if (local.profile && !m.profile) m.profile = local.profile;
  for (const [id, sess] of local.sessions) if (!m.sessions.has(id)) m.sessions.set(id, sess);
  scheduleRender();
  const dirty = new Set(local.dirty);
  const persist = () => LS.set(LKEY(), { profile: local.profile, sessions: Object.fromEntries(local.sessions), hidden: [...local.hidden], dirty: [...dirty], profileDirty: !!local.profileDirty });
  let moved = 0;
  try {
    if (local.profile) {
      const own = await S.db.doc('members/' + S.uid).get();
      if (!own.exists || local.profileDirty) await dbWrite('members/' + S.uid, local.profile);
      local.profile = null; local.profileDirty = false; persist();
    }
    for (const sess of [...local.sessions.values()]) {
      const path = 'members/' + S.uid + '/sessions/' + sess.id;
      if (dirty.has(sess.id) || !(await S.db.doc(path).get()).exists) { await dbWrite(path, sess); moved++; }
      local.sessions.delete(sess.id); dirty.delete(sess.id); persist();
    }
    for (const id of [...local.hidden]) {
      await dbWrite('members/' + S.uid + '/sessions/' + id, null, true);
      local.hidden = local.hidden.filter(x => x !== id); persist();
    }
    LS.del(LKEY());
    if (moved) toast(`${moved === 1 ? '1 training van dit toestel staat' : moved + ' trainingen van dit toestel staan'} nu in het gedeelde logboek.`);
  } catch (e) {
    if (!handleWriteError(e, true)) toast('Nog niet alles van dit toestel staat in het gedeelde logboek. De app probeert het bij je volgende bezoek opnieuw.');
  }
  S.migrating = false;
  scheduleRender();
}

function useOwnLocal(reason) {
  const wasLocal = S.ownLocal;
  S.ownLocal = true;
  S.notice = reason || S.notice;
  const m = me();
  const keep = { profile: m.profile, sessions: new Map(m.sessions) };
  if (!wasLocal) { S.dirty = new Set(); loadOwnLocal(); }
  if (!m.profile) m.profile = keep.profile;
  for (const [id, s] of keep.sessions) if (!m.sessions.has(id) && !S.hidden.has(id)) m.sessions.set(id, s);
  saveOwnLocal();
  scheduleRender();
}

function subscribeMembers() {
  const unsub = S.db.collection('members').onSnapshot(snap => {
    const seen = new Set();
    for (const d of snap.docs) {
      if (!ID_RE.test(d.id)) continue;
      seen.add(d.id);
      const prof = normProfile(d.data());
      if (d.id === S.uid) {
        if (S.ownLocal) { if (!me().profile && prof) { me().profile = prof; saveOwnLocal(); } continue; }
        if (profileTimer || wq.has('members/' + S.uid)) continue;   // keep a pending local edit
        me().profile = prof;
        continue;
      }
      member(d.id).profile = prof;
      subscribeSessions(d.id);
    }
    for (const id of [...S.members.keys()]) {
      if (id !== S.uid && !seen.has(id)) {
        const u = S.subs.get('s:' + id); if (u) { try { u(); } catch { /* ignore */ } S.subs.delete('s:' + id); }
        S.members.delete(id);
      }
    }
    if (!snap.metadata.fromCache) { S.loaded = true; S.membersSeen = true; }
    resolvePeople();
    scheduleRender();
    maybeReopen();
  }, () => {
    S.notice = 'Het gedeelde logboek is nu niet bereikbaar. Herlaad de pagina om het opnieuw te proberen.';
    S.loaded = true; scheduleRender();
  });
  S.subs.set('members', unsub);
}

function subscribeSessions(id) {
  const key = 's:' + id;
  if (S.subs.has(key)) return;
  const unsub = S.db.collection('members/' + id + '/sessions').onSnapshot(snap => {
    const m = member(id);
    if (id === S.uid && S.ownLocal) {
      // Read-only viewer: shared history is the base, local entries win.
      let changed = false;
      for (const d of snap.docs) {
        if (m.sessions.has(d.id) || S.hidden.has(d.id)) continue;
        const n = normSession(d.data(), d.id);
        if (n) { m.sessions.set(d.id, n); changed = true; }
      }
      if (changed) { saveOwnLocal(); scheduleRender(); }
      return;
    }
    const next = new Map();
    for (const d of snap.docs) { const n = normSession(d.data(), d.id); if (n) next.set(d.id, n); }
    m.sessions = next;
    if (id === S.uid && !S.ownSeen) { S.ownSeen = true; maybeReopen(); }
    scheduleRender();
  }, () => { S.subs.delete(key); });

}

async function resolvePeople() {
  if (!S.user || S.mode !== 'shared') return;
  try {
    const ids = [...S.members.keys()];
    const ps = await S.user.profiles(ids);
    let changed = false;
    for (const id of ids) {
      const p = ps[id]; if (!p) continue;
      const prev = S.people[id];
      if (!prev || prev.name !== p.name || prev.avatarUrl !== p.avatarUrl) changed = true;
      S.people[id] = p;

    if (changed) scheduleRender();
  } catch { /* ignore */ }
}

/* One write at a time per document. */
const wq = new Map();
function queueWrite(path, fn) {
  const prev = wq.get(path) || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);
  wq.set(path, p);
  p.finally(() => { if (wq.get(path) === p) wq.delete(path); }).catch(() => {});
  return p;
}
async function dbWrite(path, data, del) {
  return queueWrite(path, async () => {
    const ref = S.db.doc(path);
    try { del ? await ref.delete() : await ref.set(data); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(500 + Math.random() * 1000); del ? await ref.delete() : await ref.set(data); }
      else throw e;

  });
}
/* Returns true when the app switched to device-only storage. */
function handleWriteError(e, quiet) {
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') { useOwnLocal(NOTICE_DENIED); return true; }
  if (quiet) return false;
  if (code === 'quota_exceeded') toast('Het logboek is vol. Maak een backup en verwijder oude trainingen.');
  else toast('Opslaan lukte niet. Je gegevens staan nog op dit scherm; probeer het zo opnieuw.');
  return false;
}

  catch (e) {

/* ------------------------------------------------------------------ *
 * Domain logic
 * ------------------------------------------------------------------ */
/* A late joiner starts this week, or next Monday when no training day is left this week. */
function lateStart(today) {
  if (today <= START) return START;
  const mon = mondayOf(today);
  return [1, 3, 5].some(d => addDays(mon, (d + 6) % 7) >= today) ? mon : addDays(mon, 7);
}
function defaultProfile(nick) {
  const today = todayYmd();
  return { v: 1, nick: nick || '', joined: Date.now(), start: lateStart(today), days: [1, 3, 5], mode: DEFAULT_MODE,
    plans: clone(DEFAULT_PLANS), custom: [], weights: {} };
}
function exInfo(key, profile) {
  return LIB.find(e => e.k === key) || (profile?.custom || []).find(e => e.k === key)
    || { k: key, n: key, s: 'push', step: 2.5, start: 0 };
}
function allExercises(profile) { return LIB.concat(profile?.custom || []); }
function exName(key, profile, fallback) {
  const lib = LIB.find(e => e.k === key) || (profile?.custom || []).find(e => e.k === key);
  return lib ? lib.n : (fallback || key);
}
function displayName(id) {
  const p = S.members.get(id)?.profile;
  if (p?.nick) return p.nick;
  const r = S.people[id];
  if (r?.name) return r.name;
  if (id === S.uid) return S.meInfo?.name || 'Jij';
  return 'Maatje';
}
function avatarHtml(id, size) {
  const r = S.people[id] || (id === S.uid ? S.meInfo : null);
  const name = displayName(id);
  const dims = size ? `width:${size}px;height:${size}px;` : '';
  if (r?.avatarUrl && !(S.members.get(id)?.profile?.nick && !r.name)) {
    return `<span class="avatar" style="${dims}"><img src="${esc(r.avatarUrl)}" alt=""></span>`;
  }
  const bg = r?.color && /^(#[0-9a-f]{3,8}|rgba?\([\d.\s,%\/]+\))$/i.test(r.color) ? r.color : '#48505A';
  return `<span class="avatar" style="${dims}background:${esc(bg)}">${esc(name.trim().charAt(0).toUpperCase() || '?')}</span>`;
}

const startOf = id => S.members.get(id)?.profile?.start || START;
function sessionsOf(id) {
  const m = S.members.get(id);
  if (!m) return [];
  return [...m.sessions.values()]
    .filter(Boolean)
    .sort((a, b) => (a.date === b.date ? (a.startedAt || 0) - (b.startedAt || 0) : a.date < b.date ? -1 : 1));
}
const doneBlocks = s => (s.blocks || []).filter(b => b.done && !b.skipped && b.total > 0);
const countsAsTraining = s => doneBlocks(s).length > 0;
const isTrial = (s, id) => s.date < startOf(id);
/* Trainings that count: at least one finished block, on or after the start date. */
function trainings(id) { return sessionsOf(id).filter(s => countsAsTraining(s) && !isTrial(s, id)); }
function history(id, exKey, beforeSessionId) {
  const out = [];
  for (const s of sessionsOf(id)) {
    if (beforeSessionId && s.id === beforeSessionId) break;
    if (isTrial(s, id)) continue;
    for (const b of doneBlocks(s)) if (b.ex === exKey) out.push(Object.assign({}, b, { date: s.date, sid: s.id }));
  }
  return out;
}
/* The block to beat: the latest one that ran the full 10 minutes. */
function refBlock(hist) {
  for (let i = hist.length - 1; i >= 0; i--) if (!hist[i].cut) return hist[i];
  return hist[hist.length - 1] || null;
}
/* Total weight lifted = weight × reps, per set (the article's score). */
function blockVolume(b) {
  if (b.bw) return 0;
  const sets = b.sets || [];
  if (sets.length) return sets.reduce((a, x) => a + (x.kg != null ? Number(x.kg) : (Number(b.kg) || 0)) * x.r, 0);
  return (Number(b.kg) || 0) * (b.total || 0);
}
const scored = b => !b.bw && Number(b.kg) > 0;
function setKgs(b) { return [...new Set((b.sets || []).map(x => Number(x.kg ?? b.kg)))]; }
function setsText(b, info) {
  const sets = b.sets || [];
  if (setKgs(b).length <= 1 || b.bw) return sets.map(x => x.r).join(' · ');
  return sets.map(x => `${x.r}×${kgShort(x.kg ?? b.kg, info)}`).join(' · ');
}
/* The weight a block counts at: the lightest weight from the first heaviest set on,
   so warm-up ramps are ignored but drop sets count. */
function workKg(b) {
  const sets = (b.sets || []).filter(x => x.kg != null);
  if (!sets.length) return b.kg;
  const hi = Math.max(...sets.map(x => x.kg));
  return Math.min(...sets.slice(sets.findIndex(x => x.kg === hi)).map(x => x.kg));
}

/* Compare a block with the previous one of the same exercise. More kg is always harder
   (for bodyweight work kg = extra weight, negative = assistance). The article: beat last
   time with more reps at the same weight, or the same reps at a bit more weight. */
function compare(b, prev) {
  if (!prev) return null;
  const dk = Math.round(((Number(b.kg) || 0) - (Number(prev.kg) || 0)) * 10) / 10;
  const dr = (b.total || 0) - (prev.total || 0);
  let verdict;
  if (dk === 0) verdict = dr > 0 ? 'beter' : dr === 0 ? 'gelijk' : 'minder';
  else if (dk > 0) verdict = dr >= 0 ? 'beter' : 'zwaarder';
  else verdict = dr > 0 ? 'lichter' : 'minder';
  const parts = [];
  if (dk) parts.push(`${dk > 0 ? '+' : '−'}${fmtNum(Math.abs(dk))} kg`);
  parts.push(`${dr >= 0 ? '+' : '−'}${Math.abs(dr)} herh.`);
  return { dk, dr, verdict, text: parts.join(' · '), tone: verdict === 'beter' ? 'pos' : verdict === 'minder' ? 'neg' : '' };
}
const VERDICT_TEXT = {
  beter: 'Vorige keer verslagen!',
  gelijk: 'Precies gelijk aan vorige keer.',
  minder: 'Net niet. Volgende keer beter.',
  zwaarder: 'Zwaarder gewicht, iets minder herhalingen. Dat hoort zo na een verhoging.',
  lichter: 'Lichter gewicht, meer herhalingen.',
};
/* 'reps': more reps than ever at this weight or lighter; 'kg': same best reps, heavier. */
function recordKind(b, hist) {
  if (!hist.length || !(b.total > 0)) return null;
  const kg = Number(b.kg) || 0;
  const ref = hist.filter(h => (Number(h.kg) || 0) <= kg);
  if (!ref.length) return null;
  const best = Math.max(...ref.map(h => h.total));
  if (b.total > best) return 'reps';
  if (b.total === best && ref.every(h => (Number(h.kg) || 0) < kg || h.total < best)) return 'kg';
  return null;
}

/* Progression advice. When to go heavier is a tip, not from the article: the first
   fresh set had 12+ reps (the weight is lighter than the 5-10 rep weight the article
   asks for), or +20 % reps on the same weight (Escalating Density Training's rule). */
function advice(hist, info) {
  const full = hist.filter(h => !h.cut);
  const h2 = full.length ? full : hist;
  if (!h2.length) return { first: true };
  const last = h2[h2.length - 1];
  let i = h2.length - 1;
  while (i > 0 && h2[i - 1].kg === last.kg) i--;
  const base = h2[i];
  const runLen = h2.length - i;
  const gain = base.total > 0 ? (last.total - base.total) / base.total : 0;
  const out = { last, base, gain, runLen };
  const firstWork = (last.sets || []).find(x => Number(x.kg ?? last.kg) === Number(last.kg));
  const step = info.step || 2.5;
  const upKg = info.bw && last.kg < 0 ? Math.min(0, last.kg + step) : Math.round((last.kg + step) * 10) / 10;
  if (firstWork && firstWork.r >= 12) { out.up = upKg; out.why = `Je eerste set was ${firstWork.r} herhalingen: dit gewicht is lichter dan de 5 à 10 waar de methode mee werkt.`; }
  else if (runLen >= 2 && gain >= UP_THRESHOLD) { out.up = upKg; out.why = `${Math.round(gain * 100)}% meer herhalingen op dit gewicht dan de eerste keer.`; }
  return out;
}
/* What to aim for at the planned weight. */
function targetText(adv, kg) {
  const last = adv.last;
  const k = Number(kg) || 0, lk = Number(last.kg) || 0;
  if (k > lk) return `<b>${last.total}</b> herhalingen op het zwaardere gewicht`;
  if (k < lk) return 'zoveel mogelijk herhalingen (lichter dan vorige keer telt niet als verbetering)';
  return `<b>${last.total + 1}+</b> herhalingen`;
}
function kgLabel(kg, info) {
  if (kg == null || kg === '') return 'kies gewicht';
  const n = Number(kg);
  if (info.bw) {
    if (n === 0) return 'lichaamsgewicht';
    return n > 0 ? `+${fmtNum(n)}\u00a0kg` : `${fmtNum(-n)}\u00a0kg\u00a0hulp`;
  }
  if (info.dbl) return `2\u00a0×\u00a0${fmtNum(n / 2)}\u00a0kg`;
  return `${fmtNum(n)}\u00a0kg`;
}
function kgShort(kg, info) {
  const n = Number(kg) || 0;
  if (info.bw) return n === 0 ? '0' : n > 0 ? `+${fmtNum(n)}` : `−${fmtNum(-n)}`;
  return info.dbl ? `2×${fmtNum(n / 2)}` : fmtNum(n);
}
/* A block's weight; a range when it mixed weights. */
function blockKgLabel(b, info) {
  const ks = setKgs(b);
  if (ks.length > 1 && !b.bw) {
    const lo = Math.min(...ks), hi = Math.max(...ks);
    return info.dbl ? `2\u00a0×\u00a0${fmtNum(lo / 2)}–${fmtNum(hi / 2)}\u00a0kg` : `${fmtNum(lo)}–${fmtNum(hi)}\u00a0kg`;

}
function plannedKg(profile, key) {
  const info = exInfo(key, profile);
  const w = profile?.weights && Object.hasOwn(profile.weights, key) ? profile.weights[key] : null;
  if (w != null) return { kg: w, suggested: false };
  const hist = history(S.uid, key);
  if (hist.length) return { kg: hist[hist.length - 1].kg, suggested: false };
  return { kg: info.start ?? 0, suggested: true };
}

function weekSessions(id, anyDay) {
  const mon = mondayOf(anyDay);
  return trainings(id).filter(s => mondayOf(s.date) === mon);
}
/* A/B/C by how many trainings of that week came before `day`. */
function templateFor(profile, day) {
  if (!profile || profile.mode !== 'abc') return 'A';
  const done = weekSessions(S.uid, day).filter(s => s.date < day || (s.date === day && s.status === 'done')).length;
  return ['A', 'B', 'C'][done % 3];
}
function planFor(profile, tpl) {
  return Object.assign({}, DEFAULT_PLANS.A, profile?.plans?.[tpl] || profile?.plans?.A || {});
}
function streakWeeks(id) {
  const ts = trainings(id);
  if (!ts.length) return 0;
  const byWeek = new Map();
  for (const s of ts) { const w = mondayOf(s.date); byWeek.set(w, (byWeek.get(w) || 0) + 1); }
  let wk = mondayOf(todayYmd());
  if ((byWeek.get(wk) || 0) < 3) wk = addDays(wk, -7);
  let n = 0;
  while ((byWeek.get(wk) || 0) >= 3) { n++; wk = addDays(wk, -7); }
  return n;

/* How many blocks beat the previous full block of the same exercise. */
function beatStats(id) {

  for (const s of trainings(id)) for (const b of doneBlocks(s)) keys.add(b.ex);
  let beat = 0, n = 0;

    const h = history(id, k);
    for (let i = 1; i < h.length; i++) {

}
function nextTrainingDay(profile, from) {
  const days = profile?.days?.length ? profile.days : [1, 3, 5];

  let d = from < start ? start : from;
  for (let i = 0; i < 14; i++) {

/* The training the Training tab is about: today if it is a training day and not

function planDay(p) {
  const today = todayYmd();
  const doneToday = weekSessions(S.uid, today).some(s => s.date === today && s.status === 'done');
  return nextTrainingDay(p, doneToday ? addDays(today, 1) : today);

 * UI state + rendering

const UI = { tab: ['train', 'progress', 'team', 'plan'].includes(prefs.tab) ? prefs.tab : 'train', person: null, tpl: null, confirm: null, sheet: null, sheetReturn: null, runReturn: null, histOpen: new Set() };
let renderQueued = false, renderDeferred = false;

}
document.addEventListener('focusout', () => { if (renderDeferred) { renderDeferred = false; setTimeout(scheduleRender, 0); } });

/* A re-render replaces the view's HTML; put keyboard focus back on the same control. */
const FOCUS_KEYS = ['id', 'd', 'mode', 'tpl', 'ex', 'm', 'dir', 'tab', 'fmt', 'n', 'v'];
function focusSel(a) {
  if (!a || a === document.body || !a.closest) return null;

  if (a.tagName === 'SUMMARY') { const d = a.closest('details[data-hist]'); if (d) return `details[data-hist="${CSS.escape(d.dataset.hist)}"] > summary`; }
  if (a.tagName === 'A' && a.getAttribute('href')) return `a[href="${CSS.escape(a.getAttribute('href'))}"]`;

  if (el) { try { el.focus({ preventScroll: true }); } catch { /* ignore */ } }
}

function render() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox') { renderDeferred = true; return; }
  const fsel = a && a.closest && (a.closest('#main') || a.closest('#notice')) ? focusSel(a) : null;

  }

  } catch (e) {

const SKELETON = `<div class="skeleton">Je logboek wordt geladen…</div>`;

/* ---------- Training tab ---------- */
function viewTrain() {
  const p = myProfile();

  // Never offer 'Ik doe mee' before we know this person has no profile yet.
  if (!p && S.mode === 'shared' && !S.membersSeen) return SKELETON;
  if (!p) return viewOnboarding();
  const today = todayYmd();
  const start = p.start || START;
  const pre = today < start;
  const wkDay = pre ? start : today;
  const draft = loadDraft();
  const draftId = draft ? draft.session.id : null;
  const wk = weekSessions(S.uid, wkDay);
  const doneToday = !pre && wk.some(s => s.date === today && s.status === 'done');
  const next = nextTrainingDay(p, doneToday ? addDays(today, 1) : today);
  const isToday = next === today;
  const tpl = UI.tpl || templateFor(p, next);
  const plan = planFor(p, tpl);

  let head;
  if (pre) {
    const n = daysBetween(today, start);
    head = `<div class="eyebrow">${start > START ? 'Je begint' : 'Jullie starten'} over ${n} ${n === 1 ? 'dag' : 'dagen'}</div><h1 class="h-display">${esc(cap(fmtLong(start)))}</h1>`;
  } else if (doneToday) {
    head = `<div class="eyebrow">Vandaag gedaan</div><h1 class="h-display">Goed bezig. Volgende: ${esc(fmtLong(next))}</h1>`;
  } else if (isToday) {
    head = `<div class="eyebrow">${esc(cap(fmtLong(today)))}</div><h1 class="h-display">Vandaag is trainingsdag</h1>`;
  } else {
    head = `<div class="eyebrow">${esc(cap(fmtLong(today)))} · rustdag</div><h1 class="h-display">Volgende training: ${esc(fmtLong(next))}</h1>`;
  }

  // Week strip: the trainings done this week, plus the planned days still open
  const days = (p.days?.length ? p.days : [1, 3, 5]).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
  const mon = mondayOf(wkDay);
  const planned = days.map(d => addDays(mon, (d + 6) % 7));
  const open = planned.filter(d => !wk.some(x => x.date === d));
  const fill = open.filter(d => d >= today).concat(open.filter(d => d < today).reverse()).slice(0, Math.max(0, 3 - wk.length));
  const items = wk.slice(0, 3).map(x => ({ d: x.date, s: x })).concat(fill.map(d => ({ d }))).sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
  const cells = items.map(it => {
    const dd = parseYmd(it.d);
    if (it.s) {
      const nb = doneBlocks(it.s).length, live = it.s.status !== 'done';
      return `<div class="wday ${live ? 'live' : 'done'}"><b>${WD[dd.getDay()]} ${dd.getDate()}</b><span>${live ? 'bezig · ' : '✓ '}${nb} ${nb === 1 ? 'blok' : 'blokken'}</span></div>`;
    }
    const missed = !pre && it.d < today;
    return `<div class="wday${it.d === next ? ' next' : ''}"><b>${WD[dd.getDay()]} ${dd.getDate()}</b><span>${missed ? 'gemist' : it.d === next ? 'volgende' : 'gepland'}</span></div>`;
  }).join('');

  const tplSel = p.mode === 'abc'
    ? `<div class="tabsel" role="group" aria-label="Kies training">${['A', 'B', 'C'].map(t => `<button data-act="pickTpl" data-tpl="${t}" aria-pressed="${t === tpl}">${t}</button>`).join('')}</div>`
    : '';
  const blocks = SLOT_ORDER.map(slot => blockPlanRow(p, slot, plan[slot], isToday && !pre, draftId)).join('');

  const resume = draft ? `
    <div class="card" style="border-color:var(--push)">
      <div class="row"><span class="pill live">Bezig</span><span class="small grow">Training van ${esc(fmtShort(draft.session.date))}, ${draft.phase === 'finish' ? 'klaar om op te slaan' : `blok ${Math.min(3, (draft.idx | 0) + 1)} van 3`}</span></div>
      <div class="row wrap"><button class="btn primary" data-act="resume">Ga verder</button><button class="btn ghost" data-act="discardDraft">${UI.confirm === 'discardDraft' ? 'Zeker? Tik nogmaals' : 'Weggooien'}</button></div>
    </div>` : '';

  const cw = cycleWeek(wkDay, start);
  const cn = cycleWeek(pre ? start : next, start);
  const cycleNote = pre || (cn.round === 1 && cn.w === 1)
    ? 'Week 1 is je basismeting: noteer alles, volgende week ga je het verbeteren.'
    : `Ronde ${cn.round}, week ${cn.w} van ${CYCLE_WEEKS}: zelfde oefeningen, meer herhalingen.`;
  const review = !pre && ((cw.w === CYCLE_WEEKS && wk.length >= 3) || (cw.w === 1 && cw.round > 1 && wk.length === 0)) ? `
    <div class="card">
      <div class="eyebrow">${CYCLE_WEEKS} weken erop</div>
      <p class="small">Tijd om je schema te evalueren. Houd wat werkt, of wissel een paar oefeningen. Een nieuwe oefening begint met een nieuwe basismeting.</p>
      <button class="btn ghost" data-act="tab" data-tab="plan" style="justify-self:start">Schema aanpassen</button>
    </div>` : '';

  const last = trainings(S.uid).filter(x => x.id !== draftId).slice(-1)[0];
  const lastCard = last ? `
    <div class="card">
      <div class="row"><div class="eyebrow grow">Laatste training · ${esc(fmtShort(last.date))}</div><button class="btn link" data-act="tab" data-tab="progress">Alles bekijken</button></div>
      ${sessionSummaryRows(last)}
    </div>` : '';

  return `
    ${resume}
    <div class="stack" style="gap:8px">${head}</div>
    <div class="week">${cells}</div>
    ${review}
    <div class="card">
      <div class="row"><div class="grow"><div class="eyebrow">${p.mode === 'abc' ? 'Training ' + tpl : 'Jouw training'}${!isToday && !pre ? ' · ' + esc(fmtShort(next)) : ''}</div><div class="small">${esc(cycleNote)}</div></div>${tplSel}</div>
      <div class="blocks">${blocks}</div>
      <button class="btn big primary" data-act="startSession" data-tpl="${tpl}" ${draft ? 'disabled' : ''}>${pre ? 'Proeftraining starten' : 'Start training'}</button>
      ${pre ? `<p class="tiny" style="text-align:center">Trainingen vóór ${esc(fmtLong(start))} tellen als proef en worden niet je basismeting.</p>` : ''}
      <button class="btn link" data-act="manual" style="justify-self:center">Training achteraf invoeren</button>
    </div>
    ${lastCard}
    <div class="card method">
      <div class="eyebrow">Zo werkt een blok</div>
      <ol class="small">
        <li>Warm op met een paar lichte sets en start dan de klok: 10 minuten voor deze ene oefening.</li>
        <li>Doe een set met nette herhalingen en stop voordat je techniek inzakt. Tik het aantal in.</li>
        <li>Rust zo lang als nodig en ga weer. Je sets worden vanzelf kleiner, dat hoort zo.</li>
        <li>Na 10 minuten staat je totaal. Volgende keer versla je het: meer herhalingen, of evenveel met iets meer gewicht.</li>
      </ol>
    </div>`;
}

function blockPlanRow(p, slot, key, today, excludeId) {
  const info = exInfo(key, p);
  const pk = plannedKg(p, key);
  const adv = advice(history(S.uid, key).filter(h => h.sid !== excludeId), info);
  let tip;
  if (adv.first) {
    tip = `<div class="tipline">Basismeting: kies een gewicht dat je uitgerust 5 à 10 keer netjes kunt tillen.</div>`;
  } else {
    const l = adv.last;
    tip = `<div class="tipline"><span>Vorige keer (${esc(fmtDM(l.date))}): <b>${l.total}\u00a0herh.</b> · ${esc(blockKgLabel(l, info))}${scored(l) ? ` · score ${fmtNum(Math.round(blockVolume(l)))}\u00a0kg` : ''}</span></div>
      <div class="tipline"><span>${today ? 'Doel vandaag' : 'Doel'}: ${targetText(adv, pk.kg)}</span></div>`;
    if (adv.up != null && Number(pk.kg) < adv.up) {
      tip += `<div class="up"><span class="grow">Tip: ${esc(adv.why)} Probeer ${esc(kgLabel(adv.up, info))}.</span><button class="btn sm" data-act="applyUp" data-ex="${esc(key)}" data-kg="${adv.up}">Overnemen</button></div>`;
    }
  }
  return `
    <div class="blk ${slot}">
      <div class="bar"></div>
      <div class="blk-main">
        <div class="row"><span class="chip ${slot}">${SLOT[slot].label}</span></div>
        <div class="blk-name">${esc(info.n)}</div>
        <div class="row wrap">
          <div class="stepper" role="group" aria-label="Gewicht ${esc(info.n)}">
            <button data-act="kg" data-ex="${esc(key)}" data-dir="-1" aria-label="Lichter">−</button>
            <span class="val${pk.suggested ? ' tbd' : ''}">${esc(kgLabel(pk.kg, info))}</span>
            <button data-act="kg" data-ex="${esc(key)}" data-dir="1" aria-label="Zwaarder">+</button>
          </div>
          ${pk.suggested ? '<span class="tiny">startvoorstel, pas aan</span>' : ''}
        </div>
        ${tip}
        ${info.tip ? `<div class="tiny">${esc(info.tip)}</div>` : ''}
      </div>
    </div>`;
}

function sessionSummaryRows(s) {
  const p = myProfile();
  return `<div>${(s.blocks || []).map(b => {
    const info = exInfo(b.ex, p);
    const ok = b.done && !b.skipped;
    const sub = ok ? `${blockKgLabel(b, info)}${scored(b) ? ` · score ${fmtNum(Math.round(blockVolume(b)))}\u00a0kg` : ''}${b.cut ? ' · ingekort' : ''}` : b.skipped || s.status === 'done' ? 'overgeslagen' : 'nog te doen';
    return `<div class="sum-row ${b.slot}"><span class="bar"></span><span class="grow"><b>${esc(b.name || info.n)}</b><br><span class="tiny">${esc(sub)}</span></span><span class="num" style="font-weight:700">${ok ? b.total + '\u00a0herh.' : '–'}</span></div>`;
  }).join('')}</div>`;
}

/* ---------- Progress tab ---------- */
function viewProgress() {
  if (!S.loaded && !myProfile()) return SKELETON;
  const ids = [...S.members.keys()].filter(id => S.members.get(id)?.profile || id === S.uid);
  const pid = UI.person && S.members.has(UI.person) ? UI.person : S.uid;
  const isMe = pid === S.uid;
  const prof = S.members.get(pid)?.profile || myProfile();
  const ts = trainings(pid);
  const listed = sessionsOf(pid).filter(countsAsTraining);
  const who = ids.length > 1 ? `<div class="tabsel scroll" role="group" aria-label="Wiens voortgang">${ids.map(id => `<button data-act="person" data-id="${esc(id)}" aria-pressed="${id === pid}">${esc(id === S.uid ? 'Ik' : displayName(id))}</button>`).join('')}</div>` : '';
  const metricSel = `<div class="tabsel" role="group" aria-label="Wat tonen"><button data-act="metric" data-m="reps" aria-pressed="${prefs.metric !== 'vol'}">Herhalingen</button><button data-act="metric" data-m="vol" aria-pressed="${prefs.metric === 'vol'}">Score (kg)</button></div>`;
  const histCard = listed.length ? `<div class="card"><div class="eyebrow">Geschiedenis</div><div class="hist">${listed.slice().reverse().map(s => historyItem(s, pid)).join('')}</div></div>` : '';

  if (!ts.length) {
    const exInfoDemo = exInfo('db-bankdrukken', null);
    return `
      ${who}
      <div class="stack" style="gap:6px"><div class="eyebrow">Voortgang</div><h1 class="h-display">${isMe ? 'Hier zie je straks hoe je sterker wordt' : esc(displayName(pid)) + ' heeft nog niet getraind'}</h1></div>
      <div class="card">
        <div class="ex-card-head"><div class="grow"><span class="chip push" style="justify-self:start">Push</span><b>Dumbbell bankdrukken</b><span class="tiny">herhalingen per blok van 10 minuten</span></div><span class="pill">Voorbeeld</span></div>
        <div class="faded">${chartSvg('example', [38, 42, 45, 47, 41, 44, 48].map((y, i) => ({ y, kg: i < 4 ? 28 : 32, reps: y, date: addDays(START, i * 7) })), 'var(--push)', 'reps', true, exInfoDemo)}</div>
        <p class="small">${isMe ? 'Na je eerste training verschijnt hier per oefening een grafiek van je herhalingen, met elke gewichtsverhoging erbij.' : 'Zodra ' + esc(displayName(pid)) + ' een training opslaat, verschijnt die hier.'}</p>
      </div>
      ${histCard}`;
  }

  const today = todayYmd();
  const thisWeek = weekSessions(pid, today).length;
  const vol = ts.reduce((a, s) => a + doneBlocks(s).reduce((x, b) => x + blockVolume(b), 0), 0);
  const tiles = `
    <div class="tiles">
      <div class="tile"><span class="lbl">Trainingen</span><span class="val">${ts.length}</span></div>
      <div class="tile"><span class="lbl">Deze week</span><span class="val">${thisWeek}<small>/3</small></span></div>
      <div class="tile"><span class="lbl">Weken op rij</span><span class="val">${streakWeeks(pid)}</span></div>
      <div class="tile"><span class="lbl">Totale score</span><span class="val">${vol >= 10000 ? fmtNum(Math.round(vol / 100) / 10) + '<small> ton</small>' : fmtNum(Math.round(vol)) + '<small> kg</small>'}</span></div>
    </div>`;

  const keys = [];
  for (const s of ts) for (const b of doneBlocks(s)) if (!keys.some(k => k.ex === b.ex)) keys.push({ ex: b.ex, slot: b.slot, name: b.name });
  keys.sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
  const charts = keys.map(k => {
    const info = exInfo(k.ex, prof);
    const h = history(pid, k.ex);
    const metric = prefs.metric === 'vol' && h.some(scored) ? 'vol' : 'reps';
    const pts = h.map(b => ({ y: metric === 'vol' ? Math.round(blockVolume(b)) : b.total, reps: b.total, kg: b.kg, vol: Math.round(blockVolume(b)), date: b.date, bw: !!b.bw, cut: !!b.cut }));
    const first = h[0], last = h[h.length - 1];
    const rec = h.length > 1 && recordKind(last, h.slice(0, -1));
    const line = h.length > 1
      ? `Begin: ${first.total}\u00a0herh. · ${esc(blockKgLabel(first, info))} &nbsp;→&nbsp; nu: <b>${last.total}\u00a0herh.</b> · ${esc(blockKgLabel(last, info))}${last.cut ? ' · ingekort' : ''}`
      : `Basismeting: <b>${first.total}\u00a0herh.</b> · ${esc(blockKgLabel(first, info))}`;
    const color = k.slot === 'legs' ? 'var(--legs-mark)' : `var(--${k.slot})`;
    return `
      <div class="card">
        <div class="ex-card-head">
          <div class="grow"><span class="chip ${k.slot}" style="justify-self:start">${SLOT[k.slot].label}</span><b style="font-size:18px">${esc(exName(k.ex, prof, k.name))}</b>
            <span class="small">${line}</span></div>
          ${rec ? '<span class="pill good">record</span>' : ''}
        </div>
        ${h.length > 1 ? chartSvg('c-' + k.ex, pts, color, metric, false, info) : '<span class="tiny">De grafiek verschijnt zodra je deze oefening twee keer hebt gedaan.</span>'}
        ${metric === 'reps' && prefs.metric === 'vol' ? '<span class="tiny">Lichaamsgewicht-oefening: hier tellen de herhalingen.</span>' : ''}
      </div>`;
  }).join('');

  const start = prof?.start || START;
  const curW = Math.max(1, weekNo(today, start));
  const weeks = [];
  for (let w = Math.max(1, curW - 9); w <= curW; w++) weeks.push(w);
  const adh = weeks.reverse().map(w => {
    const monW = addDays(mondayOf(start), (w - 1) * 7);
    const n = ts.filter(s => mondayOf(s.date) === monW).length;
    const cur = w === curW;
    const cells = [0, 1, 2].map(i => `<i class="${i < n ? 'on' : cur ? 'cur' : ''}"></i>`).join('');
    return `<div class="adh-row"><span class="lbl">Wk ${w}</span><span class="adh-cells">${cells}</span><span class="tiny num">${n}/3${n > 3 ? ' +' + (n - 3) : ''}</span></div>`;
  }).join('');

  return `
    ${who}
    ${isMe ? '' : `<div class="eyebrow">Voortgang van ${esc(displayName(pid))}</div>`}
    ${tiles}
    <div class="card"><div class="row"><div class="eyebrow grow">Trainingen per week</div><span class="tiny">doel: 3</span></div><div class="adh">${adh}</div></div>
    <div class="row wrap"><div class="eyebrow grow">Per oefening</div>${metricSel}</div>
    ${charts}
    ${histCard}`;
}

function historyItem(s, pid) {
  const isMe = pid === S.uid;
  const prof = S.members.get(pid)?.profile;
  const total = doneBlocks(s).reduce((a, b) => a + b.total, 0);
  const trial = isTrial(s, pid);
  const lines = (s.blocks || []).map(b => {
    const info = exInfo(b.ex, prof);
    const ok = b.done && !b.skipped;
    const sets = setsText(b, info);
    return `<div class="line"><span class="chip ${b.slot}">${SLOT[b.slot].label}</span><span>${esc(b.name || info.n)} <span class="tiny">${esc(blockKgLabel(b, info))}${b.cut ? ' · ingekort' : ''}</span></span><b class="num">${ok ? b.total + '\u00a0herh.' : '–'}</b>${ok && sets ? `<span class="sets">sets: ${esc(sets)}${scored(b) ? ` · score ${fmtNum(Math.round(blockVolume(b)))}\u00a0kg` : ''}</span>` : ''}</div>`;
  }).join('');
  const feel = s.feel ? `<span class="pill">voelde ${esc((FEEL[s.feel - 1] || '').toLowerCase())}</span>` : '';
  const note = s.note ? `<p class="small">${esc(s.note)}</p>` : '';
  const status = trial ? '<span class="pill">proef</span>' : s.status !== 'done' ? '<span class="pill warn">niet afgerond</span>' : '';
  const actions = isMe ? `<div class="row wrap"><button class="btn sm ghost" data-act="edit" data-id="${esc(s.id)}">Bewerken</button>${s.status !== 'done' ? `<button class="btn sm ghost" data-act="finishOld" data-id="${esc(s.id)}">Markeer als klaar</button>` : ''}<button class="btn sm danger" data-act="del" data-id="${esc(s.id)}">${UI.confirm === 'del:' + s.id ? 'Zeker? Tik nogmaals' : 'Verwijderen'}</button></div>` : '';
  const wn = weekNo(s.date, prof?.start || START);
  return `<details data-hist="${esc(s.id)}"${UI.histOpen.has(s.id) ? ' open' : ''}><summary><span class="grow"><b>${esc(cap(fmtShort(s.date)))}</b> <span class="tiny">${trial ? '' : 'wk ' + wn}${s.tpl && prof?.mode === 'abc' ? ' · ' + esc(s.tpl) : ''}</span></span>${status}${feel}<span class="num" style="font-weight:700">${total}\u00a0herh.</span><span class="chev" aria-hidden="true">›</span></summary><div class="body">${lines}${note}${actions}</div></details>`;
}

/* Line chart with a crosshair tooltip (mouse, touch and arrow keys). */
const CHARTS = {};
const CHART_SEL = {};
function niceScale(min, max, n) {
  if (min === max) { min = Math.max(0, min - 5); max = max + 5; }
  const raw = (max - min) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  let step = Math.max(1, (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag);
  if (!Number.isFinite(step) || min + step === min) step = Math.max(1, (max - min) / n || 1);
  return [Math.max(0, Math.floor(min / step) * step), Math.ceil(max / step) * step, step];
}
function chartSvg(id, pts, color, metric, isExample, info) {
  const W = 340, H = 172, L = 42, R = 16, T = 26, B = 26;
  CHARTS[id] = { pts, metric, W, info: info || {} };
  if (!pts.length) return '';
  const ys = pts.map(p => p.y);
  const [lo, hi, step] = niceScale(Math.min(...ys), Math.max(...ys), 4);
  const x = i => pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / ((hi - lo) || 1));
  CHARTS[id].xs = pts.map((p, i) => x(i));
  CHARTS[id].ys = pts.map(p => y(p.y));
  let grid = '';
 for (let i = 0, nT = Math.min(12, Math.round((hi - lo) / step)); i <= nT; i++) {
    const v = lo + i * step;
    grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" style="font-variant-numeric:tabular-nums">${fmtNum(v)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const area = pts.length > 1 ? `${line}L${x(pts.length - 1).toFixed(1)},${y(lo).toFixed(1)}L${x(0).toFixed(1)},${y(lo).toFixed(1)}Z` : '';
  // Weight labels where the weight changed; placed right to left so the current weight always shows.
  let kgl = '', placedX = Infinity, placedTxt = null;
  const changes = pts.map((p, i) => i).filter(i => (i === 0 || pts[i].kg !== pts[i - 1].kg) && !(i === 0 && pts[i].bw && pts[i].kg === 0));
  for (let j = changes.length - 1; j >= 0; j--) {
    const i = changes[j];
    kgl += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${T - 6}" y2="${(H - B).toFixed(1)}" class="grid"/>`;
    const lx = Math.min(Math.max(x(i), L + 22), W - R - 22);
    const txt = kgShort(pts[i].kg, info || {});
    if (placedX - lx < 46 || txt === placedTxt) continue;
    placedX = lx; placedTxt = txt;
    kgl += `<text x="${lx.toFixed(1)}" y="${T - 12}" text-anchor="middle">${esc(txt)} kg</text>`;
  }
  const lastI = pts.length - 1;
  const xl = `<text x="${x(0).toFixed(1)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${esc(fmtDM(pts[0].date))}</text>` +
    (pts.length > 1 ? `<text x="${x(lastI).toFixed(1)}" y="${H - 6}" text-anchor="end">${esc(fmtDM(pts[lastI].date))}</text>` : '');
  const ly = y(pts[lastI].y);
  const endY = ly - 10 < T + 2 ? ly + 18 : ly - 10;
  const endLabel = `<text x="${Math.min(x(lastI) - (pts.length === 1 ? 0 : 8), W - R).toFixed(1)}" y="${endY.toFixed(1)}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}" paint-order="stroke" stroke="var(--surface)" stroke-width="3" stroke-linejoin="round" style="fill:var(--ink);font-weight:700;font-size:12px">${fmtNum(pts[lastI].y)}</text>`;
  const label = metric === 'vol' ? 'score in kg per blok' : 'herhalingen per blok';
  return `<div class="chart-wrap" data-chart="${esc(id)}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}, ${pts.length} trainingen" ${isExample ? '' : 'tabindex="0"'}>
      ${grid}${kgl}
      ${area ? `<path d="${area}" fill="${color}" fill-opacity=".1" stroke="none"/>` : ''}
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.length <= 24 ? pts.map((p, i) => i === lastI ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="${p.cut ? 3.5 : 2.5}" fill="${p.cut ? 'var(--surface)' : color}" stroke="${color}" stroke-width="${p.cut ? 1.5 : 0}"/>`).join('') : ''}
      <circle cx="${x(lastI).toFixed(1)}" cy="${ly.toFixed(1)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
      ${endLabel}${xl}
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
      <circle class="xh-dot" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    </svg>
    <div class="tip" hidden></div>
  </div>`;
}
function bindCharts(root) {
  root.querySelectorAll('[data-chart]').forEach(wrap => {
    const id = wrap.dataset.chart;
    const c = CHARTS[id];
    if (!c || id === 'example') return;
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
    const xh = svg.querySelector('.xh'), dot = svg.querySelector('.xh-dot');
    let cur = -1;
    const show = i => {
      if (i < 0 || i >= c.pts.length) return;
      cur = i; CHART_SEL[id] = i;
      const p = c.pts[i];
      xh.setAttribute('x1', c.xs[i]); xh.setAttribute('x2', c.xs[i]); xh.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', c.xs[i]); dot.setAttribute('cy', c.ys[i]); dot.setAttribute('visibility', 'visible');
      const kg = kgLabel(p.kg, c.info);
      const main = c.metric === 'vol' ? `score ${fmtNum(p.y)} kg` : `${p.reps} herhalingen`;
      const sub = c.metric === 'vol' ? `${p.reps} herh. · ${kg}` : kg + (p.vol ? ` · score ${fmtNum(p.vol)} kg` : '');
      tip.innerHTML = `<strong>${esc(main)}</strong>${esc(sub)}<br>${esc(cap(fmtShort(p.date)))}${p.cut ? ' · ingekort' : ''}`;
      tip.hidden = false;
      const w = wrap.clientWidth, tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(c.xs[i] / c.W * w, tw / 2 + 2), w - tw / 2 - 2) + 'px';
      tip.style.top = '-6px';
      tip.style.transform = 'translate(-50%, -100%)';
    };
    const hide = () => { cur = -1; tip.hidden = true; xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
    const nearest = ev => {
      const r = svg.getBoundingClientRect();
      const vx = (ev.clientX - r.left) / r.width * c.W;
      let best = 0, bd = Infinity;
      c.xs.forEach((xv, i) => { const d = Math.abs(xv - vx); if (d < bd) { bd = d; best = i; } });
      return best;
    };
    svg.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse' || ev.buttons) show(nearest(ev)); });
    svg.addEventListener('pointerdown', ev => show(nearest(ev)));
    svg.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') hide(); });
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowLeft') { show(Math.max(0, (cur < 0 ? c.pts.length : cur) - 1)); ev.preventDefault(); }
      if (ev.key === 'ArrowRight') { show(Math.min(c.pts.length - 1, cur + 1)); ev.preventDefault(); }
      if (ev.key === 'Escape') { hide(); delete CHART_SEL[id]; }
    });
    svg.addEventListener('focus', () => { if (svg.matches(':focus-visible') && cur < 0) show(CHART_SEL[id] ?? c.pts.length - 1); });
  });
}
