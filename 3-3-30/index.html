<title>3-3-30 Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
/* Layout: phone-first single column (max 560px). Large condensed titles, a frosted bottom tab bar,
   bottom sheets for editing, and a full-screen workout mode that fits one screen.
   Direction "Platform": chalk (light) and rubber floor (dark); the only saturated colours are the
   bumper plates (red = push, blue = pull, yellow = legs, green = success) and the red LED clock.
   Archivo condensed for titles and numbers, Archivo expanded for stamped labels, Instrument Sans for text. */
:root {
  --bg: #F3F1EC;
  --surface: #FFFFFF;
  --surface-2: #E9E6DF;
  --surface-3: #DCD8CF;
  --ink: #16181B;
  --ink-2: #4A4E55;
  --muted: #5E626A;
  --line: #DAD6CD;
  --push: #CC2D27;
  --pull: #1E58C8;
  --legs: #F2B807;
  --legs-mark: #8F6600;
  --on-push: #FFFFFF;
  --on-pull: #FFFFFF;
  --on-legs: #1F1700;
  --good: #177A41;
  --good-wash: #E1F2E7;
  --on-good: #FFFFFF;
  --warn: #8F5400;
  --warn-wash: #F6E8CF;
  --bad: #B3261E;
  --primary: #16181B;
  --on-primary: #F3F1EC;
  --seg-on: #FFFFFF;
  --shadow: inset 0 1px 0 rgb(255 255 255 / .8), 0 1px 2px rgb(40 30 10 / .06), 0 10px 24px -14px rgb(40 30 10 / .22);
  --clock-bg: #0D0E10;
  --clock-edge: #2A2E33;
  --led-on: #FF3D2E;
  --led-off: #24100E;
  --led-lead: #FFB020;
  --display: "Archivo", "Archivo Narrow", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 18px;
  --r: 14px;
  --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #1B1E22; --surface-2: #25292E; --surface-3: #30353C; --ink: #ECEAE4; --ink-2: #B9B6AE;
    --muted: #918E87; --line: #30353C; --push: #FF5A47; --pull: #5B8DF0; --legs: #F5C531; --legs-mark: #C99A12;
    --on-push: #1A0705; --on-pull: #0A1020; --on-legs: #1F1700; --good: #45C07A; --good-wash: #16301F; --on-good: #08140D;
    --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C; --primary: #ECEAE4; --on-primary: #121417; --seg-on: #3A3F47;
    --shadow: inset 0 1px 0 rgb(255 255 255 / .05); --clock-bg: #08090A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1B1E22; --surface-2: #25292E; --surface-3: #30353C; --ink: #ECEAE4; --ink-2: #B9B6AE;
  --muted: #918E87; --line: #30353C; --push: #FF5A47; --pull: #5B8DF0; --legs: #F5C531; --legs-mark: #C99A12;
  --on-push: #1A0705; --on-pull: #0A1020; --on-legs: #1F1700; --good: #45C07A; --good-wash: #16301F; --on-good: #08140D;
  --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C; --primary: #ECEAE4; --on-primary: #121417; --seg-on: #3A3F47;
  --shadow: inset 0 1px 0 rgb(255 255 255 / .05); --clock-bg: #08090A; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--pull); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::placeholder { color: var(--muted); opacity: 1; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 10px;
  padding-block: 12px 8px; background: var(--bg); }
.brand { font-family: var(--display); font-stretch: 112%; font-weight: 900; font-size: 21px; letter-spacing: -.01em; line-height: 1; }
.brand i { font-style: normal; color: var(--push); }
.weekpill { font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.sync { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[hidden] + .avatar { margin-left: auto; }
.sync.on .dot { background: var(--good); }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-weight: 800; font-size: 14px;
  color: #fff; background: #48505A; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px);
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-top: 1px solid var(--line); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 9px 4px 11px; display: grid; justify-items: center; gap: 3px; color: var(--muted);
  font-size: 12px; font-weight: 700; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] .ti { background: var(--surface-2); }
.ti { width: 52px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .15s; }

/* Type */
.title { font-family: var(--display); font-stretch: 68%; font-weight: 800; font-size: clamp(36px, 10.5vw, 46px); line-height: .95; letter-spacing: -.01em; }
.h2 { font-family: var(--display); font-stretch: 72%; font-weight: 800; font-size: 24px; line-height: 1.05; }
.eyebrow { font-family: var(--display); font-stretch: 125%; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--ink-2); font-size: 17px; }
.small { font-size: 14px; color: var(--ink-2); }
.tiny { font-size: 12.5px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.title, .h2, .run-name, .ex-n, .mem-n, .hist .line > span, .note-text { overflow-wrap: anywhere; hyphens: auto; }

/* Building blocks */
.stack { display: grid; gap: 14px; }
.head { display: grid; gap: 6px; padding-block: 6px 4px; }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card > * { min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }
.notice { border-radius: var(--r); padding: 12px 14px; background: var(--warn-wash); color: var(--ink); font-size: 14px; display: grid; gap: 6px; margin-bottom: 12px; }

.btn { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 750; font-size: 16px; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; min-height: 48px; background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.xl { min-height: 56px; font-size: 18px; width: 100%; font-family: var(--display); font-stretch: 100%; font-weight: 800; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: transparent; box-shadow: inset 0 0 0 1.5px var(--bad); color: var(--bad); }
.btn.good { background: var(--good); color: var(--on-good); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 14px; }
.btn.link { background: none; padding: 8px 4px; min-height: 40px; color: var(--ink-2); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.iconbtn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 22px; height: 22px; }

.chip { display: inline-flex; align-items: center; border-radius: 6px; padding: 3px 8px; font-family: var(--display); font-stretch: 125%; font-size: 10.5px; font-weight: 800;
  letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; line-height: 1.35; }
.chip.push { background: var(--push); color: var(--on-push); }
.chip.pull { background: var(--pull); color: var(--on-pull); }
.chip.legs { background: var(--legs); color: var(--on-legs); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 650;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-wash); color: var(--good); }
.pill.warn { background: var(--warn-wash); color: var(--warn); }
.pill.live { background: var(--push); color: var(--on-push); }

/* Weight plate glyph: a disc with a hub, in the slot's colour */
.plate { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; position: relative; }
.plate::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 3px rgb(0 0 0 / .12); }
.plate.push { background: var(--push); } .plate.pull { background: var(--pull); } .plate.legs { background: var(--legs); }
.plate.sm { width: 28px; height: 28px; } .plate.sm::after { width: 8px; height: 8px; box-shadow: 0 0 0 2px rgb(0 0 0 / .12); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; max-width: 100%; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; min-height: 36px; font-weight: 750; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.seg.scroll { flex-wrap: nowrap; overflow-x: auto; justify-self: start; }
.seg.full { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.seg.scroll button { flex: none; white-space: nowrap; }

/* Today: week dots */
.week { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wday { border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.wday b { font-family: var(--display); font-stretch: 80%; font-size: 18px; font-weight: 800; line-height: 1.1; }
.wday span { font-size: 12.5px; color: var(--muted); font-weight: 650; }
.wday.done { background: var(--good-wash); box-shadow: none; }
.wday.done span { color: var(--good); }
.wday.next { box-shadow: inset 0 0 0 2px var(--ink); }
.wday.live { box-shadow: inset 0 0 0 2px var(--push); }
.wday.missed { opacity: .6; }
.wday.na { opacity: .55; }
.bar-card .week { gap: 6px; }
.bar-card .wday { background: var(--surface-2); box-shadow: none; padding: 8px 10px; }
.bar-card .wday.done { background: var(--good-wash); }
.bar-card .wday.next { box-shadow: inset 0 0 0 2px var(--ink); background: transparent; }
.bar-card .wday.live { box-shadow: inset 0 0 0 2px var(--push); background: transparent; }

/* Exercise rows */
.ex-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ex-row { width: 100%; border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 12px; padding: 10px 6px; border-radius: var(--r); }
.ex-row:hover { background: var(--surface-2); }
.ex-main { display: grid; gap: 1px; min-width: 0; }
.ex-n { font-family: var(--display); font-stretch: 75%; font-weight: 750; font-size: 19px; line-height: 1.1; }
.ex-sub { font-size: 13.5px; color: var(--muted); }
.ex-sub b { color: var(--ink-2); }
.ex-kg { font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chev { color: var(--muted); }
.up { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; background: var(--good-wash); color: var(--good); border-radius: var(--r);
  padding: 10px 12px; font-size: 14px; font-weight: 650; }

/* Stats */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile .lbl { font-size: 13px; color: var(--muted); font-weight: 650; }
.tile .val { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 32px; line-height: 1.05; }
.tile .val small { font-family: var(--body); font-stretch: 100%; font-size: 14px; font-weight: 650; color: var(--muted); }

/* Charts */
.chart-wrap { position: relative; }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart:focus:not(:focus-visible) { outline: none; }
.chart text { font-family: var(--body); fill: var(--muted); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .xh { stroke: var(--ink-2); stroke-width: 1; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 6px 10px;
  font-size: 12px; line-height: 1.35; white-space: nowrap; box-shadow: 0 6px 18px rgb(0 0 0 / .2); }
.tip strong { font-size: 15px; display: block; }
.ex-card-head { display: flex; align-items: flex-start; gap: 12px; }
.ex-card-head .grow { display: grid; gap: 2px; }
.delta { font-weight: 800; font-size: 14px; white-space: nowrap; }
.delta.pos { color: var(--good); }
.delta.neg { color: var(--bad); }
.faded { opacity: .45; }

.adh { display: grid; gap: 6px; }
.adh-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.adh-row .lbl { color: var(--muted); font-weight: 650; font-variant-numeric: tabular-nums; }
.adh-cells { display: flex; gap: 5px; }
.adh-cells i { width: 28px; height: 18px; border-radius: 6px; background: var(--surface-2); display: block; }
.adh-cells i.on { background: var(--good); }
.adh-cells i.cur { box-shadow: inset 0 0 0 1.5px var(--line); background: transparent; }

/* History */
.hist { display: grid; }
.hist details { border-top: 1px solid var(--line); }
.hist details:first-child { border-top: 0; }
.hist summary { list-style: none; cursor: pointer; padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.hist summary .grow { flex: 1 1 8em; }
.hist summary::-webkit-details-marker { display: none; }
.hist summary .chev { transition: transform .15s; }
.hist details[open] summary .chev { transform: rotate(90deg); }
.hist .body { padding: 0 0 14px; display: grid; gap: 10px; }
.hist .line { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; font-size: 14px; }
.scores { display: inline-flex; gap: 4px; }
.scores .sc { min-width: 34px; text-align: center; border-radius: 7px; padding: 2px 6px; font-weight: 800; font-size: 13.5px; background: var(--surface-2); }
.scores .sc.push { background: color-mix(in srgb, var(--push) 18%, var(--surface)); }
.scores .sc.pull { background: color-mix(in srgb, var(--pull) 18%, var(--surface)); }
.scores .sc.legs { background: color-mix(in srgb, var(--legs) 30%, var(--surface)); }
.hist .sets { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; grid-column: 2 / 4; }

/* Crew */
.member { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 12px; border-top: 1px solid var(--line); }
.member:first-child { border-top: 0; padding-top: 0; }
.mem-n { font-weight: 750; }
.mdots { display: inline-flex; gap: 4px; }
.mdots i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); display: block; }
.mdots i.on { background: var(--good); box-shadow: none; }

/* Forms */
.f { display: grid; gap: 6px; font-size: 14px; font-weight: 650; color: var(--ink-2); min-width: 0; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; border: 0; box-shadow: inset 0 0 0 1.5px var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 11px 13px; min-height: 48px; font-size: 16px; }
input:focus, select:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--pull); }
input, select, textarea { font-weight: 500; }
textarea { min-height: 76px; resize: vertical; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices button { border: 0; border-radius: 999px; padding: 8px 13px; min-height: 40px; font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--ink-2); }
.choices button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.choices button:disabled { opacity: .5; }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.daypick button { height: 44px; border-radius: var(--r-sm); border: 0; background: var(--surface-2); font-weight: 750; min-width: 0; }
.daypick button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); font-size: 22px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.stepper .val { min-width: 104px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; padding-inline: 6px; font-size: 16px; }
.toggle-row { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.toggle-row input { width: 22px; height: 22px; accent-color: var(--ink); }
details.how > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; font-weight: 750; }
details.how > summary::-webkit-details-marker { display: none; }
details.how[open] > summary .chev { transform: rotate(90deg); }
.how ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.how h3 { font-size: 15px; font-weight: 800; margin-top: 4px; }
.bignums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bignums div { display: grid; gap: 2px; }
.bignums b { font-family: var(--display); font-stretch: 100%; font-size: 60px; font-weight: 900; line-height: .9; }
.bignums div:nth-child(1) b { color: var(--push); }
.bignums div:nth-child(2) b { color: var(--pull); }
.bignums div:nth-child(3) b { color: var(--legs-mark); }
.bignums span { font-size: 13px; color: var(--ink-2); font-weight: 650; line-height: 1.25; }

/* Workout mode: one screen, rep pad in the thumb zone */
.runner { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.run { max-width: 560px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 8px 14px; display: flex; flex-direction: column; gap: 10px; }
.run-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps i { height: 6px; border-radius: 3px; background: var(--surface-3); display: block; }
.steps i.done.push, .steps i.cur.push { background: var(--push); }
.steps i.done.pull, .steps i.cur.pull { background: var(--pull); }
.steps i.done.legs, .steps i.cur.legs { background: var(--legs); }
.steps i.cur { opacity: .55; }
.run-ex { display: grid; gap: 6px; }
.run-name { font-family: var(--display); font-stretch: 68%; font-weight: 800; font-size: clamp(30px, 9.4vw, 40px); line-height: .95; }
.run-kg { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.clock { flex: 1 1 0; min-height: 100px; max-height: 210px; background: var(--clock-bg); border-radius: 22px; padding: 12px 14px 10px; box-shadow: inset 0 2px 6px rgb(0 0 0 / .6), 0 0 0 1px var(--clock-edge);
  display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; justify-items: center; color: #9AA3AD; }
.ledbox { width: 100%; height: 100%; min-height: 0; display: grid; place-items: center; }
.clock svg.led { width: auto; height: 100%; max-width: 100%; max-height: 132px; display: block; }
.led .seg { fill: var(--led-off); }
.led .seg.on { fill: var(--led-on); }
.led .on, .led .colon { filter: drop-shadow(0 0 5px rgb(255 61 46 / .5)); }
.led.amber .seg.on, .led.amber .colon { fill: var(--led-lead); filter: drop-shadow(0 0 5px rgb(255 176 32 / .5)); }

/* Best guess from a typed name; the user can change it. */
function guessEquip(name) {
  const n = String(name || '').toLowerCase();
  if (/\b(pull-?ups?|chin-?ups?|push-?ups?|dips?|inverted|bodyweight|muscle-?ups?|hanging)\b/.test(n)) return 'bw';
  if (/\b(cable|machine|pulldown|pull-down|leg press|hack squat|smith|pec deck|leg curl|leg extension|seated row|chest press)\b/.test(n)) return 'machine';

/* Other names people type for the same exercise (also the names of the earlier Dutch version). */
const ALIAS = {

  'trapbar': ['trap bar', 'trap bar deadlift', 'hex bar', 'hex bar deadlift'],
  'deadlift': ['conventional deadlift', 'barbell deadlift'],

  'bulgaarse': ['bss', 'bulgarian', 'split squat', 'bulgarian split squats', 'bulgaarse split squat'],
};
const DEFAULT_MODE = 'abc';
/* The article's example week (Mon/Wed/Fri). */
const DEFAULT_PLANS = {
  A: { push: 'db-bankdrukken', pull: 'borst-roeien', legs: 'goblet-squat' },
  B: { push: 'db-schouderdrukken', pull: 'optrekken', legs: 'db-rdl' },

const CYCLE_WEEKS = 4;

/* ------------------------------------------------------------------ *
 * Small helpers
 * ------------------------------------------------------------------ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const todayYmd = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const mondayOf = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const weekNo = (s, start) => Math.floor(daysBetween(mondayOf(start), mondayOf(s)) / 7) + 1;
const cycleWeek = (s, start) => { const n = Math.max(1, weekNo(s, start)); return { round: Math.ceil(n / CYCLE_WEEKS), w: ((n - 1) % CYCLE_WEEKS) + 1 }; };
const LOC = 'en-GB';
const fmtLong = s => parseYmd(s).toLocaleDateString(LOC, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => parseYmd(s).toLocaleDateString(LOC, { weekday: 'short', day: 'numeric', month: 'short' });
const fmtDM = s => parseYmd(s).toLocaleDateString(LOC, { day: 'numeric', month: 'short' });
const fmtNum = n => Number(n || 0).toLocaleString(LOC, { maximumFractionDigits: 1 });
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const uidGen = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'exercise';
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
};
const prefs = Object.assign({ sound: true, lead: true, metric: 'reps', tab: 'train' }, LS.get('d330.prefs', {}));
const savePrefs = () => LS.set('d330.prefs', prefs);

/* ------------------------------------------------------------------ *
 * Store: shared db (members/<uid> + members/<uid>/sessions/<id>) with a
 * localStorage fallback when the shared logbook is unavailable or read-only.
 * ------------------------------------------------------------------ */
const S = {
  mode: 'loading',          // 'shared' | 'local'
  ownLocal: false,          // own data lives in localStorage (no write access)
  uid: null, db: null, user: null,
  members: new Map(),       // uid -> { profile, sessions: Map }
  subs: new Map(),
  loaded: false,            // members list known (or gave up waiting)
  membersSeen: false,       // a members snapshot actually arrived
  migrating: false,         // moving device-only data into the shared logbook
  hidden: new Set(),        // sessions removed on this device while device-only
  dirty: new Set(),         // sessions changed on this device while device-only
  profileDirty: false,
  people: {},               // uid -> resolved Profile (name, avatarUrl, color)
  meInfo: null,
  notice: '',
};
const LKEY = () => 'd330.own.' + (S.uid || 'local');
const NOTICE_VIEWER = 'You can view this shared log, but not save to it. Your workouts are kept on this device and move to the shared log automatically once you get edit access.';
const NOTICE_DENIED = 'Saving to the shared log isn’t allowed with your access. Your workouts are kept on this device and move to the shared log automatically once you get edit access.';

/* Everything read from the shared store or a backup is other people's input:
   coerce it to the shapes the page expects before it is rendered. */
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const ID_RE = /^[A-Za-z0-9_.~:@+-]{1,80}$/;
const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, num(v)));
const validYmd = d => typeof d === 'string' && DATE_RE.test(d) && ymd(parseYmd(d)) === d && d >= '2020-01-01' && d <= '2099-12-31';
const str = (v, max) => (typeof v === 'string' ? v.slice(0, max) : '');
function normSession(s, id) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.blocks) || !validYmd(s.date)) return null;
  const sid = typeof id === 'string' ? id : str(s.id, 80);

      .map(x => ({ r: Math.round(clampN(x && x.r, 0, 200)), kg: clampN(x && x.kg != null ? x.kg : b.kg, -300, 1000), t: x && x.t != null ? Math.round(clampN(x.t, 0, BLOCK_SEC)) : null }))

    startedAt: num(s.startedAt), updatedAt: num(s.updatedAt), endedAt: num(s.endedAt),

function normProfile(p) {

  const custom = (Array.isArray(p.custom) ? p.custom : [])
    .filter(c => c && typeof c.k === 'string' && ID_RE.test(c.k) && !(c.k in Object.prototype) && Object.hasOwn(SLOT, c.s)).slice(0, 60)
    .map(c => ({ k: c.k, n: str(c.n, 40) || c.k, s: c.s, step: Number(c.step) > 0 ? clampN(c.step, 0.5, 50) : 2.5, start: clampN(c.start, -300, 1000), bw: !!c.bw, dbl: !!c.dbl,
      eq: Object.hasOwn(EQUIP, c.eq) ? c.eq : c.bw ? 'bw' : c.dbl ? 'dbpair' : 'barbell' }));

function member(id) {
  if (!S.members.has(id)) S.members.set(id, { profile: null, sessions: new Map() });
  return S.members.get(id);
}
const me = () => member(S.uid);
const myProfile = () => me().profile;

function readOwnLocal() {
  const raw = LS.get(LKEY(), null);
  if (!raw || typeof raw !== 'object') return null;
  const sessions = new Map();
  for (const [id, s] of Object.entries(raw.sessions || {})) { const n = normSession(s, id); if (n) sessions.set(id, n); }
  const ids = v => (Array.isArray(v) ? v.filter(x => typeof x === 'string' && ID_RE.test(x)) : []);
  return { profile: normProfile(raw.profile), sessions, hidden: ids(raw.hidden), dirty: ids(raw.dirty), profileDirty: !!raw.profileDirty };
}
function loadOwnLocal() {
  const raw = readOwnLocal();
  const m = me();
  if (raw) {
    m.profile = raw.profile || m.profile;
    m.sessions = raw.sessions;
    S.hidden = new Set(raw.hidden);
    S.dirty = new Set(raw.dirty);
    S.profileDirty = raw.profileDirty;
  }
}
/* After a direct write succeeds, an older pending device copy of that item must not
   overwrite it on a later visit. */
function dropPending(id) {
  if (S.ownLocal || S.migrating) return;
  const raw = LS.get(LKEY(), null);
  if (!raw || typeof raw !== 'object') return;
  if (id === null) { raw.profile = null; raw.profileDirty = false; }
  else {
    if (raw.sessions) delete raw.sessions[id];
    raw.dirty = (raw.dirty || []).filter(x => x !== id);
    raw.hidden = (raw.hidden || []).filter(x => x !== id);
  }
  LS.set(LKEY(), raw);
}
/* Device copy of the own logbook. `dirty`/`profileDirty` mark what changed here and
   must win over the shared copy once this viewer can write again. */
function saveOwnLocal() {
  const m = me();
  LS.set(LKEY(), { profile: m.profile, sessions: Object.fromEntries(m.sessions), hidden: [...S.hidden], dirty: [...S.dirty], profileDirty: !!S.profileDirty });
}

async function initStore() {
  let db = null, user = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (user) uid = await user.id();
    }
  } catch { db = null; }
  S.user = user;
  if (user) {
    try { S.meInfo = await user.me(); } catch { /* ignore */ }
  }
  if (db && uid && ID_RE.test(uid)) {
    S.mode = 'shared'; S.db = db; S.uid = uid;
    let canWrite = null;
    try { canWrite = await user.can('data.write'); } catch { canWrite = null; }
    member(uid);
    if (canWrite === false) useOwnLocal(NOTICE_VIEWER);
    else {
      const local = readOwnLocal();
      if (local && (local.profile || local.sessions.size || local.hidden.length)) migrateLocal(local);
    }
    subscribeMembers();
    subscribeSessions(uid);
    setTimeout(() => { if (!S.loaded) { S.loaded = true; scheduleRender(); } }, 7000);
  } else {
    S.mode = 'local'; S.uid = 'local'; S.ownLocal = true;
    loadOwnLocal();
    S.loaded = true; S.membersSeen = true;
  }
  scheduleRender();
}

/* Device-only data (from an earlier read-only visit or a failed write) moves into the
   shared logbook as soon as this viewer can write there. Each item leaves the device
   copy only after it is stored, so an interrupted move resumes next visit. */
async function migrateLocal(local) {
  S.migrating = true;
  const m = me();
  if (local.profile && !m.profile) m.profile = local.profile;
  for (const [id, sess] of local.sessions) if (!m.sessions.has(id)) m.sessions.set(id, sess);
  scheduleRender();
  const dirty = new Set(local.dirty);
  const persist = () => LS.set(LKEY(), { profile: local.profile, sessions: Object.fromEntries(local.sessions), hidden: [...local.hidden], dirty: [...dirty], profileDirty: !!local.profileDirty });
  let moved = 0;
  try {
    if (local.profile) {
      const own = await S.db.doc('members/' + S.uid).get();
      if (!own.exists || local.profileDirty) await dbWrite('members/' + S.uid, local.profile);
      local.profile = null; local.profileDirty = false; persist();
    }
    for (const sess of [...local.sessions.values()]) {
      const path = 'members/' + S.uid + '/sessions/' + sess.id;
      if (dirty.has(sess.id) || !(await S.db.doc(path).get()).exists) { await dbWrite(path, sess); moved++; }
      local.sessions.delete(sess.id); dirty.delete(sess.id); persist();
    }
    for (const id of [...local.hidden]) {
      await dbWrite('members/' + S.uid + '/sessions/' + id, null, true);
      local.hidden = local.hidden.filter(x => x !== id); persist();
    }
    LS.del(LKEY());
    if (moved) toast(`${moved === 1 ? '1 workout' : moved + ' workouts'} from this device moved to the shared log.`);
  } catch (e) {
    if (!handleWriteError(e, true)) toast('Not everything from this device reached the shared log yet. The app will retry next time.');
  }
  S.migrating = false;
  scheduleRender();
}

function useOwnLocal(reason) {
  const wasLocal = S.ownLocal;
  S.ownLocal = true;
  S.notice = reason || S.notice;
  const m = me();
  const keep = { profile: m.profile, sessions: new Map(m.sessions) };
  if (!wasLocal) { S.dirty = new Set(); loadOwnLocal(); }
  if (!m.profile) m.profile = keep.profile;
  for (const [id, s] of keep.sessions) if (!m.sessions.has(id) && !S.hidden.has(id)) m.sessions.set(id, s);
  saveOwnLocal();
  scheduleRender();
}

function subscribeMembers() {
  const unsub = S.db.collection('members').onSnapshot(snap => {
    const seen = new Set();
    for (const d of snap.docs) {
      if (!ID_RE.test(d.id)) continue;
      seen.add(d.id);
      const prof = normProfile(d.data());
      if (d.id === S.uid) {
        if (S.ownLocal) { if (!me().profile && prof) { me().profile = prof; saveOwnLocal(); } continue; }
        if (profileTimer || wq.has('members/' + S.uid)) continue;   // keep a pending local edit
        me().profile = prof;
        continue;
      }
      member(d.id).profile = prof;
      subscribeSessions(d.id);
    }
    for (const id of [...S.members.keys()]) {
      if (id !== S.uid && !seen.has(id)) {
        const u = S.subs.get('s:' + id); if (u) { try { u(); } catch { /* ignore */ } S.subs.delete('s:' + id); }
        S.members.delete(id);
      }
    }
    if (!snap.metadata.fromCache) { S.loaded = true; S.membersSeen = true; }
    resolvePeople();
    scheduleRender();
    maybeReopen();
  }, () => {
    S.notice = 'The shared log can’t be reached right now. Reload the page to try again.';
    S.loaded = true; scheduleRender();
  });
  S.subs.set('members', unsub);
}

function subscribeSessions(id) {
  const key = 's:' + id;
  if (S.subs.has(key)) return;
  const unsub = S.db.collection('members/' + id + '/sessions').onSnapshot(snap => {
    const m = member(id);
    if (id === S.uid && S.ownLocal) {
      // Read-only viewer: shared history is the base, local entries win.
      let changed = false;
      for (const d of snap.docs) {
        if (m.sessions.has(d.id) || S.hidden.has(d.id)) continue;
        const n = normSession(d.data(), d.id);
        if (n) { m.sessions.set(d.id, n); changed = true; }
      }
      if (changed) { saveOwnLocal(); scheduleRender(); }
      return;
    }
    const next = new Map();
    for (const d of snap.docs) { const n = normSession(d.data(), d.id); if (n) next.set(d.id, n); }
    m.sessions = next;
    if (id === S.uid && !S.ownSeen) { S.ownSeen = true; maybeReopen(); }
    scheduleRender();
  }, () => { S.subs.delete(key); });
  S.subs.set(key, unsub);
}

async function resolvePeople() {
  if (!S.user || S.mode !== 'shared') return;
  try {
    const ids = [...S.members.keys()];
    const ps = await S.user.profiles(ids);
    let changed = false;
    for (const id of ids) {
      const p = ps[id]; if (!p) continue;
      const prev = S.people[id];
      if (!prev || prev.name !== p.name || prev.avatarUrl !== p.avatarUrl) changed = true;
      S.people[id] = p;
    }
    if (changed) scheduleRender();
  } catch { /* ignore */ }
}

/* One write at a time per document. */
const wq = new Map();
function queueWrite(path, fn) {
  const prev = wq.get(path) || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);
  wq.set(path, p);
  p.finally(() => { if (wq.get(path) === p) wq.delete(path); }).catch(() => {});
  return p;
}
async function dbWrite(path, data, del) {
  return queueWrite(path, async () => {
    const ref = S.db.doc(path);
    try { del ? await ref.delete() : await ref.set(data); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(500 + Math.random() * 1000); del ? await ref.delete() : await ref.set(data); }
      else throw e;
    }
  });
}
/* Returns true when the app switched to device-only storage. */
function handleWriteError(e, quiet) {
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') { useOwnLocal(NOTICE_DENIED); return true; }
  if (quiet) return false;
  if (code === 'quota_exceeded') toast('The log is full. Export a backup and delete old workouts.');
  else toast('Couldn’t save. Your data is still on screen — try again in a moment.');
  return false;
}

async function saveProfile(p) {
  const clean = normProfile(p);
  me().profile = clean;
  scheduleRender();
  if (S.ownLocal) { S.profileDirty = true; saveOwnLocal(); return true; }
  try { await dbWrite('members/' + S.uid, clean); dropPending(null); return true; }
  catch (e) { if (handleWriteError(e)) { me().profile = clean; S.profileDirty = true; saveOwnLocal(); return true; } return false; }
}
let profileTimer = null;
function saveProfileSoon(p) {
  me().profile = normProfile(p);
  scheduleRender();
  clearTimeout(profileTimer);
  profileTimer = setTimeout(() => { profileTimer = null; saveProfile(me().profile); }, 700);
}
async function saveSession(s, opts = {}) {
  const clean = normSession(clone(s));
  if (!clean) return false;
  me().sessions.set(clean.id, clean);
  S.hidden.delete(clean.id);
  scheduleRender();
  if (S.ownLocal) { S.dirty.add(clean.id); saveOwnLocal(); return true; }
  try { await dbWrite('members/' + S.uid + '/sessions/' + clean.id, clean); dropPending(clean.id); return true; }
  catch (e) {
    if (handleWriteError(e, opts.quiet)) { me().sessions.set(clean.id, clean); S.dirty.add(clean.id); saveOwnLocal(); return true; }
    return false;
  }
}
async function deleteSession(id) {
  const prev = me().sessions.get(id);
  me().sessions.delete(id);
  scheduleRender();
  if (S.ownLocal) { S.hidden.add(id); S.dirty.delete(id); saveOwnLocal(); return true; }
  try { await dbWrite('members/' + S.uid + '/sessions/' + id, null, true); dropPending(id); return true; }
  catch (e) {
    if (handleWriteError(e)) { S.hidden.add(id); me().sessions.delete(id); saveOwnLocal(); return true; }
    if (prev) { me().sessions.set(id, prev); scheduleRender(); }
    return false;
  }
}

/* ------------------------------------------------------------------ *
 * Domain logic
 * ------------------------------------------------------------------ */
/* A late joiner starts this week, or next Monday when no training day is left this week. */
function lateStart(today, days = [1, 3, 5]) {
  if (today <= START) return START;
  const mon = mondayOf(today);
  return days.some(d => addDays(mon, (d + 6) % 7) >= today) ? mon : addDays(mon, 7);
}
function defaultProfile(nick, days = [1, 3, 5]) {
  const today = todayYmd();
  return { v: 1, nick: nick || '', joined: Date.now(), start: lateStart(today, days), days: days.slice(), mode: DEFAULT_MODE,
    plans: clone(DEFAULT_PLANS), custom: [], weights: {} };
}
function exInfo(key, profile) {
  return LIB.find(e => e.k === key) || (profile?.custom || []).find(e => e.k === key)
    || { k: key, n: key, s: 'push', step: 2.5, start: 0 };
}
function allExercises(profile) { return LIB.concat(profile?.custom || []); }
function exName(key, profile, fallback) {
  const lib = LIB.find(e => e.k === key) || (profile?.custom || []).find(e => e.k === key);
  return lib ? lib.n : (fallback || key);
}
function displayName(id) {
  const p = S.members.get(id)?.profile;
  if (p?.nick) return p.nick;
  const r = S.people[id];
  if (r?.name) return r.name;
  if (id === S.uid) return S.meInfo?.name || 'You';
  return 'Training buddy';
}
function avatarHtml(id, size) {
  const r = S.people[id] || (id === S.uid ? S.meInfo : null);
  const name = displayName(id);
  const dims = size ? `width:${size}px;height:${size}px;` : '';
  if (r?.avatarUrl && !(S.members.get(id)?.profile?.nick && !r.name)) {
    return `<span class="avatar" style="${dims}"><img src="${esc(r.avatarUrl)}" alt=""></span>`;
  }
  const bg = r?.color && /^(#[0-9a-f]{3,8}|rgba?\([\d.\s,%\/]+\))$/i.test(r.color) ? r.color : '#48505A';
  return `<span class="avatar" style="${dims}background:${esc(bg)}">${esc(name.trim().charAt(0).toUpperCase() || '?')}</span>`;
}

const startOf = id => S.members.get(id)?.profile?.start || START;
function sessionsOf(id) {
  const m = S.members.get(id);
  if (!m) return [];
  return [...m.sessions.values()]
    .filter(Boolean)
    .sort((a, b) => (a.date === b.date ? (a.startedAt || 0) - (b.startedAt || 0) : a.date < b.date ? -1 : 1));
}
const doneBlocks = s => (s.blocks || []).filter(b => b.done && !b.skipped && b.total > 0);
const countsAsTraining = s => doneBlocks(s).length > 0;
const isTrial = (s, id) => s.date < startOf(id);
/* Trainings that count: at least one finished block, on or after the start date. */
function trainings(id) { return sessionsOf(id).filter(s => countsAsTraining(s) && !isTrial(s, id)); }
function history(id, exKey, beforeSessionId) {
  const out = [];
  for (const s of sessionsOf(id)) {
    if (beforeSessionId && s.id === beforeSessionId) break;
    if (isTrial(s, id)) continue;
    for (const b of doneBlocks(s)) if (b.ex === exKey) out.push(Object.assign({}, b, { date: s.date, sid: s.id }));
  }
  return out;
}
/* The block to beat: the latest one that ran the full 10 minutes. */
function refBlock(hist) {
  for (let i = hist.length - 1; i >= 0; i--) if (!hist[i].cut) return hist[i];
  return hist[hist.length - 1] || null;
}
/* Total weight lifted = weight × reps, per set (the article's score). */
function blockVolume(b) {
  if (b.bw) return 0;
  const sets = b.sets || [];
  if (sets.length) return sets.reduce((a, x) => a + (x.kg != null ? Number(x.kg) : (Number(b.kg) || 0)) * x.r, 0);
  return (Number(b.kg) || 0) * (b.total || 0);
}
const scored = b => !b.bw && Number(b.kg) > 0;
function setKgs(b) { return [...new Set((b.sets || []).map(x => Number(x.kg ?? b.kg)))]; }
function setsText(b, info) {
  const sets = b.sets || [];
  if (setKgs(b).length <= 1 || b.bw) return sets.map(x => x.r).join(' · ');
  return sets.map(x => `${x.r}×${kgShort(x.kg ?? b.kg, info)}`).join(' · ');
}
/* The weight a block counts at: the lightest weight from the first heaviest set on,
   so warm-up ramps are ignored but drop sets count. */
function workKg(b) {
  const sets = (b.sets || []).filter(x => x.kg != null);
  if (!sets.length) return b.kg;
  const hi = Math.max(...sets.map(x => x.kg));
  return Math.min(...sets.slice(sets.findIndex(x => x.kg === hi)).map(x => x.kg));
}

/* Compare a block with the previous one of the same exercise. More kg is always harder
   (for bodyweight work kg = extra weight, negative = assistance). The article: beat last
   time with more reps at the same weight, or the same reps at a bit more weight. */
function compare(b, prev) {
  if (!prev) return null;
  const dk = Math.round(((Number(b.kg) || 0) - (Number(prev.kg) || 0)) * 10) / 10;
  const dr = (b.total || 0) - (prev.total || 0);
  let verdict;
  if (dk === 0) verdict = dr > 0 ? 'beter' : dr === 0 ? 'gelijk' : 'minder';
  else if (dk > 0) verdict = dr >= 0 ? 'beter' : 'zwaarder';
  else verdict = dr > 0 ? 'lichter' : 'minder';
  const parts = [];
  if (dk) parts.push(`${dk > 0 ? '+' : '−'}${fmtNum(Math.abs(dk))} kg`);
  parts.push(`${dr >= 0 ? '+' : '−'}${Math.abs(dr)} reps`);
  return { dk, dr, verdict, text: parts.join(' · '), tone: verdict === 'beter' ? 'pos' : verdict === 'minder' ? 'neg' : '' };
}
const VERDICT_TEXT = {
  beter: 'You beat last time!',
  gelijk: 'Dead even with last time.',
  minder: 'Just short this time.',
  zwaarder: 'Heavier, slightly fewer reps — normal after a weight jump.',
  lichter: 'Lighter weight, more reps.',
};
/* 'reps': more reps than ever at this weight or lighter; 'kg': same best reps, heavier. */
function recordKind(b, hist) {
  if (!hist.length || !(b.total > 0)) return null;
  const kg = Number(b.kg) || 0;
  const ref = hist.filter(h => (Number(h.kg) || 0) <= kg);
  if (!ref.length) return null;
  const best = Math.max(...ref.map(h => h.total));
  if (b.total > best) return 'reps';
  if (b.total === best && ref.every(h => (Number(h.kg) || 0) < kg || h.total < best)) return 'kg';
  return null;
}

/* Progression advice. When to go heavier is a tip, not from the article: the first
   fresh set had 12+ reps (the weight is lighter than the 5-10 rep weight the article
   asks for), or +20 % reps on the same weight (Escalating Density Training's rule). */
function advice(hist, info) {
  const full = hist.filter(h => !h.cut);
  const h2 = full.length ? full : hist;
  if (!h2.length) return { first: true };
  const last = h2[h2.length - 1];
  let i = h2.length - 1;
  while (i > 0 && h2[i - 1].kg === last.kg) i--;
  const base = h2[i];
  const runLen = h2.length - i;
  const gain = base.total > 0 ? (last.total - base.total) / base.total : 0;
  const out = { last, base, gain, runLen };
  const firstWork = (last.sets || []).find(x => Number(x.kg ?? last.kg) === Number(last.kg));
  const step = info.step || 2.5;
  const upKg = info.bw && last.kg < 0 ? Math.min(0, last.kg + step) : Math.round((last.kg + step) * 10) / 10;
  if (firstWork && firstWork.r >= 12) { out.up = upKg; out.why = `Your first set was ${firstWork.r} reps — lighter than the 5–10 rep weight the method uses.`; }
  else if (runLen >= 2 && gain >= UP_THRESHOLD) { out.up = upKg; out.why = `${Math.round(gain * 100)}% more reps at this weight than your first time.`; }
  return out;
}
/* What to aim for at the planned weight. */
function targetText(adv, kg) {
  const last = adv.last;
  const k = Number(kg) || 0, lk = Number(last.kg) || 0;
  if (k > lk) return `<b>${last.total}</b> reps at the heavier weight`;
  if (k < lk) return 'as many reps as you can (lighter doesn’t count as progress)';
  return `<b>${last.total + 1}+</b> reps`;
}
function kgLabel(kg, info) {
  if (kg == null || kg === '') return 'set weight';
  const n = Number(kg);
  if (info.bw) {
    if (n === 0) return 'bodyweight';
    return n > 0 ? `+${fmtNum(n)}\u00a0kg` : `${fmtNum(-n)}\u00a0kg\u00a0assist`;
  }
  if (info.dbl) return `2\u00a0×\u00a0${fmtNum(n / 2)}\u00a0kg`;
  return `${fmtNum(n)}\u00a0kg`;
}
function kgShort(kg, info) {
  const n = Number(kg) || 0;
  if (info.bw) return n === 0 ? '0' : n > 0 ? `+${fmtNum(n)}` : `−${fmtNum(-n)}`;
  return info.dbl ? `2×${fmtNum(n / 2)}` : fmtNum(n);
}
/* A block's weight; a range when it mixed weights. */
function blockKgLabel(b, info) {
  const ks = setKgs(b);
  if (ks.length > 1 && !b.bw) {
    const lo = Math.min(...ks), hi = Math.max(...ks);
    return info.dbl ? `2\u00a0×\u00a0${fmtNum(lo / 2)}–${fmtNum(hi / 2)}\u00a0kg` : `${fmtNum(lo)}–${fmtNum(hi)}\u00a0kg`;
  }
  return kgLabel(b.kg, info);
}
function plannedKg(profile, key) {
  const info = exInfo(key, profile);
  const w = profile?.weights && Object.hasOwn(profile.weights, key) ? profile.weights[key] : null;
  if (w != null) return { kg: w, suggested: false };
  const hist = history(S.uid, key);
  if (hist.length) return { kg: hist[hist.length - 1].kg, suggested: false };
  return { kg: info.start ?? 0, suggested: true };
}

function weekSessions(id, anyDay) {
  const mon = mondayOf(anyDay);
  return trainings(id).filter(s => mondayOf(s.date) === mon);
}
/* A/B/C by how many trainings of that week came before `day`. */
function templateFor(profile, day) {
  if (!profile || profile.mode !== 'abc') return 'A';
  const done = weekSessions(S.uid, day).filter(s => s.date < day || (s.date === day && s.status === 'done')).length;
  return ['A', 'B', 'C'][done % 3];
}
function planFor(profile, tpl) {
  return Object.assign({}, DEFAULT_PLANS.A, profile?.plans?.[tpl] || profile?.plans?.A || {});
}
function streakWeeks(id) {
  const ts = trainings(id);
  if (!ts.length) return 0;
  const byWeek = new Map();
  for (const s of ts) { const w = mondayOf(s.date); byWeek.set(w, (byWeek.get(w) || 0) + 1); }
  let wk = mondayOf(todayYmd());
  if ((byWeek.get(wk) || 0) < 3) wk = addDays(wk, -7);
  let n = 0;
  while ((byWeek.get(wk) || 0) >= 3) { n++; wk = addDays(wk, -7); }
  return n;
}
/* How many blocks beat the previous full block of the same exercise. */
function beatStats(id) {
  const keys = new Set();
  for (const s of trainings(id)) for (const b of doneBlocks(s)) keys.add(b.ex);
  let beat = 0, n = 0;
  for (const k of keys) {
    const h = history(id, k);
    for (let i = 1; i < h.length; i++) {
      const prev = refBlock(h.slice(0, i));
      if (!prev || h[i].cut) continue;
      n++;
      if (compare(h[i], prev).verdict === 'beter') beat++;
    }
  }
  return { beat, n };
}
function liveSession(id) {
  return sessionsOf(id).find(s => s.status === 'active' && !s.paused && s.updatedAt && Date.now() - s.updatedAt < 20 * 60 * 1000);
}
function nextTrainingDay(profile, from) {
  const days = profile?.days?.length ? profile.days : [1, 3, 5];
  const start = profile?.start || START;
  let d = from < start ? start : from;
  for (let i = 0; i < 14; i++) {
    if (days.includes(parseYmd(d).getDay())) return d;
    d = addDays(d, 1);
  }
  return from;
}
/* The training the Training tab is about: today if it is a training day and not
   done yet, otherwise the next one. */
function planDay(p) {
  const today = todayYmd();
  const doneToday = weekSessions(S.uid, today).some(s => s.date === today && s.status === 'done');
  return nextTrainingDay(p, doneToday ? addDays(today, 1) : today);
}


/* ------------------------------------------------------------------ *
 * Exercises typed by name
 * ------------------------------------------------------------------ */
const isLib = key => LIB.some(e => e.k === key);
const eqOf = info => info.eq || (info.bw ? 'bw' : info.dbl ? 'dbpair' : 'barbell');
const normName = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
/* A typed name matches an exercise by its name, or by a known other name ("OHP", "RDL"). */
function exByName(name, profile) {
  const n = normName(name);
  if (!n) return null;
  return allExercises(profile).find(e => normName(e.n) === n)
    || LIB.find(e => (ALIAS[e.k] || []).includes(n)) || null;
}
/* Turn a typed name into an exercise key, adding a custom exercise when it is new.
   Returns the (possibly changed) profile copy and the key. */
function resolveExercise(profile, name, slot, eq) {
  const p = clone(profile);
  p.custom = p.custom || [];
  const clean = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 40);
  const hit = exByName(clean, p);
  const e = EQUIP[eq] ? eq : guessEquip(clean);
  if (hit && isLib(hit.k)) return { p, key: hit.k };
  if (hit) {
    const c = p.custom.find(x => x.k === hit.k);
    if (c && EQUIP[eq] && c.eq !== eq) Object.assign(c, { eq, step: EQUIP[eq].step, bw: !!EQUIP[eq].bw, dbl: !!EQUIP[eq].dbl });
    return { p, key: hit.k };
  }
  let k = 'c-' + slug(clean);
  while (allExercises(p).some(x => x.k === k)) k += '-2';
  const q = EQUIP[e];
  p.custom.push({ k, n: clean, s: slot, eq: e, step: q.step, start: q.start, bw: !!q.bw, dbl: !!q.dbl });
  return { p, key: k };
}
function fillNameList() {
  const p = myProfile();
  const seen = new Set();
  const list = allExercises(p).filter(e => !seen.has(e.n) && seen.add(e.n)).sort((a, b) => a.n.localeCompare(b.n));
  const dl = $('#exNames');
  const html = list.map(e => `<option value="${esc(e.n)}" label="${esc(SLOT[e.s]?.label || '')} · ${esc(EQUIP[eqOf(e)].label)}"></option>`).join('');
  if (dl.dataset.h !== html) { dl.innerHTML = html; dl.dataset.h = html; }
}
/* The name to show for a logged block: the library/custom name, else what was stored. */
const blockName = (b, prof) => exName(b.ex, prof, b.name);

/* ------------------------------------------------------------------ *
 * UI state + rendering
 * ------------------------------------------------------------------ */
const UI = { tab: ['train', 'progress', 'team', 'plan'].includes(prefs.tab) ? prefs.tab : 'train', person: null, tpl: null, confirm: null, sheet: null, sheetReturn: null, runReturn: null, histOpen: new Set(), joinDays: [1, 3, 5] };
let renderQueued = false, renderDeferred = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
document.addEventListener('focusout', () => { if (renderDeferred) { renderDeferred = false; setTimeout(scheduleRender, 0); } });

/* A re-render replaces the view's HTML; put keyboard focus back on the same control. */
const FOCUS_KEYS = ['id', 'd', 'mode', 'tpl', 'slot', 'ex', 'm', 'dir', 'tab', 'fmt', 'n', 'v', 'eq'];
function focusSel(a) {
  if (!a || a === document.body || !a.closest) return null;
  if (a.id) return '#' + CSS.escape(a.id);
  if (a.tagName === 'SUMMARY') {
    const d = a.closest('details[data-hist]'); if (d) return `details[data-hist="${CSS.escape(d.dataset.hist)}"] > summary`;
    const h = a.closest('details[data-how]'); if (h) return `details[data-how] > summary`;
  }
  if (a.tagName === 'A' && a.getAttribute('href')) return `a[href="${CSS.escape(a.getAttribute('href'))}"]`;
  if (a.dataset && a.dataset.act) return `[data-act="${CSS.escape(a.dataset.act)}"]` + FOCUS_KEYS.filter(k => a.dataset[k] != null).map(k => `[data-${k}="${CSS.escape(a.dataset[k])}"]`).join('');
  const ch = a.closest('[data-chart]');
  if (ch) return `[data-chart="${CSS.escape(ch.dataset.chart)}"] svg`;
  return null;
}
function restoreFocus(root, sel) {
  if (!sel) return;
  const a = document.activeElement;
  if (a && a !== document.body && root.contains(a)) return;
  const el = root.querySelector(sel);
  if (el) { try { el.focus({ preventScroll: true }); } catch { /* ignore */ } }
}

function render() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox') { renderDeferred = true; return; }
  const fsel = a && a.closest && (a.closest('#main') || a.closest('#notice')) ? focusSel(a) : null;
  renderHeader();
  // Before joining there is only the welcome screen: no tab bar.
  const tab = myProfile() ? UI.tab : 'train';
  document.body.classList.toggle('no-tabs', !myProfile());
  for (const t of ['train', 'progress', 'team', 'plan']) {
    $('#view-' + t).hidden = tab !== t;
    document.querySelector(`.tab[data-tab="${t}"]`).setAttribute('aria-selected', String(tab === t));
  }
  const v = $('#view-' + tab);
  let html;
  try {
    html = tab === 'train' ? viewTrain() : tab === 'progress' ? viewProgress() : tab === 'team' ? viewTeam() : viewPlan();
  } catch (e) {
    console.error(e);
    UI.person = null;
    html = `<div class="card"><b>This section couldn’t be shown.</b><p class="small">Try another tab or reload the page.</p></div>`;
  }
  v.innerHTML = html;
  if (tab === 'progress') bindCharts(v);
  if (myProfile()) fillNameList();
  restoreFocus(v, fsel);
  const fa = document.activeElement;
  if (fsel && (!fa || fa === document.body || fa.closest('[hidden]'))) { const t = $('.tab[aria-selected="true"]'); if (t) t.focus({ preventScroll: true }); }
  const pc = v.querySelector('.seg.scroll [aria-pressed="true"]');
  if (pc) { const t = pc.parentElement; t.scrollLeft += pc.getBoundingClientRect().left - t.getBoundingClientRect().left - (t.clientWidth - pc.offsetWidth) / 2; }
  maybeReopen();
}

/* After a reload in the middle of a block, go straight back to the clock. */
let reopenChecked = false;
function maybeReopen() {
  if (reopenChecked || R.session || S.mode === 'loading' || !myProfile() || (S.mode === 'shared' && !S.ownLocal && !S.ownSeen)) return;
  reopenChecked = true;
  const d = loadDraft();
  if (d && (d.phase === 'run' || d.phase === 'over')) openRunner(true);
}

function renderHeader() {
  const p = myProfile();
  const today = todayYmd();
  const start = p?.start || START;
  $('#weekLabel').textContent = today < start ? `Starts ${fmtDM(start)}` : `Week ${cycleWeek(today, start).w} of ${CYCLE_WEEKS}`;
  // Only worth a label when workouts are NOT going to the shared log.
  $('#sync').hidden = !(S.mode === 'local' || (S.mode === 'shared' && S.ownLocal));
  $('#syncText').textContent = 'This device only';
  const av = $('#meAvatar');
  if (S.uid && av) av.outerHTML = avatarHtml(S.uid).replace('<span class="avatar"', '<span class="avatar" id="meAvatar" aria-hidden="true"');
  const nb = $('#notice');
  if (nb.dataset.txt !== S.notice) {
    nb.dataset.txt = S.notice;
    nb.innerHTML = S.notice ? `<div class="notice"><span>${esc(S.notice)}</span><button class="btn link" data-act="dismissNotice" style="justify-self:start">Got it</button></div>` : '';
  }
}

const SKELETON = `<div class="skeleton">Loading your log…</div>`;
const CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const CLOSE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const plateHtml = (slot, sm) => `<span class="plate ${slot}${sm ? ' sm' : ''}" aria-hidden="true"></span>`;

/* ---------- Today ---------- */
/* "Load the bar": each workout of the week slides a bumper plate on, heaviest first
   (red, blue, yellow). Three plates = week done. */
function barSvg(n, live) {
  const W = 340, H = 92, cy = H / 2, PH = 80;
  const widths = [20, 17, 14], fills = ['p-push', 'p-pull', 'p-legs'];
  let out = `<rect class="rod" x="4" y="${cy - 3}" width="${W - 8}" height="6" rx="3"/>`;
  for (const x of [12, W - 110]) out += `<rect class="sleeve" x="${x}" y="${cy - 7}" width="98" height="14" rx="3"/>`;
  for (const x of [110, W - 118]) out += `<rect class="sleeve" x="${x}" y="${cy - 14}" width="8" height="28" rx="2"/>`;
  for (let x = 136; x <= W - 136; x += 6) out += `<line class="knurl" x1="${x}" x2="${x}" y1="${cy - 3}" y2="${cy + 3}"/>`;
  let off = 0;
  for (let i = 0; i < 3; i++) {
    const w = widths[i];
    const c = i < n ? fills[i] : i === n && live ? 'p-live' : 'slot';
    for (const x of [110 - off - w - 1, W - 110 + off + 1]) out += `<rect class="${c}" x="${x}" y="${cy - PH / 2}" width="${w}" height="${PH}" rx="4"/>`;
    off += w + 2;
  }
  return `<svg class="bar-svg" viewBox="0 0 ${W} ${H}" aria-hidden="true">${out}</svg>`;
}

function viewTrain() {
  const p = myProfile();
  if (S.mode === 'loading' || (S.migrating && !p)) return SKELETON;
  // Never offer 'Join' before we know this person has no profile yet.
  if (!p && S.mode === 'shared' && !S.membersSeen) return SKELETON;
  if (!p) return viewOnboarding();
  const today = todayYmd();
  const start = p.start || START;
  const pre = today < start;
  const wkDay = pre ? start : today;
  const draft = loadDraft();
  const draftId = draft ? draft.session.id : null;
  const wk = weekSessions(S.uid, wkDay);
  const doneToday = !pre && wk.some(s => s.date === today && s.status === 'done');
  const next = nextTrainingDay(p, doneToday ? addDays(today, 1) : today);
  const isToday = next === today && !pre;
  const abc = p.mode === 'abc';
  const tpl = UI.tpl || templateFor(p, next);
  const plan = planFor(p, tpl);
  const nextTxt = `${cap(parseYmd(next).toLocaleDateString(LOC, { weekday: 'long' }))}${abc ? ' · Workout ' + templateFor(p, next) : ''}`;

  let eyebrow, title, sub = '';
  if (pre) {
    const n = daysBetween(today, start);
    eyebrow = `${start > START ? 'You start' : 'You all start'} in ${plural(n, 'day', 'days')}`;
    title = cap(fmtLong(start));
    sub = 'Want to try the clock first? A practice workout doesn’t count.';
  } else if (doneToday) {
    eyebrow = cap(fmtLong(today));
    title = 'Done for today';
    sub = `Nice work. Next: ${nextTxt}.`;
  } else if (isToday) {
    eyebrow = `${cap(fmtLong(today))} · training day`;
    title = abc ? `Workout ${tpl}` : 'Today’s workout';
  } else {
    eyebrow = cap(fmtLong(today));
    title = 'Rest day';
    sub = `Next: ${nextTxt}.`;
  }

  // Week: the bar plus one chip per workout done or planned this week.
  const days = (p.days?.length ? p.days : [1, 3, 5]).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
  const mon = mondayOf(wkDay);
  const joinedDay = p.joined ? ymd(new Date(p.joined)) : start;
  const planned = days.map(d => addDays(mon, (d + 6) % 7));
  const open = planned.filter(d => !wk.some(x => x.date === d));
  const fill = open.filter(d => d >= today).concat(open.filter(d => d < today).reverse()).slice(0, Math.max(0, 3 - wk.length));
  const items = wk.slice(0, 3).map(x => ({ d: x.date, s: x })).concat(fill.map(d => ({ d }))).sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
  const cells = items.map(it => {
    const dd = parseYmd(it.d);
    const lbl = `<b>${WD[dd.getDay()]} ${dd.getDate()}</b>`;
    if (it.s) {
      const live = it.s.status !== 'done';
      return `<div class="wday ${live ? 'live' : 'done'}">${lbl}<span>${live ? 'in progress' : '✓ done'}</span></div>`;
    }
    if (it.d < today && (pre || it.d < joinedDay || it.d < start)) return `<div class="wday na">${lbl}<span>–</span></div>`;
    const missed = it.d < today;
    return `<div class="wday${it.d === next ? ' next' : ''}${missed ? ' missed' : ''}">${lbl}<span>${missed ? 'missed' : it.d === today ? 'today' : it.d === next ? 'next' : 'planned'}</span></div>`;
  }).join('');
  const nDone = Math.min(3, wk.filter(s => s.status === 'done').length);
  const live = wk.some(s => s.status !== 'done') || !!(draft && mondayOf(draft.session.date) === mon);
  const barLine = nDone >= 3 ? 'Bar loaded — week done!' : nDone ? `${plural(3 - nDone, 'more workout', 'more workouts')} to load the bar.` : 'Every workout adds a plate.';
  const weekCard = `
    <div class="card bar-card">
      <div class="row"><div class="grow"><div class="eyebrow">Load the bar</div><div class="h2">${nDone} of 3 this week</div></div></div>
      <div role="img" aria-label="${nDone} of 3 workouts done this week">${barSvg(nDone, live)}</div>
      <p class="small">${barLine}</p>
      <div class="week">${cells}</div>
    </div>`;

  const cn = cycleWeek(pre ? start : next, start);
  const cycleNote = pre || (cn.round === 1 && cn.w === 1) ? 'Baseline week — log everything, beat it next week.' : `Round ${cn.round} · week ${cn.w} of ${CYCLE_WEEKS} — same exercises, more reps.`;
  const cw = cycleWeek(wkDay, start);
  const review = !pre && ((cw.w === CYCLE_WEEKS && wk.length >= 3) || (cw.w === 1 && cw.round > 1 && wk.length === 0)) ? `
    <div class="card">
      <div class="eyebrow">${CYCLE_WEEKS} weeks done</div>
      <p class="small">Time to review your plan. Keep what works or swap a few exercises — a new exercise starts with a new baseline.</p>
      <button class="btn ghost sm" data-act="tab" data-tab="plan" style="justify-self:start">Review plan</button>
    </div>` : '';

  const tplSel = abc
    ? `<div class="seg" role="group" aria-label="Choose workout">${['A', 'B', 'C'].map(t => `<button data-act="pickTpl" data-tpl="${t}" aria-pressed="${t === tpl}">${t}</button>`).join('')}</div>`
    : '';
  const rows = SLOT_ORDER.map(slot => exRow(p, tpl, slot, plan[slot], { today: isToday, exclude: draftId })).join('');
  const anyBase = SLOT_ORDER.some(slot => !history(S.uid, plan[slot]).filter(h => h.sid !== draftId).length);
  const ups = SLOT_ORDER.map(slot => upHint(p, plan[slot], draftId)).filter(Boolean).join('');

  const resume = draft ? `
    <div class="card" style="box-shadow: inset 0 0 0 2px var(--push)">
      <div class="row"><span class="pill live">In progress</span><span class="small grow">Workout from ${esc(fmtShort(draft.session.date))} · ${draft.phase === 'finish' ? 'ready to save' : `block ${Math.min(3, (draft.idx | 0) + 1)} of 3`}</span></div>
      <div class="row wrap"><button class="btn primary" data-act="resume">Resume</button><button class="btn ghost" data-act="discardDraft">${UI.confirm === 'discardDraft' ? 'Tap again to discard' : 'Discard'}</button></div>
    </div>` : '';

  const startBtn = draft
    ? `<button class="btn primary xl start-sticky" data-act="resume">Resume workout</button>`
    : isToday && !doneToday
      ? `<button class="btn primary xl start-sticky" data-act="startSession" data-tpl="${tpl}">Start ${abc ? 'Workout ' + tpl : 'workout'} · 30 min</button>`
      : `<button class="btn ghost xl" data-act="startSession" data-tpl="${tpl}">${pre ? 'Try a practice workout' : 'Train anyway'}</button>`;

  const last = trainings(S.uid).filter(x => x.id !== draftId).slice(-1)[0];
  const lastCard = last ? `
    <div class="card">
      <div class="row"><div class="grow"><div class="eyebrow">Last workout</div><div class="h2">${esc(cap(fmtLong(last.date)))}</div></div><button class="btn link" data-act="tab" data-tab="progress">All progress</button></div>
      ${sessionSummaryRows(last)}
    </div>` : '';

  return `
    ${resume}
    <div class="head"><div class="eyebrow">${esc(eyebrow)}</div><h1 class="title">${esc(title)}</h1>${sub ? `<p class="small">${esc(sub)}</p>` : ''}</div>
    ${weekCard}
    ${review}
    <div class="card">
      <div class="row"><div class="grow"><div class="eyebrow">${abc ? 'Workout ' + tpl : 'Your workout'} · ${isToday && !doneToday ? 'today' : esc(WD[parseYmd(next).getDay()] + ' ' + fmtDM(next))}</div><div class="small">${esc(cycleNote)}</div></div>${tplSel}</div>
      <ul class="ex-list">${rows}</ul>
      ${anyBase ? '<p class="tiny">Baseline: pick a weight you can lift for 5–10 clean reps when fresh.</p>' : ''}
      ${ups}
      ${startBtn}
      ${pre ? `<p class="tiny" style="text-align:center">Workouts before ${esc(fmtLong(start))} count as practice, not as your baseline.</p>` : ''}
      <div class="row" style="justify-content:center;gap:4px;flex-wrap:wrap"><span class="tiny">Tap an exercise to change it.</span><button class="btn link" data-act="manual">Log a past workout</button></div>
    </div>
    ${lastCard}
    <details class="card how" data-how>
      <summary><span class="grow">How a block works</span>${CHEV}</summary>
      <ol class="small">
        <li>Warm up with a few light sets, then start the clock: 10 minutes for this one exercise.</li>
        <li>Do a set of clean reps and stop before your form slips. Tap the number of reps.</li>
        <li>Rest as long as you need, then go again. Sets get smaller — that’s normal.</li>
        <li>After 10 minutes you have your score. Next time: more reps, or the same reps a bit heavier.</li>
      </ol>
    </details>`;
}

/* One exercise in a workout: tap to change exercise, equipment or weight. */
function exRow(p, tpl, slot, key, opts = {}) {
  const info = exInfo(key, p);
  const pk = plannedKg(p, key);
  const adv = advice(history(S.uid, key).filter(h => h.sid !== opts.exclude), info);
  const kg = `<span class="ex-kg">${esc(kgLabel(pk.kg, info))}</span>`;
  const sub = adv.first ? `${kg} · baseline` : `${kg} · last ${adv.last.total} reps · ${opts.today ? 'goal today' : 'goal'} ${targetText(adv, pk.kg)}`;
  return `<li><button class="ex-row" data-act="editEx" data-tpl="${tpl}" data-slot="${slot}" aria-label="${esc(SLOT[slot].label)}: ${esc(info.n)}, ${esc(kgLabel(pk.kg, info))}. Change">
    ${plateHtml(slot)}
    <span class="ex-main"><span class="ex-n">${esc(info.n)}</span><span class="ex-sub">${sub}</span></span>${CHEV}
  </button></li>`;
}
function upHint(p, key, exclude) {
  const info = exInfo(key, p);
  const adv = advice(history(S.uid, key).filter(h => h.sid !== exclude), info);
  if (adv.first || adv.up == null || Number(plannedKg(p, key).kg) >= adv.up) return '';
  return `<div class="up"><span class="grow"><b>${esc(info.n)}:</b> ${esc(adv.why)} Try ${esc(kgLabel(adv.up, info))}.</span><button class="btn sm good" data-act="applyUp" data-ex="${esc(key)}" data-kg="${adv.up}">Use ${esc(kgLabel(adv.up, info))}</button></div>`;
}

function sessionSummaryRows(s) {
  const p = myProfile();
  return `<div>${(s.blocks || []).map(b => {
    const info = exInfo(b.ex, p);

  if (!ts.length) {
    return `

        <div class="ex-card-head">${plateHtml('push')}<div class="grow"><b class="ex-n">Dumbbell bench press</b><span class="tiny">reps per 10-minute block</span></div><span class="pill">Example</span></div>

  }

  const today = todayYmd();
  const thisWeek = weekSessions(pid, today).length;
  const vol = ts.reduce((a, s) => a + doneBlocks(s).reduce((x, b) => x + blockVolume(b), 0), 0);
  const tiles = `
    <div class="tiles">
      <div class="tile"><span class="lbl">Workouts</span><span class="val">${ts.length}</span></div>
      <div class="tile"><span class="lbl">This week</span><span class="val">${thisWeek}<small> / 3</small></span></div>
      <div class="tile"><span class="lbl">Week streak</span><span class="val">${streakWeeks(pid)}</span></div>
      <div class="tile"><span class="lbl">Total volume</span><span class="val">${vol >= 10000 ? fmtNum(Math.round(vol / 100) / 10) + '<small> t</small>' : fmtNum(Math.round(vol)) + '<small> kg</small>'}</span></div>
    </div>`;

  const keys = [];
  for (const s of ts) for (const b of doneBlocks(s)) if (!keys.some(k => k.ex === b.ex)) keys.push({ ex: b.ex, slot: b.slot, name: b.name });
  keys.sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
  const charts = keys.map(k => {
    const info = exInfo(k.ex, prof);
    const h = history(pid, k.ex);
    const metric = prefs.metric === 'vol' && h.some(scored) ? 'vol' : 'reps';
    const pts = h.map(b => ({ y: metric === 'vol' ? Math.round(blockVolume(b)) : b.total, reps: b.total, kg: b.kg, vol: Math.round(blockVolume(b)), date: b.date, bw: !!b.bw, cut: !!b.cut }));
    const first = h[0], last = h[h.length - 1];
    const rec = h.length > 1 && recordKind(last, h.slice(0, -1));
    const line = h.length > 1
      ? `${first.total} reps · ${esc(blockKgLabel(first, info))} &nbsp;→&nbsp; <b>${last.total} reps</b> · ${esc(blockKgLabel(last, info))}${last.cut ? ' · stopped early' : ''}`
      : `Baseline <b>${first.total} reps</b> · ${esc(blockKgLabel(first, info))}`;
    const color = k.slot === 'legs' ? 'var(--legs-mark)' : `var(--${k.slot})`;
    return `
      <div class="card">
        <div class="ex-card-head">${plateHtml(k.slot, true)}
          <div class="grow"><b class="ex-n">${esc(exName(k.ex, prof, k.name))}</b><span class="small">${line}</span></div>
          ${rec ? '<span class="pill good">PR</span>' : ''}
        </div>
        ${h.length > 1 ? chartSvg('c-' + k.ex, pts, color, metric, false, info) : '<span class="tiny">The chart appears after your second time doing this exercise.</span>'}
        ${metric === 'reps' && prefs.metric === 'vol' && h.length > 1 ? '<span class="tiny">Bodyweight exercise: shown in reps.</span>' : ''}
      </div>`;
  }).join('');

  const start = prof?.start || START;
  const curW = Math.max(1, weekNo(today, start));
  const weeks = [];
  for (let w = Math.max(1, curW - 9); w <= curW; w++) weeks.push(w);
  const adh = weeks.reverse().map(w => {
    const monW = addDays(mondayOf(start), (w - 1) * 7);
    const n = ts.filter(s => mondayOf(s.date) === monW).length;
    const cur = w === curW;
    const cells = [0, 1, 2].map(i => `<i class="${i < n ? 'on' : cur ? 'cur' : ''}"></i>`).join('');
    return `<div class="adh-row"><span class="lbl">Wk ${w}</span><span class="adh-cells">${cells}</span><span class="tiny num">${n}/3${n > 3 ? ' +' + (n - 3) : ''}</span></div>`;
  }).join('');

  return `
    ${who}
    ${title}
    ${tiles}
    <div class="card"><div class="row"><div class="eyebrow grow">Workouts per week</div><span class="tiny">goal: 3</span></div><div class="adh">${adh}</div></div>
    <div class="row wrap"><div class="eyebrow grow">Per exercise</div>${metricSel}</div>
    ${charts}
    ${histCard}`;
}

/* Line chart with a crosshair tooltip (mouse, touch and arrow keys). */
const CHARTS = {};
const CHART_SEL = {};
function niceScale(min, max, n) {
  if (min === max) { min = Math.max(0, min - 5); max = max + 5; }
  const raw = (max - min) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  let step = Math.max(1, (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag);
  if (!Number.isFinite(step) || min + step === min) step = Math.max(1, (max - min) / n || 1);
  return [Math.max(0, Math.floor(min / step) * step), Math.ceil(max / step) * step, step];
}
function chartSvg(id, pts, color, metric, isExample, info) {
  const W = 340, H = 172, L = 42, R = 16, T = 26, B = 26;
  CHARTS[id] = { pts, metric, W, info: info || {} };
  if (!pts.length) return '';
  const ys = pts.map(p => p.y);
  const [lo, hi, step] = niceScale(Math.min(...ys), Math.max(...ys), 4);
  const x = i => pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / ((hi - lo) || 1));
  CHARTS[id].xs = pts.map((p, i) => x(i));
  CHARTS[id].ys = pts.map(p => y(p.y));
  let grid = '';
  for (let i = 0, nT = Math.min(12, Math.round((hi - lo) / step)); i <= nT; i++) {
    const v = lo + i * step;
    grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" style="font-variant-numeric:tabular-nums">${fmtNum(v)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const area = pts.length > 1 ? `${line}L${x(pts.length - 1).toFixed(1)},${y(lo).toFixed(1)}L${x(0).toFixed(1)},${y(lo).toFixed(1)}Z` : '';
  // Weight labels where the weight changed; placed right to left so the current weight always shows.
  let kgl = '', placedX = Infinity, placedTxt = null;
  const changes = pts.map((p, i) => i).filter(i => (i === 0 || pts[i].kg !== pts[i - 1].kg) && !(i === 0 && pts[i].bw && pts[i].kg === 0));
  for (let j = changes.length - 1; j >= 0; j--) {
    const i = changes[j];
    kgl += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${T - 6}" y2="${(H - B).toFixed(1)}" class="grid"/>`;
    const lx = Math.min(Math.max(x(i), L + 22), W - R - 22);
    const txt = kgShort(pts[i].kg, info || {});
    if (placedX - lx < 46 || txt === placedTxt) continue;
    placedX = lx; placedTxt = txt;
    kgl += `<text x="${lx.toFixed(1)}" y="${T - 12}" text-anchor="middle">${esc(txt)} kg</text>`;
  }
  const lastI = pts.length - 1;
  const xl = `<text x="${x(0).toFixed(1)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${esc(fmtDM(pts[0].date))}</text>` +
    (pts.length > 1 ? `<text x="${x(lastI).toFixed(1)}" y="${H - 6}" text-anchor="end">${esc(fmtDM(pts[lastI].date))}</text>` : '');
  const ly = y(pts[lastI].y);
  const endY = ly - 10 < T + 2 ? ly + 18 : ly - 10;
  const endLabel = `<text x="${Math.min(x(lastI) - (pts.length === 1 ? 0 : 8), W - R).toFixed(1)}" y="${endY.toFixed(1)}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}" paint-order="stroke" stroke="var(--surface)" stroke-width="3" stroke-linejoin="round" style="fill:var(--ink);font-weight:800;font-size:12px">${fmtNum(pts[lastI].y)}</text>`;
  const label = metric === 'vol' ? 'volume in kg per block' : 'reps per block';
  return `<div class="chart-wrap" data-chart="${esc(id)}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}, ${pts.length} workouts" ${isExample ? '' : 'tabindex="0"'}>
      ${grid}${kgl}
      ${area ? `<path d="${area}" fill="${color}" fill-opacity=".1" stroke="none"/>` : ''}
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.length <= 24 ? pts.map((p, i) => i === lastI ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="${p.cut ? 3.5 : 2.5}" fill="${p.cut ? 'var(--surface)' : color}" stroke="${color}" stroke-width="${p.cut ? 1.5 : 0}"/>`).join('') : ''}
      <circle cx="${x(lastI).toFixed(1)}" cy="${ly.toFixed(1)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
      ${endLabel}${xl}
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
      <circle class="xh-dot" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    </svg>
    <div class="tip" hidden></div>
  </div>`;
}
function bindCharts(root) {
  root.querySelectorAll('[data-chart]').forEach(wrap => {
    const id = wrap.dataset.chart;
    const c = CHARTS[id];
    if (!c || id === 'example') return;
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
    const xh = svg.querySelector('.xh'), dot = svg.querySelector('.xh-dot');
    let cur = -1;
    const show = i => {
      if (i < 0 || i >= c.pts.length) return;
      cur = i; CHART_SEL[id] = i;
      const p = c.pts[i];
      xh.setAttribute('x1', c.xs[i]); xh.setAttribute('x2', c.xs[i]); xh.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', c.xs[i]); dot.setAttribute('cy', c.ys[i]); dot.setAttribute('visibility', 'visible');
      const kg = kgLabel(p.kg, c.info);
      const main = c.metric === 'vol' ? `${fmtNum(p.y)} kg volume` : `${p.reps} reps`;
      const sub = c.metric === 'vol' ? `${p.reps} reps · ${kg}` : kg + (p.vol ? ` · ${fmtNum(p.vol)} kg volume` : '');
      tip.innerHTML = `<strong>${esc(main)}</strong>${esc(sub)}<br>${esc(fmtShort(p.date))}${p.cut ? ' · stopped early' : ''}`;
      tip.hidden = false;
      const w = wrap.clientWidth, tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(c.xs[i] / c.W * w, tw / 2 + 2), w - tw / 2 - 2) + 'px';
      tip.style.top = '-6px';
      tip.style.transform = 'translate(-50%, -100%)';
    };
    const hide = () => { cur = -1; tip.hidden = true; xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
    const nearest = ev => {
      const r = svg.getBoundingClientRect();
      const vx = (ev.clientX - r.left) / r.width * c.W;
      let best = 0, bd = Infinity;
      c.xs.forEach((xv, i) => { const d = Math.abs(xv - vx); if (d < bd) { bd = d; best = i; } });
      return best;
    };
    svg.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse' || ev.buttons) show(nearest(ev)); });
    svg.addEventListener('pointerdown', ev => show(nearest(ev)));
    svg.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') hide(); });
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowLeft') { show(Math.max(0, (cur < 0 ? c.pts.length : cur) - 1)); ev.preventDefault(); }
      if (ev.key === 'ArrowRight') { show(Math.min(c.pts.length - 1, cur + 1)); ev.preventDefault(); }
      if (ev.key === 'Escape') { hide(); delete CHART_SEL[id]; }
    });
    svg.addEventListener('focus', () => { if (svg.matches(':focus-visible') && cur < 0) show(CHART_SEL[id] ?? c.pts.length - 1); });
  });
}

/* ------------------------------------------------------------------ *

const R = { session: null, idx: 0, phase: 'ready', t0: 0, leadEnd: 0, pausedAt: 0, pausedMs: 0, timer: null, lastRem: null, wake: null, confirm: null, confirm2: null, lastSet: null, menuPaused: false };

  // Finished on another device meanwhile: the shared copy wins.
  const stored = S.uid ? S.members.get(S.uid)?.sessions.get(s.id) : null;
  if (stored && stored.status === 'done' && !(R.session && R.session.id === s.id)) { LS.del(DRAFT_KEY()); return null; }
  return Object.assign({}, d, { session: s, idx: Math.min(2, Math.max(0, d.idx | 0)) });
}
function saveDraft() {

}
function clearDraftFor(id) { const d = loadDraft(); if (d && d.session.id === id) LS.del(DRAFT_KEY()); }

function newSession(tpl) {
  const p = myProfile();
