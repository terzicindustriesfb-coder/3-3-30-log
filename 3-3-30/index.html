/* ------------------------------------------------------------------ *
 * Runner: live 10-minute AMRAP blocks
 * ------------------------------------------------------------------ */
const R = { session: null, idx: 0, phase: 'ready', t0: 0, leadEnd: 0, pausedAt: 0, pausedMs: 0, timer: null, lastRem: null, wake: null, confirm: null, confirm2: null, lastSet: null, menuPaused: false };
const DRAFT_KEY = () => 'd330.draft.' + (S.uid || 'local');
function loadDraft() {
  const d = LS.get(DRAFT_KEY(), null);
  if (!d || !d.session) return null;
  const s = normSession(d.session);
  if (!s || s.blocks.length !== 3) return null;
  // Finished on another device meanwhile: the shared copy wins.
  const stored = S.uid ? S.members.get(S.uid)?.sessions.get(s.id) : null;
  if (stored && stored.status === 'done' && !(R.session && R.session.id === s.id)) { LS.del(DRAFT_KEY()); return null; }
  return Object.assign({}, d, { session: s, idx: Math.min(2, Math.max(0, d.idx | 0)) });
}
function saveDraft() {
  if (!R.session) { LS.del(DRAFT_KEY()); return; }
  LS.set(DRAFT_KEY(), { session: R.session, idx: R.idx, phase: R.phase, t0: R.t0, leadEnd: R.leadEnd, pausedAt: R.pausedAt, pausedMs: R.pausedMs });
}
function clearDraftFor(id) { const d = loadDraft(); if (d && d.session.id === id) LS.del(DRAFT_KEY()); }

function newSession(tpl) {
  const p = myProfile();
  const today = todayYmd();
  const t = tpl || templateFor(p, today);
  const plan = planFor(p, t);
  return {
    v: 1, id: uidGen('s'), date: today, tpl: t, status: 'active', startedAt: Date.now(), updatedAt: Date.now(),
    blocks: SLOT_ORDER.map(slot => {
      const key = plan[slot];
      const info = exInfo(key, p);
      return { slot, ex: key, name: info.n, kg: Number(plannedKg(p, key).kg) || 0, bw: !!info.bw, sets: [], total: 0, dur: 0, done: false, skipped: false, cut: false };
    }),
    feel: 0, note: '',
  };
}
function setBackgroundInert(on) {
  $('#app').inert = on;
  $('.tabs').inert = on;
}
function openRunner(fromDraft, tpl) {
  const d = fromDraft ? loadDraft() : null;
  if (d) {
    Object.assign(R, { session: d.session, idx: d.idx, phase: d.phase, t0: d.t0, leadEnd: d.leadEnd, pausedAt: d.pausedAt, pausedMs: d.pausedMs });
    if (R.phase === 'lead') R.phase = 'ready';
    if (!['ready', 'run', 'paused', 'over', 'finish'].includes(R.phase)) R.phase = 'ready';
  } else {
    Object.assign(R, { session: newSession(tpl), idx: 0, phase: 'ready', t0: 0, leadEnd: 0, pausedAt: 0, pausedMs: 0 });
  }
  R.lastRem = null; R.confirm = null; R.confirm2 = null; R.lastSet = null; R.menuPaused = false;
  const a = document.activeElement;
  UI.runReturn = a && a !== document.body ? focusSel(a) : null;
  $('#runner').hidden = false;
  document.body.style.overflow = 'hidden';
  setBackgroundInert(true);
  saveDraft();
  if (R.phase === 'run') { wakeOn(); startTick(); }
  renderRunner();
  if (R.phase === 'run' || R.phase === 'over') keepPadInView();
  const first = $('#runner .ex-name') || $('#runner [data-act]');
  if (first) { first.setAttribute('tabindex', '-1'); try { first.focus({ preventScroll: true }); } catch { /* ignore */ } }
}
function closeRunner() {
  stopTick(); wakeOff();
  $('#runner').hidden = true;
  $('#runner').innerHTML = '';
  document.body.style.overflow = '';
  setBackgroundInert(false);
  R.session = null;
  render();
  const back = [UI.runReturn && $('#main ' + UI.runReturn), $('[data-act="resume"]'), $('[data-act="startSession"]')].find(el => el && !el.disabled);
  if (back) { try { back.focus({ preventScroll: true }); } catch { /* ignore */ } }
}
const blk = () => R.session.blocks[R.idx];
function elapsed() {
  if (R.phase === 'run') return (Date.now() - R.t0 - R.pausedMs) / 1000;
  if (R.phase === 'paused') return (R.pausedAt - R.t0 - R.pausedMs) / 1000;
  if (R.phase === 'over') return blk().dur || BLOCK_SEC;
  return 0;
}
function startTick() { stopTick(); R.timer = setInterval(tick, 200); tick(); }
function stopTick() { if (R.timer) clearInterval(R.timer); R.timer = null; }

function tick() {
  if (!R.session) return;
  if (R.phase === 'lead') {
    const rem = Math.ceil((R.leadEnd - Date.now()) / 1000);
    if (rem !== R.lastRem) { if (rem <= 3 && rem >= 1) beep(660, 0.12); R.lastRem = rem; }
    if (rem <= 0) { beginBlock(); return; }
    updateClock(rem, true);
    return;
  }
  if (R.phase !== 'run') return;
  const remF = BLOCK_SEC - elapsed();
  const rem = Math.ceil(remF);
  if (R.lastRem != null && rem !== R.lastRem) {
    if (R.lastRem > 300 && rem <= 300 && rem > 295) { beep(880, 0.15); buzz(80); }
    if (R.lastRem > 60 && rem <= 60 && rem > 55) { beep(880, 0.12); beep(880, 0.12, 0.22); buzz([80, 60, 80]); }
    if (rem <= 3 && rem >= 1 && R.lastRem > rem) beep(660, 0.1);
  }
  R.lastRem = rem;
  if (remF <= 0) { endBlock(true); return; }
  updateClock(rem, false);
  updateGhost();
}
function beginBlock() {
  R.phase = 'run'; R.t0 = Date.now(); R.pausedMs = 0; R.pausedAt = 0; R.lastRem = BLOCK_SEC;
  beep(1175, 0.35); buzz(200);
  saveDraft(); renderRunner(); startTick();
  markLive();
  keepPadInView();
}
/* During a block the rep pad must stay reachable without scrolling. */
function keepPadInView() {
  const pad = $('#runner .pad');
  if (pad && pad.getBoundingClientRect().bottom > window.innerHeight) pad.scrollIntoView({ block: 'end' });
}
/* Let training buddies see "traint nu" while a block runs. */
function markLive() {
  if (!R.session || isTrial(R.session, S.uid)) return;
  const st = me().sessions.get(R.session.id);
  if (!st || st.paused) { R.session.updatedAt = Date.now(); saveSession(Object.assign(clone(R.session), { paused: false }), { quiet: true }); }
}
function endBlock(auto) {
  const b = blk();
  b.dur = Math.min(BLOCK_SEC, Math.round(R.phase === 'paused' || R.phase === 'run' ? elapsed() : BLOCK_SEC));
  b.cut = !auto && b.dur < BLOCK_SEC - 1;
  R.phase = 'over';
  stopTick();
  if (auto) { beep(988, 0.7); buzz([300, 100, 300]); }
  b.total = b.sets.reduce((a, s) => a + s.r, 0);
  saveDraft(); renderRunner(); keepPadInView();
}

/* Sound + vibration + wake lock — all optional and failure-tolerant. */
let AC = null;
function audio() {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch { AC = null; }
  return AC;
}
function beep(freq, dur, when = 0) {
  if (!prefs.sound) return;
  const ac = audio(); if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = freq;

    const kgEl = form.querySelector('#kg' + i);
    const kgIn = parseKg(kgEl ? kgEl.value : fd.get('kg' + i));
    const fieldDbl = kgEl ? kgEl.dataset.dbl === '1' : !!info.dbl;
    b.ex = ex; b.name = info.n; b.bw = !!info.bw;
    b.kg = Number.isFinite(kgIn) ? Math.round(clampN(fieldDbl ? kgIn * 2 : kgIn, -300, 1000) * 10) / 10 : oldKg;
    if (!info.bw) b.kg = Math.max(0, b.kg);
    b.skipped = !!fd.get('skip' + i);
    if (b.kg !== oldKg) b.sets = (b.sets || []).map(x => (x.kg == null || Number(x.kg) === oldKg ? Object.assign({}, x, { kg: b.kg }) : x));
    const setsIn = form.querySelector(`[name="sets${i}"]`);
    const setsChanged = setsIn.value !== setsIn.dataset.orig;
    if (setsChanged) {
      const old = b.sets || [];
      const parsed = parseSets(setsIn.value), align = parsed.length < old.length;
      let j0 = 0;
      b.sets = parsed.map((r, j) => {
        if (align) { const k = old.findIndex((o, x) => x >= j0 && o.r === r); if (k >= 0) { j0 = k + 1; return Object.assign({}, old[k]); } }
        const o = align ? old[j0++] : old[j];
        return o ? Object.assign({}, o, { r }) : { r, kg: b.kg, t: null };
      });
    }
    const t = parseInt(fd.get('tot' + i), 10);
    let sum = (b.sets || []).reduce((a, s) => a + s.r, 0);
    if (!setsChanged && t > 0 && t !== sum && sum > 0) { b.sets = []; sum = 0; }   // total edited: old sets no longer add up
    b.total = setsChanged && sum > 0 ? sum : (t > 0 ? t : sum);
    b.done = !b.skipped && b.total > 0;
  });
  if (!base.blocks.some(b => b.done)) { toast('Vul bij minstens één oefening het aantal herhalingen in.'); return; }
  base.status = 'done'; base.paused = false; base.updatedAt = Date.now();
  if (isNew) { base.startedAt = parseYmd(base.date).getTime() + 12 * 3600e3; base.manual = true; }
  clearDraftFor(base.id);
  const ok = await saveSession(base);
  if (!ok) return;
  // Only the newest training of an exercise sets its planned weight.
  const pp = clone(myProfile()); pp.weights = pp.weights || {};
  let changed = false;
  for (const b of base.blocks) {
    if (!b.done) continue;
    const later = history(S.uid, b.ex).some(h => h.sid !== base.id && h.date > base.date);
    const o = orig && orig.blocks.find(x => x.slot === b.slot);
    const touched = !o || !o.done || o.ex !== b.ex || o.kg !== b.kg;
    if (!later && touched && pp.weights[b.ex] !== b.kg) { pp.weights[b.ex] = b.kg; changed = true; }
  }
  if (changed) saveProfile(pp);
  closeSheet(); toast('Opgeslagen.');
}

/* ------------------------------------------------------------------ *
 * Actions
 * ------------------------------------------------------------------ */
let confirmTimer = null;
function armConfirm(key, holder = UI) {
  holder.confirm = key;
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => {
    if (holder.confirm !== key) return;
    holder.confirm = null;
    if (holder === R) renderRunner(); else scheduleRender();
  }, 3500);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 4000);
}
function stepKg(kg, info, dir) {
  let next = Math.round(((Number(kg) || 0) + dir * (info.step || 2.5)) * 10) / 10;
  if (!info.bw) next = Math.max(0, next);
  return next;
}

const ACT = {
  tab(el) { UI.tab = el.dataset.tab; prefs.tab = UI.tab; savePrefs(); UI.confirm = null; render(); window.scrollTo(0, 0); },
  dismissNotice() { S.notice = ''; render(); },
  pickTpl(el) { UI.tpl = el.dataset.tpl; render(); },
  kg(el) {
    const p = clone(myProfile()); const key = el.dataset.ex; const info = exInfo(key, p);
    p.weights = p.weights || {};
    p.weights[key] = stepKg(plannedKg(p, key).kg, info, Number(el.dataset.dir));
    saveProfileSoon(p);
  },
  applyUp(el) { const p = clone(myProfile()); p.weights = p.weights || {}; p.weights[el.dataset.ex] = Number(el.dataset.kg); saveProfile(p); toast('Nieuw gewicht staat klaar.'); },
  startSession(el) { audio(); openRunner(false, el.dataset.tpl); },
  resume() { audio(); openRunner(true); },
  discardDraft() { if (UI.confirm !== 'discardDraft') { armConfirm('discardDraft'); render(); return; } UI.confirm = null; discardActive(); },
  manual() {
    const s = newSession(UI.tpl || templateFor(myProfile(), todayYmd())); s.status = 'done';
    UI.sheet = { session: s };
    openSheet(sessionForm(s, true), 'Training invoeren');
  },
  edit(el) { const s = me().sessions.get(el.dataset.id); if (!s) return; UI.sheet = { id: s.id }; openSheet(sessionForm(clone(s), false), 'Training bewerken'); },
  async finishOld(el) {
    const s = clone(me().sessions.get(el.dataset.id)); if (!s) return;
    clearDraftFor(s.id);
    s.status = 'done'; s.paused = false; s.updatedAt = Date.now();
    if (await saveSession(s)) toast('Gemarkeerd als klaar.');
  },
  async del(el) {
    const id = el.dataset.id;
    if (UI.confirm !== 'del:' + id) { armConfirm('del:' + id); render(); return; }
    UI.confirm = null; UI.histOpen.delete(id);
    clearDraftFor(id);
    if (await deleteSession(id)) toast('Training verwijderd.');
  },
  closeSheet() { closeSheet(); },
  person(el) { UI.person = el.dataset.id; render(); },
  viewPerson(el) { UI.person = el.dataset.id; UI.tab = 'progress'; render(); window.scrollTo(0, 0); },
  metric(el) { prefs.metric = el.dataset.m; savePrefs(); render(); },
  day(el) {
    const p = clone(myProfile()); const d = Number(el.dataset.d);
    if (p.days.includes(d)) p.days = p.days.filter(x => x !== d);
    else if (p.days.length < 3) p.days.push(d);
    else { toast('Je hebt al 3 dagen gekozen. Zet er eerst één uit.'); return; }
    saveProfile(p);
  },
  mode(el) { const p = clone(myProfile()); p.mode = el.dataset.mode; p.plans = Object.assign(clone(DEFAULT_PLANS), p.plans || {}); saveProfile(p); UI.tpl = null; },
  export(el) { exportData(el.dataset.fmt); },
  importPick() { const f = $('#importFile'); if (f) f.click(); },

  // runner
  go() {
    audio(); wakeOn();
    if (prefs.lead) { R.phase = 'lead'; R.leadEnd = Date.now() + LEAD_SEC * 1000; R.lastRem = null; saveDraft(); renderRunner(); startTick(); }
    else beginBlock();
  },
  goNow() { beginBlock(); },
  pause() { if (R.phase !== 'run') return; R.phase = 'paused'; R.pausedAt = Date.now(); stopTick(); saveDraft(); renderRunner(); },
  resumeClock() { if (R.phase !== 'paused') return; R.pausedMs += Date.now() - R.pausedAt; R.pausedAt = 0; R.phase = 'run'; wakeOn(); saveDraft(); renderRunner(); startTick(); markLive(); keepPadInView(); },
  endEarly() {
    if (R.confirm !== 'end') { armConfirm('end', R); renderRunner(); return; }
    R.confirm = null; endBlock(false);
  },
  set(el) {
    if (!(R.phase === 'run' || R.phase === 'paused' || R.phase === 'over')) return;
    const n = Number(el.dataset.n);
    const b = blk();
    b.sets.push({ r: n, t: Math.round(Math.min(BLOCK_SEC, elapsed())), kg: Number(b.kg) || 0 });
    b.total = b.sets.reduce((a, s) => a + s.r, 0);
    R.lastSet = n;
    buzz(25);
    saveDraft(); renderRunner(); keepPadInView();
    const t = $('#runner .total'); if (t) { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
  },
  undo() { const b = blk(); b.sets.pop(); b.total = b.sets.reduce((a, s) => a + s.r, 0); R.lastSet = b.sets.length ? b.sets[b.sets.length - 1].r : null; saveDraft(); renderRunner(); },
  runKg(el) {
    const b = blk();
    b.kg = stepKg(b.kg, exInfo(b.ex, myProfile()), Number(el.dataset.dir));
    saveDraft(); renderRunner();
  },
  skipBlock() { const b = blk(); b.skipped = true; b.done = false; advance(); },
  nextBlock() {
    const b = blk(); b.total = b.sets.reduce((a, s) => a + s.r, 0); b.done = b.total > 0; b.skipped = b.total === 0;
    if (b.sets.length) b.kg = workKg(b);
    R.session.updatedAt = Date.now();
    if (doneBlocks(R.session).length && !isTrial(R.session, S.uid)) saveSession(R.session, { quiet: true });
    advance();
  },
  toggleSound() { prefs.sound = !prefs.sound; savePrefs(); if (prefs.sound) { audio(); beep(880, 0.08); } renderRunner(); },
  runMenu() {
    if (R.phase === 'lead') { stopTick(); R.phase = 'ready'; R.lastRem = null; saveDraft(); }
    R.menuPaused = R.phase === 'run'; if (R.menuPaused) ACT.pause();
    R.confirm = 'menu'; R.confirm2 = null; renderRunner();
  },
  menuBack() {
    R.confirm = null;
    if (R.menuPaused && R.phase === 'paused') { R.menuPaused = false; ACT.resumeClock(); return; }
    R.menuPaused = false; renderRunner();
  },
  runClose() {
    if (R.phase === 'run') { R.phase = 'paused'; R.pausedAt = Date.now(); }
    if (R.phase === 'lead') R.phase = 'ready';
    saveDraft();
    if (me().sessions.has(R.session.id)) saveSession(Object.assign(clone(R.session), { paused: true, updatedAt: Date.now() }), { quiet: true });
    closeRunner();
    toast('Training gepauzeerd. Tik op "Ga verder" om door te gaan.');
  },
  stopSave() {
    const b = blk();
    if (b.sets.length && !b.done) { b.total = b.sets.reduce((a, s) => a + s.r, 0); b.done = true; b.kg = workKg(b); b.dur = Math.round(Math.min(BLOCK_SEC, elapsed())); b.cut = b.dur < BLOCK_SEC - 1; }
    if (!doneBlocks(R.session).length) { toast('Er is nog niets om op te slaan.'); return; }
    R.session.blocks.forEach(x => { if (!x.done) x.skipped = true; });
    R.phase = 'finish'; R.confirm = null; R.menuPaused = false; stopTick(); wakeOff(); saveDraft(); renderRunner();
    const h = $('#runner h2'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  },
  discardRun() {
    if (R.confirm2 !== 'discard') { R.confirm2 = 'discard'; renderRunner(); return; }
    discardActive();
  },
  discardEmpty() { discardActive(); },
  feel(el) { R.session.feel = Number(el.dataset.v); const n = $('#runNote'); if (n) R.session.note = n.value; saveDraft(); renderRunner(); },
  saveSession() { finishAndSave(); },
};
function advance() {
  if (R.idx < R.session.blocks.length - 1) {
    R.idx++; R.phase = 'ready'; R.t0 = 0; R.pausedMs = 0; R.pausedAt = 0; R.lastSet = null; R.confirm = null;
  } else {
    R.phase = 'finish'; wakeOff();
  }
  stopTick(); saveDraft(); renderRunner();
  $('#runner').scrollTo(0, 0);
  const h = $('#runner .ex-name') || $('#runner h2');
  if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({ preventScroll: true }); } catch { /* ignore */ } }
}
async function discardActive() {
  const d = loadDraft();
  const id = R.session?.id || d?.session?.id;
  const stored = id ? me().sessions.get(id) : null;
  // Only an unfinished copy is ours to delete; a finished one stays.
  if (stored && stored.status !== 'done' && !(await deleteSession(id))) return;
  LS.del(DRAFT_KEY());
  if (R.session) closeRunner();
  toast('Training weggegooid.');
  scheduleRender();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#sheet').hidden) closeSheet();
  else if (R.session && R.confirm === 'menu') ACT.menuBack();
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.hist) { if (d.open) UI.histOpen.add(d.dataset.hist); else UI.histOpen.delete(d.dataset.hist); }
}, true);
let noteTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'runNote' && R.session) { R.session.note = e.target.value.slice(0, 400); clearTimeout(noteTimer); noteTimer = setTimeout(saveDraft, 400); }
});
document.addEventListener('submit', async e => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.form === 'join') {
    const inp = $('#joinNick');
    const nick = (inp?.value || '').trim().slice(0, 30);
    if (inp) inp.blur();
    const btn = f.querySelector('button[type="submit"]');
    if (btn) { if (btn.disabled) return; btn.disabled = true; }
    // Never overwrite a profile that exists but has not arrived yet.
    if (S.mode === 'shared' && !S.ownLocal) {
      let ex;
      try { ex = await S.db.doc('members/' + S.uid).get(); }
      catch { if (btn) btn.disabled = false; toast('Je profiel kon niet worden gecontroleerd. Probeer het zo opnieuw.'); return; }
      if (ex.exists) { me().profile = normProfile(ex.data()); if (btn) btn.disabled = false; render(); return; }
    }
    const dev = S.mode === 'shared' ? readOwnLocal() : null;
    const ok = await saveProfile(dev && dev.profile ? Object.assign(dev.profile, nick ? { nick } : {}) : defaultProfile(nick));
    if (btn) btn.disabled = false;
    render();
    { const t = $('.tab[aria-selected="true"]'); if (t) t.focus({ preventScroll: true }); }
    if (ok) toast(nick ? `Welkom, ${nick}!` : 'Welkom!');
  }
  if (f.dataset.form === 'session') submitSessionForm(f);
  if (f.dataset.form === 'custom') submitCustom(f);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') { importData(el.files && el.files[0]); el.value = ''; return; }
  if (el.form && el.form.dataset.form === 'session' && /^ex\d$/.test(el.name || '')) {
    // Switching exercise: show the weight field in the new exercise's unit.
    const inp = el.form.querySelector('#kg' + el.name.slice(2));
    const info = exInfo(el.value, myProfile());
    const n = parseKg(inp.value);
    const total = (Number.isFinite(n) ? n : 0) * (inp.dataset.dbl === '1' ? 2 : 1);
    const wasBw = inp.closest('label').querySelector('.kglbl').textContent.startsWith('Extra');
    const kg = !!info.bw !== wasBw ? Number(plannedKg(myProfile(), el.value).kg) || 0 : total;
    inp.value = String(info.dbl ? kg / 2 : kg).replace('.', ',');
    inp.dataset.dbl = info.dbl ? '1' : '0';
    inp.closest('label').querySelector('.kglbl').textContent = kgFieldLabel(info);
    return;
  }
  const field = el.dataset.field;
  if (!field) return;
  if (field === 'sound' || field === 'lead') { prefs[field] = el.checked; savePrefs(); return; }
  const p = clone(myProfile());
  if (!p) return;
  if (field === 'nick') { p.nick = el.value.trim().slice(0, 30); saveProfile(p); }
  if (field === 'start') {
    if (DATE_RE.test(el.value) && el.value >= '2020-01-01' && el.value <= '2099-12-31') { p.start = el.value; saveProfileSoon(p); }
  }
  if (field === 'plan') {
    const { tpl, slot } = el.dataset;
    if (el.value === '__new') { el.value = planFor(p, tpl)[slot]; addCustomExercise(tpl, slot); return; }
    p.plans[tpl] = Object.assign({}, planFor(p, tpl), { [slot]: el.value });
    saveProfile(p);
  }
});

function addCustomExercise(tpl, slot) {
  openSheet(`<form data-form="custom" style="display:grid;gap:14px">
    <div class="sheet-head"><b class="h2 grow">Eigen oefening</b><button type="button" class="iconbtn" data-act="closeSheet" aria-label="Sluiten">${CLOSE_ICON}</button></div>
    <div class="row"><span class="chip ${slot}">${SLOT[slot].label}</span><span class="small">voor training ${esc(tpl)}</span></div>
    <label class="f" for="cName">Naam<input type="text" id="cName" name="name" maxlength="40" required placeholder="bijv. Smith machine squat"></label>
    <div class="row">
      <label class="f grow" for="cStart">Startgewicht (kg)<input type="text" id="cStart" name="start" inputmode="decimal" value="${slot === 'legs' ? 40 : 20}"></label>
      <label class="f grow" for="cStep">Stap (kg)<input type="text" id="cStep" name="step" inputmode="decimal" value="${slot === 'legs' ? '5' : '2,5'}"></label>
    </div>
    <label class="row" for="cDbl"><input type="checkbox" id="cDbl" name="dbl"> <span>Met twee dumbbells (gewicht per dumbbell)</span></label>
    <label class="row" for="cBw"><input type="checkbox" id="cBw" name="bw"> <span>Met lichaamsgewicht (gewicht = extra kg)</span></label>
    <input type="hidden" name="tpl" value="${esc(tpl)}"><input type="hidden" name="slot" value="${esc(slot)}">
    <button class="btn big primary" type="submit">Toevoegen</button>
  </form>`, 'Eigen oefening');
}
function submitCustom(f) {
  const fd = new FormData(f);
  const name = String(fd.get('name') || '').trim().slice(0, 40);
  if (!name) return;
  const p = clone(myProfile());
  const slot = String(fd.get('slot')), tpl = String(fd.get('tpl'));
  if (!Object.hasOwn(SLOT, slot) || !['A', 'B', 'C'].includes(tpl)) return;
  let k = 'c-' + slug(name);
  while (allExercises(p).some(x => x.k === k)) k += '-2';
  const bw = !!fd.get('bw'), dbl = !bw && !!fd.get('dbl');
  const st = parseKg(fd.get('start')), sp = parseKg(fd.get('step'));
  if (!Number.isFinite(sp) || (!bw && !Number.isFinite(st))) { toast('Vul het gewicht in als getal, bijvoorbeeld 14 of 12,5.'); return; }
  const step = Math.max(0.5, sp || 2.5) * (dbl ? 2 : 1);
  const start = bw ? 0 : Math.max(0, st) * (dbl ? 2 : 1);
  p.custom = (p.custom || []).concat([{ k, n: name, s: slot, step, start, bw, dbl }]);
  p.plans[tpl] = Object.assign({}, planFor(p, tpl), { [slot]: k });
  saveProfile(p); closeSheet(); toast('Oefening toegevoegd.');
}

/* ------------------------------------------------------------------ *
 * Export / import
 * ------------------------------------------------------------------ */
function csvCell(v) { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function exportData(fmt) {
  const p = myProfile();
  const sessions = sessionsOf(S.uid);
  let filename, data;
  if (fmt === 'csv') {
    const rows = [['datum', 'week', 'training', 'blok', 'oefening', 'kg', 'herhalingen', 'score_kg', 'sets', 'ingekort', 'gevoel', 'notitie']];
    for (const s of sessions) for (const b of s.blocks || []) {
      if (!b.done || b.skipped) continue;
      const info = exInfo(b.ex, p);
      rows.push([s.date, isTrial(s, S.uid) ? 'proef' : weekNo(s.date, p?.start || START), s.tpl || 'A', SLOT[b.slot]?.label, b.name || info.n,
        String(b.kg).replace('.', ','), b.total, String(Math.round(blockVolume(b) * 10) / 10).replace('.', ','),
        setsText(b, info).replace(/ · /g, ' '), b.cut ? 'ja' : '', FEEL[(s.feel || 0) - 1] || '', s.note || '']);
    }
    data = '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
    filename = '3-3-30-trainingen.csv';
  } else {
    data = JSON.stringify({ app: '3-3-30-logboek', v: 1, exported: new Date().toISOString(), profile: p, sessions }, null, 1);
    filename = '3-3-30-backup-' + todayYmd() + '.json';
  }
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('Bestand klaar.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try { await navigator.clipboard.writeText(data); toast('Opslaan als bestand lukt hier niet. De gegevens staan op je klembord.'); }
  catch {
    openSheet(`<div class="sheet-head"><b class="h2 grow">Kopieer je gegevens</b><button class="iconbtn" data-act="closeSheet" aria-label="Sluiten">${CLOSE_ICON}</button></div><textarea id="copyOut" readonly style="min-height:260px;font-size:12px">${esc(data)}</textarea>`, 'Gegevens kopiëren');
    const ta = $('#copyOut'); if (ta) ta.select();
  }
}
async function importData(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('Dit bestand is te groot voor een backup van deze app.'); return; }
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { toast('Dit bestand kan ik niet lezen. Kies een .json-backup van deze app.'); return; }
  if (!obj || obj.app !== '3-3-30-logboek' || !Array.isArray(obj.sessions)) { toast('Dit is geen backup van het 3-3-30 Logboek.'); return; }
  const incoming = normProfile(obj.profile);
  const cur0 = myProfile();
  // A fresh logbook takes over the backup's schema, start date and weights.
  if (incoming && (!cur0 || !trainings(S.uid).length)) await saveProfile(Object.assign(incoming, cur0 && cur0.nick ? { nick: cur0.nick } : {}));
  else if (incoming) {
    const cur = clone(myProfile());
    const add = incoming.custom.filter(c => !allExercises(cur).some(e => e.k === c.k));
    const back = incoming.start < cur.start;
    if (add.length || back) await saveProfile(Object.assign(cur, { custom: (cur.custom || []).concat(add) }, back ? { start: incoming.start } : {}));
  }
  let n = 0, bad = 0, failed = 0;
  for (const raw of obj.sessions) {
    const s = normSession(raw);
    if (!s || !s.blocks.length || JSON.stringify(s).length > 200 * 1024) { bad++; continue; }
    if (me().sessions.has(s.id)) continue;
    if (await saveSession(s, { quiet: true })) n++;
    else { failed++; me().sessions.delete(s.id); }
  }
  scheduleRender();
  if (failed) { toast(`${failed === 1 ? '1 training kon' : failed + ' trainingen konden'} niet worden opgeslagen. Probeer het terugzetten zo opnieuw.`); return; }
  toast((n ? `${n} training${n === 1 ? '' : 'en'} teruggezet.` : 'Alle trainingen uit deze backup stonden er al.') + (bad ? ` ${bad} onleesbare overgeslagen.` : ''));
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
initStore().then(maybeReopen);
render();
</script>
