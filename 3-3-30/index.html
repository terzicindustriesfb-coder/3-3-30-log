<title>3-3-30 Logboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: one phone-width column (max 560px), sticky header, fixed bottom tab bar,
   full-screen "runner" overlay for the live 10-minute blocks. Slot colours follow
   the Olympic plate code: red = push, blue = pull, yellow = legs, green = done. */
:root {
  --bg: #EDEFF1;
  --surface: #FBFBFC;
  --surface-2: #E3E6EA;
  --ink: #14181D;
  --ink-2: #48505A;
  --muted: #6E7781;
  --line: #D3D8DE;
  --push: #C8372B;
  --pull: #2456C2;
  --legs: #E7B416;
  --legs-mark: #B07F00;
  --on-push: #FFFFFF;
  --on-pull: #FFFFFF;
  --on-legs: #1D1600;
  --good: #1D7F47;
  --good-wash: #DCEFE3;
  --warn: #9A5B00;
  --warn-wash: #F6E8CF;
  --bad: #B3261E;
  --primary: #14181D;
  --on-primary: #FBFBFC;
  --clock-bg: #0B0D10;
  --led-on: #FF3B24;
  --led-off: #2A1210;
  --led-lead: #FFB020;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --r-sm: 9px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1114; --surface: #171B20; --surface-2: #222830; --ink: #E8EBEE; --ink-2: #AEB6BF;
    --muted: #8A939D; --line: #2B323A; --push: #E0503F; --pull: #4F7FE6; --legs: #F1C63A;
    --legs-mark: #B88A0C; --on-push: #FFFFFF; --on-pull: #FFFFFF; --on-legs: #1D1600;
    --good: #46B977; --good-wash: #16301F; --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C;
    --primary: #E8EBEE; --on-primary: #0E1114; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1114; --surface: #171B20; --surface-2: #222830; --ink: #E8EBEE; --ink-2: #AEB6BF;
  --muted: #8A939D; --line: #2B323A; --push: #E0503F; --pull: #4F7FE6; --legs: #F1C63A;
  --legs-mark: #B88A0C; --on-push: #FFFFFF; --on-pull: #FFFFFF; --on-legs: #1D1600;
  --good: #46B977; --good-wash: #16301F; --warn: #E2A646; --warn-wash: #33260F; --bad: #F2675C;
  --primary: #E8EBEE; --on-primary: #0E1114; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pull); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 12px;
  padding-block: 12px; background: var(--bg); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
.brand .mark { font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: .01em; line-height: 1; }
.brand .mark i { font-style: normal; color: var(--push); }
.brand .sub { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.on .dot { background: var(--good); }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-weight: 700; font-size: 14px;
  color: #fff; background: var(--ink-2); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 8px 4px 10px; display: grid; justify-items: center; gap: 2px; color: var(--muted);
  font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] svg { color: var(--push); }

/* Generic blocks */
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.h-display { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: .005em; }
.h2 { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; }
.lead { color: var(--ink-2); }
.small { font-size: 14px; color: var(--ink-2); }
.tiny { font-size: 12px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.right { margin-left: auto; }
.num { font-variant-numeric: tabular-nums; }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; min-height: 48px; background: var(--surface-2); color: var(--ink); text-decoration: none; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.big { min-height: 60px; font-size: 19px; width: 100%; font-family: var(--display); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.link { background: none; padding: 6px 4px; min-height: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.btn.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.good { background: var(--good); color: #fff; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; line-height: 1.3; }
.chip.push { background: var(--push); color: var(--on-push); }
.chip.pull { background: var(--pull); color: var(--on-pull); }
.chip.legs { background: var(--legs); color: var(--on-legs); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-wash); color: var(--good); }
.pill.warn { background: var(--warn-wash); color: var(--warn); }
.pill.live { background: var(--push); color: #fff; }

.notice { border-radius: var(--r); padding: 12px 14px; background: var(--warn-wash); color: var(--ink); font-size: 14px; display: grid; gap: 6px; margin-bottom: 14px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wday { border-radius: 12px; border: 1.5px dashed var(--line); padding: 8px 10px; display: grid; gap: 0; min-width: 0; }
.wday b { font-family: var(--display); font-size: 20px; font-weight: 800; line-height: 1.1; }
.wday span { font-size: 12px; color: var(--muted); font-weight: 600; }
.wday.done { border: 1.5px solid var(--good); background: var(--good-wash); }
.wday.done span { color: var(--good); }
.wday.next { border-style: solid; border-color: var(--ink); }

/* Plan rows (today's three blocks) */
.blocks { display: grid; gap: 0; }
.blk { display: grid; grid-template-columns: 6px 1fr; gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); }
.blk:first-child { border-top: 0; padding-top: 2px; }
.blk .bar { border-radius: 3px; }
.blk.push .bar { background: var(--push); }
.blk.pull .bar { background: var(--pull); }
.blk.legs .bar { background: var(--legs); }
.blk-main { display: grid; gap: 6px; min-width: 0; }
.blk-name { font-weight: 700; font-size: 18px; line-height: 1.2; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper button { width: 40px; height: 38px; border: 0; background: var(--surface-2); font-size: 20px; font-weight: 700; display: grid; place-items: center; }
.stepper .val { min-width: 88px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; padding-inline: 6px; font-size: 15px; }
.stepper .val.tbd { color: var(--muted); font-weight: 600; }
.tipline { font-size: 14px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.tipline b { color: var(--ink); }
.up { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--good-wash); color: var(--good); border-radius: 10px;
  padding: 8px 10px; font-size: 14px; font-weight: 600; }
.up .btn { background: var(--good); color: #fff; }
.tabsel { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.tabsel button { border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.tabsel button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

/* Stats */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile .val { font-family: var(--body); font-weight: 700; font-size: 28px; line-height: 1.1; }
.tile .val small { font-size: 15px; font-weight: 600; color: var(--muted); }

/* Charts */
.chart-wrap { position: relative; }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart text { font-family: var(--body); fill: var(--muted); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .xh { stroke: var(--ink-2); stroke-width: 1; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 9px;
  font-size: 12px; line-height: 1.35; white-space: nowrap; transform: translateX(-50%); box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
.tip strong { font-size: 15px; display: block; }
.ex-card-head { display: flex; align-items: flex-start; gap: 10px; }
.ex-card-head .grow { display: grid; gap: 2px; }
.delta { font-weight: 700; font-size: 14px; white-space: nowrap; }
.delta.pos { color: var(--good); }
.delta.neg { color: var(--bad); }
.example-tag { position: absolute; top: 4px; right: 4px; }
.faded { opacity: .45; }

/* Adherence grid */
.adh { display: grid; gap: 6px; }
.adh-row { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.adh-row .lbl { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.adh-cells { display: flex; gap: 4px; }
.adh-cells i { width: 26px; height: 18px; border-radius: 4px; background: var(--surface-2); display: block; }
.adh-cells i.on { background: var(--good); }
.adh-cells i.cur { outline: 1.5px dashed var(--line); outline-offset: -1.5px; background: transparent; }

/* History */
.hist { display: grid; gap: 0; }
.hist details { border-top: 1px solid var(--line); }
.hist details:first-child { border-top: 0; }
.hist summary { list-style: none; cursor: pointer; padding-block: 12px; display: flex; align-items: center; gap: 10px; }
.hist summary::-webkit-details-marker { display: none; }
.hist summary .chev { transition: transform .15s; color: var(--muted); }
.hist details[open] summary .chev { transform: rotate(90deg); }
.hist .body { padding: 0 0 14px; display: grid; gap: 8px; }
.hist .line { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; font-size: 14px; }
.hist .sets { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; grid-column: 2 / 4; }

/* Team */
.member { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding-block: 12px; border-top: 1px solid var(--line); }
.member:first-child { border-top: 0; padding-top: 0; }
.mdots { display: inline-flex; gap: 4px; }
.mdots i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--line); display: block; }
.mdots i.on { background: var(--good); border-color: var(--good); }

/* Forms */
label.f { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 44px; font-size: 16px; }
textarea { min-height: 72px; resize: vertical; }
.daypick { display: flex; flex-wrap: wrap; gap: 6px; }
.daypick button { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.daypick button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.method ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.method li { padding-left: 2px; }
.method h3 { font-size: 16px; font-weight: 700; }
.bignums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.bignums div { display: grid; }
.bignums b { font-family: var(--display); font-size: 56px; font-weight: 900; line-height: .95; }
.bignums div:nth-child(1) b { color: var(--push); }
.bignums div:nth-child(2) b { color: var(--pull); }
.bignums div:nth-child(3) b { color: var(--legs-mark); }
.bignums span { font-size: 13px; color: var(--ink-2); font-weight: 600; }

/* Runner (live training) */
.runner { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.run-in { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 28px; display: grid; gap: 14px; }
.run-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps i { height: 6px; border-radius: 3px; background: var(--surface-2); display: block; }
.steps i.done.push, .steps i.cur.push { background: var(--push); }
.steps i.done.pull, .steps i.cur.pull { background: var(--pull); }
.steps i.done.legs, .steps i.cur.legs { background: var(--legs); }
.steps i.cur { opacity: .55; }
.ex-name { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: .98; letter-spacing: .005em; }
.clock { background: var(--clock-bg); border-radius: 18px; padding: 18px 16px 14px; display: grid; gap: 10px; justify-items: center; color: #9AA3AD; }
.clock svg.led { width: min(100%, 360px); height: auto; display: block; }
.led .seg { fill: var(--led-off); }
.led .seg.on { fill: var(--led-on); }
.led.lead .seg.on { fill: var(--led-lead); }
.led .colon { fill: var(--led-on); }
.led.lead .colon { fill: var(--led-lead); }
.led.paused { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { opacity: .35; } }
.clock .status { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: #C9D0D7; }
.clock .prog { width: 100%; height: 4px; border-radius: 2px; background: #22272E; overflow: hidden; }
.clock .prog b { display: block; height: 100%; background: var(--led-on); width: 0; }
.run-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.run-ctrl .wide { grid-column: 1 / -1; }
.score { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: end; }
.score .total { font-family: var(--display); font-weight: 900; font-size: 72px; line-height: .85; font-variant-numeric: tabular-nums; }
.score .unit { font-weight: 700; color: var(--muted); font-size: 15px; padding-bottom: 6px; display: grid; gap: 2px; }
.score .cmp { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 14px; color: var(--ink-2); }
.pad-head { display: flex; align-items: baseline; gap: 10px; }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pad button { min-height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--display);
  font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }
.pad button.last { border: 2px solid var(--ink); }
.pad button:active { transform: scale(.96); background: var(--surface-2); }
.pad.off { opacity: .4; pointer-events: none; }
.setlist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 32px; }
.setlist span { background: var(--surface-2); border-radius: 7px; padding: 2px 9px; font-weight: 700; font-variant-numeric: tabular-nums; }
.flash { animation: flash .5s ease-out; }
@keyframes flash { from { background: var(--good-wash); } to { background: transparent; } }
.result { border-radius: var(--r); padding: 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; }
.result.pr { border-color: var(--good); background: var(--good-wash); }
.feel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.feel button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.feel button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.sum-row { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; padding-block: 8px; }
.sum-row .bar { align-self: stretch; border-radius: 3px; }
.sum-row.push .bar { background: var(--push); }
.sum-row.pull .bar { background: var(--pull); }
.sum-row.legs .bar { background: var(--legs); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 70; background: rgb(8 10 12 / .55); display: grid; align-items: end; justify-items: center; }
.sheet-panel { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0;
  padding-inline: 16px; padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgb(0 0 0 / .25); }

.skeleton { color: var(--muted); padding-block: 40px; text-align: center; }
.empty { display: grid; gap: 8px; justify-items: start; }

@media (min-width: 420px) { .tiles { grid-template-columns: repeat(4, 1fr); } .tile .val { font-size: 26px; } }
@media (max-width: 360px) { .pad { grid-template-columns: repeat(4, 1fr); } .ex-name { font-size: 34px; } .score .total { font-size: 60px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="mark">3<i>·</i>3<i>·</i>30</span><span class="sub" id="weekLabel"></span></div>
    <span class="sync" id="sync"><span class="dot"></span><span id="syncText">Verbinden…</span></span>
    <span class="avatar" id="meAvatar" aria-hidden="true"></span>
  </header>
  <div id="notice"></div>
  <main id="main">
    <section id="view-train" class="view stack"><div class="skeleton">Je logboek wordt geladen…</div></section>
    <section id="view-progress" class="view stack" hidden></section>
    <section id="view-team" class="view stack" hidden></section>
    <section id="view-plan" class="view stack" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Onderdelen">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" data-act="tab" data-tab="train" aria-selected="true">

<script>

const SLOT_ORDER = ['push', 'pull', 'legs'];

/* Gym exercise library. step = weight jump in kg, start = suggested first weight.

const DB2 = 'Noteer het totaal van beide dumbbells.';
const LIB = [

  { k: 'schouderdrukken', n: 'Schouderdrukken (barbell, staand)', s: 'push', step: 2.5, start: 25, tip: 'Houd je onderrug neutraal, ook als je moe wordt.' },
  { k: 'dips', n: 'Dips', s: 'push', bw: true, step: 2.5, start: 0, tip: 'Niet dieper zakken dan prettig voelt voor je schouders.' },

  { k: 'leg-press', n: 'Leg press', s: 'legs', step: 10, start: 80 },
  { k: 'squat', n: 'Squat (barbell)', s: 'legs', step: 5, start: 40, tip: 'Alleen met safety-pins. Techniek gaat voor aantal.' },
  { k: 'trapbar', n: 'Trap-bar deadlift', s: 'legs', step: 5, start: 50, tip: 'Elke herhaling vanaf de vloer. Stop als je rug rond wordt.' },
  { k: 'deadlift', n: 'Deadlift', s: 'legs', step: 5, start: 50, tip: 'Zwaarste keuze voor 10 minuten: kies ruim licht, kleine sets, en stop als je rug rond wordt.' },
  { k: 'rdl', n: 'Roemeense deadlift (barbell)', s: 'legs', step: 5, start: 40, tip: 'Stop als je rug rond wordt.' },
  { k: 'bulgaarse', n: 'Bulgaarse split squat', s: 'legs', step: 4, start: 16, tip: 'Tel beide benen bij elkaar. ' + DB2 },
];
const DEFAULT_MODE = 'abc';
/* The article's example week (Mon/Wed/Fri). */
const DEFAULT_PLANS = {
  A: { push: 'db-bankdrukken', pull: 'borst-roeien', legs: 'goblet-squat' },
  B: { push: 'db-schouderdrukken', pull: 'optrekken', legs: 'db-rdl' },
  C: { push: 'schuin-db', pull: 'pendlay', legs: 'reverse-lunge' },
};
const CYCLE_WEEKS = 4;

/* ------------------------------------------------------------------ *
 * Small helpers
 * ------------------------------------------------------------------ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const todayYmd = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const mondayOf = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const weekNo = (s, start) => Math.floor(daysBetween(mondayOf(start), mondayOf(s)) / 7) + 1;
const cycleWeek = (s, start) => { const n = Math.max(1, weekNo(s, start)); return { round: Math.ceil(n / CYCLE_WEEKS), w: ((n - 1) % CYCLE_WEEKS) + 1 }; };
const fmtLong = s => parseYmd(s).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => parseYmd(s).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtDM = s => parseYmd(s).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
const fmtNum = n => Number(n || 0).toLocaleString('nl-NL', { maximumFractionDigits: 1 });
const WD = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const uidGen = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'oefening';

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
};
const prefs = Object.assign({ sound: true, lead: true, metric: 'vol', tab: 'train' }, LS.get('d330.prefs', {}));
const savePrefs = () => LS.set('d330.prefs', prefs);

/* ------------------------------------------------------------------ *
 * Store: shared db (members/<uid> + members/<uid>/sessions/<id>) with a
 * localStorage fallback when the shared logbook is unavailable or read-only.
 * ------------------------------------------------------------------ */
const S = {
  mode: 'loading',          // 'shared' | 'local'
  ownLocal: false,          // own data lives in localStorage (no write access)
  uid: null, db: null, user: null,
  members: new Map(),       // uid -> { profile, sessions: Map }
  subs: new Map(),
  loaded: false,
  people: {},               // uid -> resolved Profile (name, avatarUrl, color)
  meInfo: null,
  notice: '',
};
const LKEY = () => 'd330.own.' + (S.uid || 'local');

function member(id) {
  if (!S.members.has(id)) S.members.set(id, { profile: null, sessions: new Map() });
  return S.members.get(id);
}
const me = () => member(S.uid);
const myProfile = () => me().profile;

function loadOwnLocal() {
  const raw = LS.get(LKEY(), null);
  const m = me();
  if (raw) {
    m.profile = raw.profile || m.profile;
    m.sessions = new Map(Object.entries(raw.sessions || {}));
  }
}
function saveOwnLocal() {
  const m = me();
  LS.set(LKEY(), { profile: m.profile, sessions: Object.fromEntries(m.sessions) });
}

async function initStore() {
  let db = null, user = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (user) uid = await user.id();
    }
  } catch { db = null; }
  S.user = user;
  if (user) {
    try { S.meInfo = await user.me(); } catch { /* ignore */ }
  }
  if (db && uid) {
    S.mode = 'shared'; S.db = db; S.uid = uid;
    let canWrite = null;
    try { canWrite = await user.can('data.write'); } catch { canWrite = null; }
    member(uid);
    if (canWrite === false) useOwnLocal('Je kunt in dit gedeelde logboek alleen meekijken. Je eigen trainingen worden daarom op dit toestel bewaard. Vraag de eigenaar om je als bewerker uit te nodigen, dan komen ze in het gedeelde logboek.');
    subscribeMembers();
    if (!S.ownLocal) subscribeSessions(uid);
    setTimeout(() => { if (!S.loaded) { S.loaded = true; scheduleRender(); } }, 7000);
  } else {
    S.mode = 'local'; S.uid = 'local'; S.ownLocal = true;
    loadOwnLocal();
    S.loaded = true;
  }
  scheduleRender();
}

function useOwnLocal(reason) {
  S.ownLocal = true;
  S.notice = reason || S.notice;
  const unsub = S.subs.get('s:' + S.uid);
  if (unsub) { try { unsub(); } catch { /* ignore */ } S.subs.delete('s:' + S.uid); }
  const m = me();
  const keep = { profile: m.profile, sessions: new Map(m.sessions) };
  loadOwnLocal();
  if (!m.profile) m.profile = keep.profile;
  for (const [id, s] of keep.sessions) if (!m.sessions.has(id)) m.sessions.set(id, s);
  saveOwnLocal();
  scheduleRender();
}

function subscribeMembers() {
  const unsub = S.db.collection('members').onSnapshot(snap => {
    const seen = new Set();
    for (const d of snap.docs) {
      seen.add(d.id);
      if (d.id === S.uid && S.ownLocal) continue;
      member(d.id).profile = d.data() || null;
      if (d.id !== S.uid) subscribeSessions(d.id);
    }
    for (const id of [...S.members.keys()]) {
      if (id !== S.uid && !seen.has(id)) {
        const u = S.subs.get('s:' + id); if (u) { try { u(); } catch { /* ignore */ } S.subs.delete('s:' + id); }
        S.members.delete(id);
      }
    }
    if (!snap.metadata.fromCache) S.loaded = true;
    resolvePeople();
    scheduleRender();
  }, err => {
    S.notice = 'Het gedeelde logboek is nu niet bereikbaar. Herlaad de pagina om het opnieuw te proberen.';
    S.loaded = true; scheduleRender();
  });
  S.subs.set('members', unsub);
}

function subscribeSessions(id) {
  const key = 's:' + id;
  if (S.subs.has(key)) return;
  const unsub = S.db.collection('members/' + id + '/sessions').onSnapshot(snap => {
    if (id === S.uid && S.ownLocal) return;
    const m = member(id);
    m.sessions = new Map(snap.docs.map(d => [d.id, d.data()]));
    scheduleRender();
  }, () => { S.subs.delete(key); });
  S.subs.set(key, unsub);
}

async function resolvePeople() {
  if (!S.user || S.mode !== 'shared') return;
  try {
    const ids = [...S.members.keys()];
    const ps = await S.user.profiles(ids);
    let changed = false;
    for (const id of ids) {
      const p = ps[id]; if (!p) continue;
      const prev = S.people[id];
      if (!prev || prev.name !== p.name || prev.avatarUrl !== p.avatarUrl) changed = true;
      S.people[id] = p;
    }
    if (changed) scheduleRender();
  } catch { /* ignore */ }
}

/* One write at a time per document. */
const wq = new Map();
function queueWrite(path, fn) {
  const prev = wq.get(path) || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);
  wq.set(path, p);
  p.finally(() => { if (wq.get(path) === p) wq.delete(path); }).catch(() => {});
  return p;
}
async function dbWrite(path, data, del) {
  return queueWrite(path, async () => {
    const ref = S.db.doc(path);
    try { del ? await ref.delete() : await ref.set(data); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(500 + Math.random() * 1000); del ? await ref.delete() : await ref.set(data); }
      else throw e;
    }
  });
}
function handleWriteError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') {
    useOwnLocal('Opslaan in het gedeelde logboek lukt niet met jouw rechten. Je trainingen worden voortaan op dit toestel bewaard. Vraag de eigenaar om je als bewerker uit te nodigen.');
    return true;
  }
  if (code === 'quota_exceeded') { toast('Het logboek is vol. Exporteer een backup en verwijder oude trainingen.'); return false; }
  toast('Opslaan lukte niet. Probeer het zo nog eens.');
  return false;
}

async function saveProfile(p) {
  const clean = clone(p);
  me().profile = clean;
  scheduleRender();
  if (S.ownLocal) { saveOwnLocal(); return true; }
  try { await dbWrite('members/' + S.uid, clean); return true; }
  catch (e) { if (handleWriteError(e)) { me().profile = clean; saveOwnLocal(); return true; } return false; }
}
let profileTimer = null;
function saveProfileSoon(p) {
  me().profile = clone(p);
  scheduleRender();
  clearTimeout(profileTimer);
  profileTimer = setTimeout(() => saveProfile(me().profile), 700);
}
async function saveSession(s) {
  const clean = clone(s);
  me().sessions.set(clean.id, clean);
  scheduleRender();
  if (S.ownLocal) { saveOwnLocal(); return true; }
  try { await dbWrite('members/' + S.uid + '/sessions/' + clean.id, clean); return true; }
  catch (e) {
    if (handleWriteError(e)) { me().sessions.set(clean.id, clean); saveOwnLocal(); return true; }
    return false;
  }
}
async function deleteSession(id) {
  me().sessions.delete(id);
  scheduleRender();
  if (S.ownLocal) { saveOwnLocal(); return true; }
  try { await dbWrite('members/' + S.uid + '/sessions/' + id, null, true); return true; }
  catch (e) { handleWriteError(e); return false; }
}

/* ------------------------------------------------------------------ *
 * Domain logic
 * ------------------------------------------------------------------ */
function defaultProfile(nick) {
  return { v: 1, nick: nick || '', joined: Date.now(), start: START, days: [1, 3, 5], mode: DEFAULT_MODE,
    plans: clone(DEFAULT_PLANS), custom: [], weights: {} };
}
function exInfo(key, profile) {
  return LIB.find(e => e.k === key) || (profile?.custom || []).find(e => e.k === key)
    || { k: key, n: key, s: 'push', step: 2.5, start: 0 };
}
function allExercises(profile) { return LIB.concat(profile?.custom || []); }
function exName(key, profile, fallback) {
  const lib = LIB.find(e => e.k === key) || (profile?.custom || []).find(e => e.k === key);
  return lib ? lib.n : (fallback || key);
}
function displayName(id) {
  const p = S.members.get(id)?.profile;
  if (p?.nick) return p.nick;
  const r = S.people[id];
  if (r?.name) return r.name;
  if (id === S.uid) return S.meInfo?.name || 'Jij';
  return 'Maatje';
}
function avatarHtml(id, size) {
  const r = S.people[id] || (id === S.uid ? S.meInfo : null);
  const name = displayName(id);
  const st = size ? ` style="width:${size}px;height:${size}px"` : '';
  if (r?.avatarUrl && !(S.members.get(id)?.profile?.nick && !r.name)) {
    return `<span class="avatar"${st}><img src="${esc(r.avatarUrl)}" alt=""></span>`;
  }
  const bg = r?.color || 'var(--ink-2)';
  return `<span class="avatar" style="${size ? `width:${size}px;height:${size}px;` : ''}background:${esc(bg)}">${esc(name.trim().charAt(0).toUpperCase() || '?')}</span>`;
}

function sessionsOf(id) {
  const m = S.members.get(id);
  if (!m) return [];
  return [...m.sessions.values()]
    .filter(s => s && Array.isArray(s.blocks))
    .sort((a, b) => (a.date === b.date ? (a.startedAt || 0) - (b.startedAt || 0) : a.date < b.date ? -1 : 1));
}
const doneBlocks = s => (s.blocks || []).filter(b => b.done && !b.skipped && b.total > 0);
const countsAsTraining = s => doneBlocks(s).length > 0;
function trainings(id) { return sessionsOf(id).filter(countsAsTraining); }
function history(id, exKey, beforeSessionId) {
  const out = [];
  for (const s of sessionsOf(id)) {
    if (beforeSessionId && s.id === beforeSessionId) break;
    for (const b of doneBlocks(s)) if (b.ex === exKey) out.push(Object.assign({}, b, { date: s.date, sid: s.id }));
  }
  return out;
}
/* Score from the article: total weight lifted (TWL) = weight × reps, per set. */
function blockVolume(b) {
  if (b.bw) return 0;
  const sets = b.sets || [];
  if (sets.length && sets.some(x => x.kg != null)) return sets.reduce((a, x) => a + (x.kg != null ? Number(x.kg) : (Number(b.kg) || 0)) * x.r, 0);
  return (Number(b.kg) || 0) * (b.total || 0);
}
const scored = b => !b.bw && Number(b.kg) > 0;
function blockScore(b) { return scored(b) ? blockVolume(b) : b.total; }
function setsText(b) {
  const sets = b.sets || [];
  const kgs = new Set(sets.map(x => x.kg ?? b.kg));
  if (kgs.size <= 1 || b.bw) return sets.map(x => x.r).join(' · ');
  return sets.map(x => `${x.r}×${fmtNum(x.kg ?? b.kg)}`).join(' · ');
}
function workKg(b) {
  const ks = (b.sets || []).map(x => x.kg).filter(k => k != null);
  return ks.length ? Math.max(...ks) : b.kg;
}

/* Progression advice for the next time an exercise is done. The article says: beat
   last time's score with more reps or a bit more weight. When to go heavier is our
   tip (not from the article): first fresh set >= 12 reps (weight no longer in the
   5-10 rep range), or +20 % reps on the same weight (Escalating Density Training). */
function advice(hist, info) {
  if (!hist.length) return { first: true };
  const last = hist[hist.length - 1];
  let i = hist.length - 1;
  while (i > 0 && hist[i - 1].kg === last.kg) i--;
  const base = hist[i];
  const runLen = hist.length - i;
  const gain = base.total > 0 ? (last.total - base.total) / base.total : 0;
  const out = { last, base, gain, runLen, twl: blockVolume(last) };
  const firstWork = (last.sets || []).find(x => (x.kg ?? last.kg) === last.kg);
  const step = info.step || 2.5;
  const upKg = info.bw && last.kg < 0 ? Math.min(0, last.kg + step) : Math.round((last.kg + step) * 10) / 10;
  if (firstWork && firstWork.r >= 12) { out.up = upKg; out.why = `Je eerste set was ${firstWork.r} herhalingen: dit gewicht is lichter dan de 5 à 10 die de methode aanraadt.`; }
  else if (runLen >= 2 && gain >= UP_THRESHOLD) { out.up = upKg; out.why = `+${Math.round(gain * 100)}% herhalingen op dit gewicht sinds je begon.`; }
  return out;
}
/* What to aim for today at the planned weight. */
function targetText(adv, info, kg) {
  const last = adv.last;
  if (!scored(last) || info.bw || Number(kg) === Number(last.kg) || !(Number(kg) > 0)) return `<b>${last.total + 1}+</b> herhalingen`;
  const reps = Math.floor(adv.twl / Number(kg)) + 1;
  return `<b>${fmtNum(Math.floor(adv.twl) + 1)}+ kg</b> totaal, ±${reps} herh. op ${fmtNum(kg)} kg`;
}
function cmpScore(b, prev) {
  if (!prev) return null;
  if (scored(b) && scored(prev)) return { d: Math.round(blockVolume(b) - blockVolume(prev)), unit: 'kg' };
  return { d: (b.total || 0) - (prev.total || 0), unit: 'herh.' };
}
const fmtDelta = c => `${c.d >= 0 ? '+' : '−'}${fmtNum(Math.abs(c.d))} ${c.unit}`;
function isRecord(b, hist) {
  if (!hist.length || !(b.total > 0)) return false;
  if (scored(b)) { const prevs = hist.filter(scored).map(blockVolume); return prevs.length > 0 && blockVolume(b) > Math.max(...prevs); }
  const same = hist.filter(h => (Number(h.kg) || 0) >= (Number(b.kg) || 0)).map(h => h.total);
  return same.length > 0 && b.total > Math.max(...same);
}
function kgLabel(kg, info, opts = {}) {
  if (kg == null || kg === '') return 'kies gewicht';
  const n = Number(kg);
  if (info.bw) {
    if (n === 0) return 'lichaamsgewicht';
    return n > 0 ? `+${fmtNum(n)} kg` : `${fmtNum(-n)} kg hulp`;
  }
  return `${fmtNum(n)} kg`;
}
function plannedKg(profile, key) {
  const info = exInfo(key, profile);
  const w = profile?.weights?.[key];
  if (w != null) return { kg: w, suggested: false };
  const hist = history(S.uid, key);
  if (hist.length) return { kg: hist[hist.length - 1].kg, suggested: false };
  return { kg: info.start ?? 0, suggested: true };
}

function weekSessions(id, anyDay) {
  const mon = mondayOf(anyDay);
  return trainings(id).filter(s => mondayOf(s.date) === mon);
}
function templateFor(profile, day) {
  if (!profile || profile.mode !== 'abc') return 'A';
  const done = weekSessions(S.uid, day).filter(s => s.date !== day || s.status === 'done').length;
  return ['A', 'B', 'C'][Math.min(done, 2)];
}
function planFor(profile, tpl) {
  return Object.assign({}, DEFAULT_PLANS.A, profile?.plans?.[tpl] || profile?.plans?.A || {});
}
function streakWeeks(id) {
  const ts = trainings(id);
  if (!ts.length) return 0;
  const byWeek = new Map();
  for (const s of ts) { const w = mondayOf(s.date); byWeek.set(w, (byWeek.get(w) || 0) + 1); }
  let wk = mondayOf(todayYmd());
  if ((byWeek.get(wk) || 0) < 3) wk = addDays(wk, -7);
  let n = 0;
  while ((byWeek.get(wk) || 0) >= 3) { n++; wk = addDays(wk, -7); }
  return n;
}
function improvement(id) {
  const keys = new Set();
  for (const s of trainings(id)) for (const b of doneBlocks(s)) keys.add(b.ex);
  const vals = [];
  for (const k of keys) {
    const h = history(id, k);
    if (h.length < 2) continue;
    const a = blockScore(h[0]), b = blockScore(h[h.length - 1]);
    if (a > 0) vals.push((b - a) / a);
  }
  if (!vals.length) return null;
  return vals.reduce((x, y) => x + y, 0) / vals.length;
}
function liveSession(id) {
  return sessionsOf(id).find(s => s.status === 'active' && s.updatedAt && Date.now() - s.updatedAt < 45 * 60 * 1000);
}
function nextTrainingDay(profile, from) {
  const days = profile?.days?.length ? profile.days : [1, 3, 5];
  const start = profile?.start || START;
  let d = from < start ? start : from;
  for (let i = 0; i < 14; i++) {
    if (days.includes(parseYmd(d).getDay())) return d;
    d = addDays(d, 1);
  }
  return from;
}

/* ------------------------------------------------------------------ *
 * UI state + rendering
 * ------------------------------------------------------------------ */
const UI = { tab: prefs.tab || 'train', person: null, tpl: null, confirm: null, sheet: null, histOpen: new Set() };
let renderQueued = false, renderDeferred = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
document.addEventListener('focusout', () => { if (renderDeferred) { renderDeferred = false; setTimeout(scheduleRender, 0); } });

function render() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { renderDeferred = true; return; }
  renderHeader();
  for (const t of ['train', 'progress', 'team', 'plan']) {
    $('#view-' + t).hidden = UI.tab !== t;
    document.querySelector(`.tab[data-tab="${t}"]`).setAttribute('aria-selected', String(UI.tab === t));
  }
  const v = $('#view-' + UI.tab);
  if (UI.tab === 'train') v.innerHTML = viewTrain();
  if (UI.tab === 'progress') { v.innerHTML = viewProgress(); bindCharts(v); }
  if (UI.tab === 'team') v.innerHTML = viewTeam();
  if (UI.tab === 'plan') v.innerHTML = viewPlan();
}

function renderHeader() {
  const p = myProfile();
  const today = todayYmd();
  const start = p?.start || START;
  const wl = today < start ? `Start ${fmtDM(start)}` : `Week ${cycleWeek(today, start).w} van ${CYCLE_WEEKS}`;
  $('#weekLabel').textContent = wl;
  const sync = $('#sync');
  sync.classList.toggle('on', S.mode === 'shared' && !S.ownLocal);
  $('#syncText').textContent = S.mode === 'loading' ? 'Verbinden…' : (S.mode === 'shared' && !S.ownLocal ? 'Gedeeld' : 'Op dit toestel');
  const av = $('#meAvatar');
  if (S.uid) av.outerHTML = avatarHtml(S.uid).replace('<span class="avatar"', '<span class="avatar" id="meAvatar" aria-hidden="true"');
  const n = $('#notice');
  n.innerHTML = S.notice ? `<div class="notice"><span>${esc(S.notice)}</span><button class="btn link" data-act="dismissNotice" style="justify-self:start">Begrepen</button></div>` : '';
}

/* ---------- Training tab ---------- */
function viewTrain() {
  if (S.mode === 'loading' || (!S.loaded && !myProfile())) return `<div class="skeleton">Je logboek wordt geladen…</div>`;
  const p = myProfile();
  if (!p) return viewOnboarding();
  const today = todayYmd();
  const start = p.start || START;
  const draft = loadDraft();
  const wk = weekSessions(S.uid, today);
  const doneToday = wk.some(s => s.date === today && s.status === 'done');
  const next = nextTrainingDay(p, doneToday ? addDays(today, 1) : today);
  const isToday = next === today;
  const tpl = UI.tpl || templateFor(p, today);
  const plan = planFor(p, tpl);

  let head;
  if (today < start) {
    const n = daysBetween(today, start);
    head = `<div class="eyebrow">Jullie starten over ${n} ${n === 1 ? 'dag' : 'dagen'}</div><h1 class="h-display">${cap(fmtLong(start))}</h1>`;
  } else if (doneToday) {
    head = `<div class="eyebrow">Vandaag gedaan</div><h1 class="h-display">Goed bezig. Volgende: ${esc(fmtLong(next))}</h1>`;
  } else if (isToday) {
    head = `<div class="eyebrow">${cap(fmtLong(today))}</div><h1 class="h-display">Vandaag is trainingsdag</h1>`;
  } else {
    head = `<div class="eyebrow">${cap(fmtLong(today))} · rustdag</div><h1 class="h-display">Volgende training: ${esc(fmtLong(next))}</h1>`;
  }

  // Week strip: three slots, filled in order of completed sessions
  const days = (p.days?.length ? p.days : [1, 3, 5]).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
  const mon = mondayOf(today < start ? start : today);
  const planned = days.map(d => addDays(mon, (d + 6) % 7));
  const cells = [0, 1, 2].map(i => {
    const s = wk[i];
    if (s && today >= start) return `<div class="wday done"><b>${WD[parseYmd(s.date).getDay()]} ${parseYmd(s.date).getDate()}</b><span>✓ ${doneBlocks(s).length} blokken</span></div>`;
    const d = planned[i] || planned[planned.length - 1];
    const isNext = !s && i === Math.min(wk.length, 2);
    return `<div class="wday${isNext ? ' next' : ''}"><b>${WD[parseYmd(d).getDay()]} ${parseYmd(d).getDate()}</b><span>training ${i + 1}</span></div>`;
  }).join('');

  const tplSel = p.mode === 'abc'
    ? `<div class="tabsel" role="group" aria-label="Kies training">${['A', 'B', 'C'].map(t => `<button data-act="pickTpl" data-tpl="${t}" aria-pressed="${t === tpl}">${t}</button>`).join('')}</div>`
    : '';

  const blocks = SLOT_ORDER.map(slot => blockPlanRow(p, slot, plan[slot])).join('');

  const resume = draft ? `
    <div class="card" style="border-color:var(--push)">
      <div class="row"><span class="pill live">Bezig</span><span class="small grow">Training van ${esc(fmtShort(draft.session.date))}, blok ${draft.idx + 1} van 3</span></div>
      <div class="row wrap"><button class="btn primary" data-act="resume">Ga verder</button><button class="btn ghost" data-act="discardDraft">${UI.confirm === 'discardDraft' ? 'Zeker? Tik nogmaals' : 'Weggooien'}</button></div>
    </div>` : '';

  const cw = cycleWeek(today < start ? start : today, start);
  const cycleNote = today < start || (cw.round === 1 && cw.w === 1)
    ? 'Week 1 is je basismeting: noteer alles, volgende week ga je het verbeteren.'
    : `Ronde ${cw.round}, week ${cw.w} van ${CYCLE_WEEKS}: zelfde oefeningen, hogere score.`;
  const review = today >= start && ((cw.w === CYCLE_WEEKS && wk.length >= 3) || (cw.w === 1 && cw.round > 1 && wk.length === 0)) ? `
    <div class="card">
      <div class="eyebrow">${CYCLE_WEEKS} weken erop</div>
      <p class="small">Tijd om je schema te evalueren. Houd wat werkt, of wissel een paar oefeningen. Een nieuwe oefening begint met een nieuwe basismeting.</p>
      <button class="btn ghost" data-act="tab" data-tab="plan" style="justify-self:start">Schema aanpassen</button>
    </div>` : '';

  const last = trainings(S.uid).slice(-1)[0];
  const lastCard = last ? `
    <div class="card">
      <div class="row"><div class="eyebrow grow">Laatste training · ${esc(fmtShort(last.date))}</div><button class="btn link" data-act="tab" data-tab="progress">Alles bekijken</button></div>
      ${sessionSummaryRows(last)}
    </div>` : '';

  return `
    ${resume}
    <div class="stack" style="gap:8px">${head}</div>
    <div class="week">${cells}</div>
    ${review}
    <div class="card">
      <div class="row"><div class="grow"><div class="eyebrow">${p.mode === 'abc' ? 'Training ' + tpl : 'Jouw training'}</div><div class="small">${esc(cycleNote)}</div></div>${tplSel}</div>
      <div class="blocks">${blocks}</div>
      <button class="btn big primary" data-act="startSession" ${draft ? 'disabled' : ''}>Start training</button>
      <button class="btn link" data-act="manual" style="justify-self:center">Training achteraf invoeren</button>
    </div>
    ${lastCard}
    <div class="card method">
      <div class="eyebrow">Zo werkt een blok</div>
      <ol class="small">
        <li>Start de klok: 10 minuten voor deze ene oefening. Het begin mag je gebruiken om op te bouwen naar je werkgewicht.</li>
        <li>Doe een set met nette herhalingen en stop voordat je techniek inzakt. Tik het aantal in.</li>
        <li>Rust zo lang als nodig en ga weer. Je sets worden vanzelf kleiner, dat hoort zo.</li>
        <li>Na 10 minuten telt je score: herhalingen × gewicht. Volgende keer versla je die, met meer herhalingen of een beetje meer gewicht.</li>
      </ol>
    </div>`;
}

function blockPlanRow(p, slot, key) {
  const info = exInfo(key, p);
  const pk = plannedKg(p, key);
  const hist = history(S.uid, key);
  const adv = advice(hist, info);
  let tip;
  if (adv.first) {
    tip = `<div class="tipline">Basismeting: kies een gewicht dat je uitgerust 5 à 10 keer netjes kunt tillen.</div>`;
  } else {
    const l = adv.last;
    tip = `<div class="tipline"><span>Vorige keer (${esc(fmtDM(l.date))}): <b>${l.total} herh.</b> · ${esc(kgLabel(l.kg, info))}${scored(l) ? ` = ${fmtNum(Math.round(adv.twl))} kg totaal` : ''}</span></div>
      <div class="tipline"><span>Doel vandaag: ${targetText(adv, info, pk.kg)}</span></div>`;
    if (adv.up != null && Number(pk.kg) < adv.up) {
      tip += `<div class="up"><span class="grow">Tip: ${esc(adv.why)} Probeer ${esc(kgLabel(adv.up, info))}.</span><button class="btn sm" data-act="applyUp" data-ex="${esc(key)}" data-kg="${adv.up}">Overnemen</button></div>`;
    }
  }
  return `
    <div class="blk ${slot}">
      <div class="bar"></div>
      <div class="blk-main">
        <div class="row"><span class="chip ${slot}">${SLOT[slot].label}</span></div>
        <div class="blk-name">${esc(info.n)}</div>
        <div class="row wrap">
          <div class="stepper" role="group" aria-label="Gewicht ${esc(info.n)}">
            <button data-act="kg" data-ex="${esc(key)}" data-dir="-1" aria-label="Lichter">−</button>
            <span class="val${pk.suggested ? ' tbd' : ''}">${esc(kgLabel(pk.kg, info))}</span>
            <button data-act="kg" data-ex="${esc(key)}" data-dir="1" aria-label="Zwaarder">+</button>
          </div>
          ${pk.suggested ? '<span class="tiny">startvoorstel, pas aan</span>' : ''}
        </div>
        ${tip}
        ${info.tip ? `<div class="tiny">${esc(info.tip)}</div>` : ''}
      </div>
    </div>`;
}

function sessionSummaryRows(s) {
  const p = myProfile();
  return `<div>${(s.blocks || []).map(b => {
    const info = exInfo(b.ex, p);
    const val = b.skipped || !b.done ? 'overgeslagen' : `${b.total || 0} herh.`;
    const twl = b.done && scored(b) ? ` = ${fmtNum(Math.round(blockVolume(b)))} kg totaal` : '';
    return `<div class="sum-row ${b.slot}"><span class="bar"></span><span class="grow"><b>${esc(b.name || info.n)}</b><br><span class="tiny">${esc(kgLabel(b.kg, info))}${twl}</span></span><span class="num" style="font-weight:700">${val}</span></div>`;
  }).join('')}</div>`;
}

function viewOnboarding() {
  const hint = S.meInfo?.name || '';
  const shared = S.mode === 'shared' && !S.ownLocal;
  return `
    <div class="stack" style="gap:8px">
      <div class="eyebrow">Welkom</div>
      <h1 class="h-display">Drie keer per week, drie oefeningen, dertig minuten</h1>
      <p class="lead">Jullie starten ${esc(fmtLong(START))}. Elke training bestaat uit drie blokken van tien minuten: één duwoefening, één trekoefening en één beenoefening. In elk blok verzamel je zoveel mogelijk nette herhalingen. Je volgt vier weken hetzelfde weekschema, en deze app onthoudt elke score zodat je weet wat je moet verslaan.</p>
    </div>
    <div class="bignums"><div><b>3</b><span>trainingen per week</span></div><div><b>3</b><span>oefeningen per training</span></div><div><b>30</b><span>minuten per training</span></div></div>
    <form class="card" data-form="join">
      <label class="f" for="joinNick">Je naam${shared ? ' (zo zien je trainingsmaatjes je)' : ''}
        <input type="text" id="joinNick" maxlength="30" placeholder="${esc(hint || 'Je voornaam')}" autocomplete="nickname"></label>
      <button class="btn big primary" type="submit">Ik doe mee</button>
      <p class="tiny">${shared ? 'Je trainingen worden gedeeld met iedereen die deze pagina kan openen.' : 'Je trainingen worden op dit toestel bewaard. Maak af en toe een backup via Schema.'}</p>
    </form>`;
}

/* ---------- Progress tab ---------- */
function viewProgress() {
  if (!S.loaded) return `<div class="skeleton">Laden…</div>`;
  const ids = [...S.members.keys()].filter(id => S.members.get(id)?.profile || id === S.uid);
  const pid = UI.person && S.members.has(UI.person) ? UI.person : S.uid;
  const isMe = pid === S.uid;
  const prof = S.members.get(pid)?.profile || myProfile();
  const ts = trainings(pid);
  const who = ids.length > 1 ? `<div class="tabsel" role="group" aria-label="Wiens voortgang">${ids.map(id => `<button data-act="person" data-id="${esc(id)}" aria-pressed="${id === pid}">${esc(id === S.uid ? 'Ik' : displayName(id))}</button>`).join('')}</div>` : '';
  const metricSel = `<div class="tabsel" role="group" aria-label="Wat tonen"><button data-act="metric" data-m="vol" aria-pressed="${prefs.metric !== 'reps'}">Score (kg)</button><button data-act="metric" data-m="reps" aria-pressed="${prefs.metric === 'reps'}">Herhalingen</button></div>`;

  if (!ts.length) {
    return `
      ${who ? `<div class="row wrap">${who}</div>` : ''}
      <div class="stack" style="gap:6px"><div class="eyebrow">Voortgang</div><h1 class="h-display">${isMe ? 'Hier zie je straks hoe je sterker wordt' : esc(displayName(pid)) + ' heeft nog niet getraind'}</h1></div>
      <div class="card">
        <div class="ex-card-head"><div class="grow"><span class="chip push" style="justify-self:start">Push</span><b>Dumbbell bankdrukken</b><span class="tiny">herhalingen per blok van 10 minuten</span></div><span class="pill">Voorbeeld</span></div>
        <div class="faded">${chartSvg('example', [38, 42, 45, 47, 41, 44, 48].map((y, i) => ({ y, kg: i < 4 ? 28 : 32, reps: y, date: addDays(START, i * 7) })), 'var(--push)', 'reps', true)}</div>
        <p class="small">${isMe ? 'Na je eerste training verschijnt hier per oefening een grafiek van je score, met elke gewichtsverhoging erbij.' : 'Zodra ' + esc(displayName(pid)) + ' een training opslaat, verschijnt die hier.'}</p>
      </div>`;
  }

  const today = todayYmd();
  const thisWeek = weekSessions(pid, today).length;
  const vol = ts.reduce((a, s) => a + doneBlocks(s).reduce((x, b) => x + blockVolume(b), 0), 0);
  const tiles = `
    <div class="tiles">
      <div class="tile"><span class="lbl">Trainingen</span><span class="val">${ts.length}</span></div>
      <div class="tile"><span class="lbl">Deze week</span><span class="val">${thisWeek}<small>/3</small></span></div>
      <div class="tile"><span class="lbl">Weken op rij</span><span class="val">${streakWeeks(pid)}</span></div>
      <div class="tile"><span class="lbl">Totaal getild</span><span class="val">${vol >= 10000 ? fmtNum(Math.round(vol / 100) / 10) + '<small> ton</small>' : fmtNum(Math.round(vol)) + '<small> kg</small>'}</span></div>
    </div>`;

  // Per exercise charts, grouped by slot
  const keys = [];
  for (const s of ts) for (const b of doneBlocks(s)) if (!keys.some(k => k.ex === b.ex)) keys.push({ ex: b.ex, slot: b.slot, name: b.name });
  keys.sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
  const charts = keys.map(k => {
    const info = exInfo(k.ex, prof);
    const h = history(pid, k.ex);
    const metric = prefs.metric !== 'reps' && h.some(scored) ? 'vol' : 'reps';
    const pts = h.map(b => ({ y: metric === 'vol' ? Math.round(blockVolume(b)) : b.total, reps: b.total, kg: b.kg, vol: Math.round(blockVolume(b)), date: b.date, bw: !!b.bw }));
    const last = h[h.length - 1], first = h[0];
    const bestAtKg = Math.max(...h.filter(b => b.kg === last.kg).map(b => b.total));
    const d = h.length > 1 && blockScore(first) > 0 ? (blockScore(last) - blockScore(first)) / blockScore(first) : null;
    const color = k.slot === 'legs' ? 'var(--legs-mark)' : `var(--${k.slot})`;
    return `
      <div class="card">
        <div class="ex-card-head">
          <div class="grow"><span class="chip ${k.slot}" style="justify-self:start">${SLOT[k.slot].label}</span><b style="font-size:18px">${esc(info.n || k.name)}</b>
            <span class="small">Laatst: <b>${last.total} herh.</b> · ${esc(kgLabel(last.kg, info))}${scored(last) ? ` = ${fmtNum(Math.round(blockVolume(last)))} kg` : ''} · beste op dit gewicht ${bestAtKg} herh.</span></div>
          ${d != null ? `<span class="delta ${d >= 0 ? 'pos' : 'neg'}" title="score t.o.v. je basismeting">${d >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(d * 100))}%</span>` : ''}
        </div>
        ${chartSvg('c-' + k.ex, pts, color, metric)}
        ${metric === 'reps' && prefs.metric !== 'reps' ? '<span class="tiny">Lichaamsgewicht-oefening: hier tellen de herhalingen.</span>' : ''}
      </div>`;
  }).join('');

  // Adherence
  const start = prof?.start || START;
  const curW = weekNo(today, start);
  const weeks = [];
  for (let w = Math.max(1, curW - 9); w <= Math.max(1, curW); w++) weeks.push(w);
  const adh = weeks.reverse().map(w => {
    const mon = addDays(mondayOf(start), (w - 1) * 7);
    const n = ts.filter(s => mondayOf(s.date) === mon).length;
    const cur = w === curW;
    const cells = [0, 1, 2].map(i => `<i class="${i < n ? 'on' : cur ? 'cur' : ''}"></i>`).join('');
    return `<div class="adh-row"><span class="lbl">Wk ${w}</span><span class="adh-cells">${cells}</span><span class="tiny num">${n}/3${n > 3 ? ' +' + (n - 3) : ''}</span></div>`;
  }).join('');

  // History
  const hist = ts.slice().reverse().map(s => historyItem(s, pid)).join('');
  const unfinished = sessionsOf(pid).filter(s => !countsAsTraining(s) && isMe);

  return `
    ${who || ''}
    ${tiles}
    <div class="card"><div class="row"><div class="eyebrow grow">Trainingen per week</div><span class="tiny">doel: 3</span></div><div class="adh">${adh}</div></div>
    <div class="row wrap"><div class="eyebrow grow">Per oefening</div>${metricSel}</div>
    ${charts}
    <div class="card"><div class="eyebrow">Geschiedenis</div><div class="hist">${hist}</div>
      ${unfinished.length ? `<p class="tiny">${unfinished.length} lege training(en) zonder afgerond blok worden niet getoond.</p>` : ''}</div>`;
}

function historyItem(s, pid) {
  const isMe = pid === S.uid;
  const prof = S.members.get(pid)?.profile;
  const total = doneBlocks(s).reduce((a, b) => a + b.total, 0);
  const open = UI.histOpen.has(s.id);
  const lines = (s.blocks || []).map(b => {
    const info = exInfo(b.ex, prof);
    const sets = setsText(b);
    return `<div class="line"><span class="chip ${b.slot}">${SLOT[b.slot].label}</span><span>${esc(b.name || info.n)} <span class="tiny">${esc(kgLabel(b.kg, info))}</span></span><b class="num">${b.skipped || !b.done ? '–' : (b.total || 0)}${b.done && scored(b) ? ` <span class="tiny">${fmtNum(Math.round(blockVolume(b)))} kg</span>` : ''}</b>${sets ? `<span class="sets">sets: ${esc(sets)}</span>` : ''}</div>`;
  }).join('');
  const feel = s.feel ? `<span class="pill">${esc(FEEL[s.feel - 1] || '')}</span>` : '';
  const note = s.note ? `<p class="small">${esc(s.note)}</p>` : '';
  const status = s.status !== 'done' ? '<span class="pill warn">niet afgerond</span>' : '';
  const actions = isMe ? `<div class="row wrap"><button class="btn sm ghost" data-act="edit" data-id="${esc(s.id)}">Bewerken</button>${s.status !== 'done' ? `<button class="btn sm ghost" data-act="finishOld" data-id="${esc(s.id)}">Markeer als klaar</button>` : ''}<button class="btn sm danger" data-act="del" data-id="${esc(s.id)}">${UI.confirm === 'del:' + s.id ? 'Zeker? Tik nogmaals' : 'Verwijderen'}</button></div>` : '';
  return `<details data-hist="${esc(s.id)}"${open ? ' open' : ''}><summary><span class="grow"><b>${esc(cap(fmtShort(s.date)))}</b> <span class="tiny">wk ${weekNo(s.date, prof?.start || START)}${s.tpl && prof?.mode === 'abc' ? ' · ' + esc(s.tpl) : ''}</span></span>${status}${feel}<span class="num" style="font-weight:700">${total} herh.</span><span class="chev">›</span></summary><div class="body">${lines}${note}${actions}</div></details>`;
}

/* Line chart with crosshair tooltip. */
const CHARTS = {};
function niceScale(min, max, n) {
  if (min === max) { min = Math.max(0, min - 5); max = max + 5; }
  const raw = (max - min) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = Math.max(1, (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag);
  return [Math.max(0, Math.floor(min / step) * step), Math.ceil(max / step) * step, step];
}
function chartSvg(id, pts, color, metric, isExample) {
  const W = 340, H = 168, L = 42, R = 16, T = 22, B = 26;
  CHARTS[id] = { pts, metric, W, L, R };
  if (!pts.length) return '';
  const ys = pts.map(p => p.y);
  const [lo, hi, step] = niceScale(Math.min(...ys), Math.max(...ys), 4);
  const x = i => pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / ((hi - lo) || 1));
  CHARTS[id].xs = pts.map((p, i) => x(i));
  CHARTS[id].ys = pts.map(p => y(p.y));
  let grid = '';
  for (let v = lo; v <= hi + 1e-9; v += step) {
    grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" style="font-variant-numeric:tabular-nums">${fmtNum(v)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const area = pts.length > 1 ? `${line}L${x(pts.length - 1).toFixed(1)},${y(lo).toFixed(1)}L${x(0).toFixed(1)},${y(lo).toFixed(1)}Z` : '';
  // weight-change labels (only where the weight changed, plus the first point)
  let kgl = '';
  pts.forEach((p, i) => {
    if (p.bw && p.kg === 0) return;
    if (i === 0 || p.kg !== pts[i - 1].kg) {
      const lx = Math.min(Math.max(x(i), L + 18), W - R - 18);
      kgl += `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${T - 4}" y2="${(H - B).toFixed(1)}" class="grid"/><text x="${lx.toFixed(1)}" y="${T - 8}" text-anchor="middle">${esc(fmtNum(p.kg))} kg</text>`;
    }
  });
  const lastI = pts.length - 1;
  const xl = `<text x="${x(0).toFixed(1)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${esc(fmtDM(pts[0].date))}</text>` +
    (pts.length > 1 ? `<text x="${x(lastI).toFixed(1)}" y="${H - 6}" text-anchor="end">${esc(fmtDM(pts[lastI].date))}</text>` : '');
  const endLabel = `<text x="${Math.min(x(lastI) + 0, W - R).toFixed(1)}" y="${(y(pts[lastI].y) - 10).toFixed(1)}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}" style="fill:var(--ink);font-weight:700;font-size:12px">${fmtNum(pts[lastI].y)}</text>`;
  const label = metric === 'vol' ? 'score in kg per blok' : 'herhalingen per blok';
  return `<div class="chart-wrap" data-chart="${esc(id)}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}, ${pts.length} trainingen" ${isExample ? '' : 'tabindex="0"'}>
      ${grid}${kgl}
      ${area ? `<path d="${area}" fill="${color}" fill-opacity=".1" stroke="none"/>` : ''}
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.length <= 24 ? pts.map((p, i) => i === lastI ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="2.5" fill="${color}"/>`).join('') : ''}
      <circle cx="${x(lastI).toFixed(1)}" cy="${y(pts[lastI].y).toFixed(1)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
      ${endLabel}${xl}
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
      <circle class="xh-dot" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    </svg>
    <div class="tip" hidden></div>
  </div>`;
}
function bindCharts(root) {
  root.querySelectorAll('[data-chart]').forEach(wrap => {
    const id = wrap.dataset.chart;
    const c = CHARTS[id];
    if (!c || id === 'example') return;
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
    const xh = svg.querySelector('.xh'), dot = svg.querySelector('.xh-dot');
    let cur = -1;
    const show = i => {
      if (i < 0 || i >= c.pts.length) return;
      cur = i;
      const p = c.pts[i];
      xh.setAttribute('x1', c.xs[i]); xh.setAttribute('x2', c.xs[i]); xh.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', c.xs[i]); dot.setAttribute('cy', c.ys[i]); dot.setAttribute('visibility', 'visible');
      const kg = p.bw ? (p.kg ? (p.kg > 0 ? '+' : '') + fmtNum(p.kg) + ' kg' : 'lichaamsgewicht') : fmtNum(p.kg) + ' kg';
      const main = c.metric === 'vol' ? `${fmtNum(p.y)} kg` : `${p.reps} herhalingen`;
      const sub = c.metric === 'vol' ? `${p.reps} herh. · ${kg}` : kg + (p.vol ? ` · ${fmtNum(p.vol)} kg` : '');
      tip.innerHTML = `<strong>${esc(main)}</strong>${esc(sub)}<br>${esc(cap(fmtShort(p.date)))}`;
      tip.hidden = false;
      const pct = c.xs[i] / c.W;
      const w = wrap.clientWidth;
      const tw = tip.offsetWidth;
      const left = Math.min(Math.max(pct * w, tw / 2 + 2), w - tw / 2 - 2);
      tip.style.left = left + 'px';
      tip.style.top = '-6px';
      tip.style.transform = 'translate(-50%, -100%)';
    };
    const hide = () => { cur = -1; tip.hidden = true; xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
    const nearest = ev => {
      const r = svg.getBoundingClientRect();
      const vx = (ev.clientX - r.left) / r.width * c.W;
      let best = 0, bd = Infinity;
      c.xs.forEach((x, i) => { const d = Math.abs(x - vx); if (d < bd) { bd = d; best = i; } });
      return best;
    };
    svg.addEventListener('pointermove', ev => show(nearest(ev)));
    svg.addEventListener('pointerdown', ev => show(nearest(ev)));
    svg.addEventListener('pointerleave', hide);
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowLeft') { show(Math.max(0, (cur < 0 ? c.pts.length : cur) - 1)); ev.preventDefault(); }
      if (ev.key === 'ArrowRight') { show(Math.min(c.pts.length - 1, cur + 1)); ev.preventDefault(); }
      if (ev.key === 'Escape') hide();
    });
    svg.addEventListener('focus', () => show(c.pts.length - 1));
  });
}

/* ------------------------------------------------------------------ *
 * Runner: live 10-minute AMRAP blocks
 * ------------------------------------------------------------------ */
const R = { session: null, idx: 0, phase: 'ready', t0: 0, leadEnd: 0, pausedAt: 0, pausedMs: 0, timer: null, lastRem: null, wake: null, confirm: null, lastSet: null };
const DRAFT_KEY = () => 'd330.draft.' + (S.uid || 'local');
function loadDraft() { const d = LS.get(DRAFT_KEY(), null); return d && d.session ? d : null; }
function saveDraft() {
  if (!R.session) { LS.del(DRAFT_KEY()); return; }
  LS.set(DRAFT_KEY(), { session: R.session, idx: R.idx, phase: R.phase, t0: R.t0, leadEnd: R.leadEnd, pausedAt: R.pausedAt, pausedMs: R.pausedMs });
}

function newSession() {
  const p = myProfile();
  const today = todayYmd();
  const tpl = UI.tpl || templateFor(p, today);
  const plan = planFor(p, tpl);
  return {
    v: 1, id: uidGen('s'), date: today, tpl, status: 'active', startedAt: Date.now(), updatedAt: Date.now(),
    blocks: SLOT_ORDER.map(slot => {
      const key = plan[slot];
      const info = exInfo(key, p);
      const kg = plannedKg(p, key).kg;
      return { slot, ex: key, name: info.n, kg: Number(kg) || 0, bw: !!info.bw, sets: [], total: 0, dur: 0, done: false, skipped: false };
    }),
    feel: 0, note: '',
  };
}
function openRunner(fromDraft) {
  const d = fromDraft ? loadDraft() : null;
  if (d) {
    Object.assign(R, { session: d.session, idx: d.idx, phase: d.phase, t0: d.t0, leadEnd: d.leadEnd, pausedAt: d.pausedAt, pausedMs: d.pausedMs });
    if (R.phase === 'lead') R.phase = 'ready';
  } else {
    Object.assign(R, { session: newSession(), idx: 0, phase: 'ready', t0: 0, leadEnd: 0, pausedAt: 0, pausedMs: 0 });
  }
  R.lastRem = null; R.confirm = null; R.lastSet = null;
  $('#runner').hidden = false;
  document.body.style.overflow = 'hidden';
  saveDraft();
  if (R.phase === 'run') { wakeOn(); startTick(); }
  renderRunner();
}
function closeRunner() {
  stopTick(); wakeOff();
  $('#runner').hidden = true;
  document.body.style.overflow = '';
  R.session = null;
  scheduleRender();
}
const blk = () => R.session.blocks[R.idx];
function elapsed() {
  if (R.phase === 'run') return (Date.now() - R.t0 - R.pausedMs) / 1000;
  if (R.phase === 'paused') return (R.pausedAt - R.t0 - R.pausedMs) / 1000;
  if (R.phase === 'over') return BLOCK_SEC;
  return 0;
}
function startTick() { stopTick(); R.timer = setInterval(tick, 200); tick(); }
function stopTick() { if (R.timer) clearInterval(R.timer); R.timer = null; }

function tick() {
  if (!R.session) return;
  if (R.phase === 'lead') {
    const rem = Math.ceil((R.leadEnd - Date.now()) / 1000);
    if (rem !== R.lastRem) { if (rem <= 3 && rem >= 1) beep(660, 0.12); R.lastRem = rem; }
    if (rem <= 0) { beginBlock(); return; }
    updateClock(rem, true);
    return;
  }
  if (R.phase !== 'run') return;
  const e = elapsed();
  const remF = BLOCK_SEC - e;
  const rem = Math.ceil(remF);
  if (R.lastRem != null && rem !== R.lastRem) {
    if (R.lastRem > 300 && rem <= 300 && rem > 295) { beep(880, 0.15); buzz(80); }
    if (R.lastRem > 60 && rem <= 60 && rem > 55) { beep(880, 0.12); beep(880, 0.12, 0.22); buzz([80, 60, 80]); }
    if (rem <= 3 && rem >= 1 && R.lastRem > rem) beep(660, 0.1);
  }
  R.lastRem = rem;
  if (remF <= 0) { endBlock(true); return; }
  updateClock(rem, false);
  updateGhost();
}
function beginBlock() {
  R.phase = 'run'; R.t0 = Date.now(); R.pausedMs = 0; R.pausedAt = 0; R.lastRem = BLOCK_SEC;
  beep(1175, 0.35); buzz(200);
  saveDraft(); renderRunner(); startTick();
}
function endBlock(auto) {
  const b = blk();
  b.dur = Math.min(BLOCK_SEC, Math.round(R.phase === 'paused' || R.phase === 'run' ? elapsed() : BLOCK_SEC));
  R.phase = 'over';
  stopTick();
  if (auto) { beep(988, 0.7); buzz([300, 100, 300]); }
  b.total = b.sets.reduce((a, s) => a + s.r, 0);
  saveDraft(); renderRunner();
}

/* Sound + vibration + wake lock — all optional and failure-tolerant. */
let AC = null;
function audio() {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch { AC = null; }
  return AC;
}
function beep(freq, dur, when = 0) {
  if (!prefs.sound) return;
  const ac = audio(); if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = freq;
    const t = ac.currentTime + when;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch { /* ignore */ }
}
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch { /* ignore */ } }
async function wakeOn() {
  try { if ('wakeLock' in navigator && !R.wake) { R.wake = await navigator.wakeLock.request('screen'); R.wake.addEventListener('release', () => { R.wake = null; }); } } catch { R.wake = null; }
}
function wakeOff() { try { R.wake && R.wake.release(); } catch { /* ignore */ } R.wake = null; }
document.addEventListener('visibilitychange', () => {

/* 7-segment LED clock */
const SEGS = (() => {
  const W = 40, H = 72, m = 5, t = 7, g = 1.6, hh = t / 2;
  const hz = (x1, x2, y) => `${x1},${y} ${x1 + hh},${y - hh} ${x2 - hh},${y - hh} ${x2},${y} ${x2 - hh},${y + hh} ${x1 + hh},${y + hh}`;
  const vt = (x, y1, y2) => `${x},${y1} ${x + hh},${y1 + hh} ${x + hh},${y2 - hh} ${x},${y2} ${x - hh},${y2 - hh} ${x - hh},${y1 + hh}`;
  return {
    a: hz(m + g, W - m - g, m), g: hz(m + g, W - m - g, H / 2), d: hz(m + g, W - m - g, H - m),
    f: vt(m, m + g, H / 2 - g), b: vt(W - m, m + g, H / 2 - g), e: vt(m, H / 2 + g, H - m - g), c: vt(W - m, H / 2 + g, H - m - g),
  };
})();
const DIGITS = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', ' ': '' };
function ledSvg(text, cls) {
  let x = 0, out = '';
  for (const ch of text) {
    if (ch === ':') { out += `<circle class="colon" cx="${x + 8}" cy="24" r="4"/><circle class="colon" cx="${x + 8}" cy="48" r="4"/>`; x += 16; continue; }
    const on = DIGITS[ch] ?? '';
    out += `<g transform="translate(${x} 0) skewX(-6)">${Object.entries(SEGS).map(([k, pts]) => `<polygon class="seg${on.includes(k) ? ' on' : ''}" points="${pts}"/>`).join('')}</g>`;
    x += 46;
  }
  return `<svg class="led ${cls || ''}" viewBox="-4 0 ${x + 4} 72" aria-hidden="true">${out}</svg>`;
}
const mmss = s => `${Math.floor(Math.max(0, s) / 60)}:${pad2(Math.max(0, s) % 60)}`;
function clockText(rem) { const t = mmss(rem); return t.length === 4 ? ' ' + t : t; }
function updateClock(rem, lead) {
  const c = $('#runner .clock');
  if (!c) return;
  const key = (lead ? 'L' : 'R') + rem;
  if (c.dataset.k !== key) {
    c.dataset.k = key;
    $('.ledbox', c).innerHTML = ledSvg(lead ? clockText(rem) : clockText(rem), lead ? 'lead' : '');
    $('.prog b', c).style.width = lead ? '0%' : (Math.min(1, (BLOCK_SEC - rem) / BLOCK_SEC) * 100).toFixed(2) + '%';
    const st = $('.status', c);
    if (!lead) st.textContent = rem > 60 ? `Nog ${Math.ceil(rem / 60)} minuten` : rem > 0 ? 'Laatste minuut' : 'Tijd!';
  }
}

function prevBlock() {
  const b = blk();
  const h = history(S.uid, b.ex, R.session.id);
  return h.length ? h[h.length - 1] : null;
}
function ghostAt(prev, e) {
  if (!prev || !prev.sets || !prev.sets.length || prev.sets.every(s => s.t == null)) return null;
  return prev.sets.filter(s => s.t != null && s.t <= e).reduce((a, s) => a + s.r, 0);
}
function updateGhost() {
  const el = $('#runner [data-ghost]');
  if (!el) return;
  const prev = prevBlock();
  const g = ghostAt(prev, elapsed());
  if (g == null) return;
  const tot = blk().sets.reduce((a, s) => a + s.r, 0);
  const d = tot - g;
  el.innerHTML = `Vorige keer op dit moment: <b>${g}</b> <span class="delta ${d >= 0 ? 'pos' : 'neg'}">${d >= 0 ? '+' : ''}${d}</span>`;
}

function runnerFinish() {

async function finishAndSave() {

  closeRunner();

function parseSets(str) { return String(str || '').split(/[\s,;·+]+/).map(x => parseInt(x, 10)).filter(n => n > 0 && n < 200); }

async function submitSessionForm(form) {
  const id = form.dataset.id;
  const isNew = form.dataset.new === '1';
  const p = myProfile();
  const base = isNew ? UI.sheet.session : clone(me().sessions.get(id));
  if (!base) { closeSheet(); return; }
  const fd = new FormData(form);
  base.date = fd.get('date') || base.date;
  base.note = String(fd.get('note') || '').trim().slice(0, 400);
  base.blocks.forEach((b, i) => {
    const ex = fd.get('ex' + i) || b.ex;
    const info = exInfo(ex, p);
    b.ex = ex; b.name = info.n; b.bw = !!info.bw;
    const oldKg = b.kg;
    b.kg = Number(String(fd.get('kg' + i)).replace(',', '.')) || 0;
    if (b.kg !== oldKg) b.sets = (b.sets || []).map(x => (x.kg == null || x.kg === oldKg ? Object.assign({}, x, { kg: b.kg }) : x));
    b.skipped = !!fd.get('skip' + i);
    const setsIn = form.querySelector(`[name="sets${i}"]`);
    if (setsIn.value !== setsIn.dataset.orig) b.sets = parseSets(setsIn.value).map(r => ({ r, kg: b.kg }));
    const t = parseInt(fd.get('tot' + i), 10);
    const sum = (b.sets || []).reduce((a, s) => a + s.r, 0);
    b.total = sum > 0 && setsIn.value !== setsIn.dataset.orig ? sum : (t > 0 ? t : sum);
    b.done = !b.skipped && b.total > 0;
  });
  if (!base.blocks.some(b => b.done)) { toast('Vul bij minstens één oefening het aantal herhalingen in.'); return; }
  base.status = 'done'; base.updatedAt = Date.now();
  if (isNew) { base.startedAt = parseYmd(base.date).getTime() + 12 * 3600e3; base.manual = true; }
  const ok = await saveSession(base);
  if (ok) {
    if (isNew) {
      const pp = clone(p); pp.weights = pp.weights || {};
      for (const b of base.blocks) if (b.done) pp.weights[b.ex] = b.kg;
      saveProfile(pp);
    }
    closeSheet(); toast('Opgeslagen.');
  }
}

const ACT = {

  applyUp(el) { const p = clone(myProfile()); p.weights = p.weights || {}; p.weights[el.dataset.ex] = Number(el.dataset.kg); saveProfile(p); toast('Nieuw gewicht staat klaar.'); },

  manual() {

  async finishOld(el) { const s = clone(me().sessions.get(el.dataset.id)); if (!s) return; s.status = 'done'; s.updatedAt = Date.now(); await saveSession(s); toast('Gemarkeerd als klaar.'); },
  async del(el) {
    const id = el.dataset.id;
    if (UI.confirm !== 'del:' + id) { armConfirm('del:' + id); render(); return; }
    UI.confirm = null; UI.histOpen.delete(id);
    const d = loadDraft(); if (d && d.session.id === id) LS.del(DRAFT_KEY());
    if (await deleteSession(id)) toast('Training verwijderd.');
  },
  closeSheet() { closeSheet(); },
  person(el) { UI.person = el.dataset.id; render(); },
  viewPerson(el) { UI.person = el.dataset.id; UI.tab = 'progress'; render(); window.scrollTo(0, 0); },
